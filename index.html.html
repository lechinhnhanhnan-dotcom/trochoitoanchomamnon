<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bé Khám Phá Ngân Hà - Ứng Dụng AI Giáo Dục Mầm Non</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.responsivevoice.org/responsivevoice.js?key=free"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      margin: 0;
      background-color: #F8F4EC;
      color: #202E59;
      overflow-x: hidden;
      user-select: none;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-float { animation: floatSlow 3.4s ease-in-out infinite; }
    .touch-card { touch-action: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    (function () {
      // =========================================================================
      // 1. DỮ LIỆU CHUẨN MỤC TIÊU GIÁO DỤC MẦM NON (SINGLE SOURCE OF TRUTH)
      // =========================================================================
      const TARGET_COLORS = {
        red:    { id: 'red',    name: 'Màu đỏ',         hex: '#E53935', exampleObj: 'Quả táo màu đỏ',    objectType: 'apple' },
        yellow: { id: 'yellow', name: 'Màu vàng',       hex: '#F4C430', exampleObj: 'Ngôi sao màu vàng', objectType: 'star' },
        blue:   { id: 'blue',   name: 'Màu xanh dương', hex: '#1976D2', exampleObj: 'Quả bóng màu xanh dương', objectType: 'ball' },
        green:  { id: 'green',  name: 'Màu xanh lá',    hex: '#388E3C', exampleObj: 'Chiếc lá màu xanh lá', objectType: 'leaf' },
        orange: { id: 'orange', name: 'Màu cam',        hex: '#F57C00', exampleObj: 'Quả cam màu cam',   objectType: 'orange' },
        purple: { id: 'purple', name: 'Màu tím',        hex: '#7B1FA2', exampleObj: 'Chùm nho màu tím',  objectType: 'grape' },
        pink:   { id: 'pink',   name: 'Màu hồng',       hex: '#E91E63', exampleObj: 'Bông hoa màu hồng', objectType: 'flower' },
        white:  { id: 'white',  name: 'Màu trắng',      hex: '#FFFFFF', border: '#94A3B8', exampleObj: 'Đám mây màu trắng', objectType: 'cloud' },
        black:  { id: 'black',  name: 'Màu đen',        hex: '#212121', exampleObj: 'Chiếc ô tô màu đen', objectType: 'car' },
        brown:  { id: 'brown',  name: 'Màu nâu',        hex: '#795548', exampleObj: 'Quả bóng màu nâu',  objectType: 'ball' }
      };

      const SHAPES_DATA = {
        circle:    { id: 'circle',    name: 'Hình tròn',     desc: 'Hình tròn có đường bao cong khép kín, lăn được.', colorId: 'red' },
        square:    { id: 'square',    name: 'Hình vuông',    desc: 'Hình vuông có bốn cạnh bằng nhau và bốn góc vuông.', colorId: 'blue' },
        triangle:  { id: 'triangle',  name: 'Hình tam giác', desc: 'Hình tam giác có ba cạnh thẳng và ba góc nhọn.', colorId: 'yellow' },
        rectangle: { id: 'rectangle', name: 'Hình chữ nhật', desc: 'Hình chữ nhật có hai cạnh dài và hai cạnh ngắn.', colorId: 'green' }
      };

      const SOLIDS_DATA = {
        sphere:   { id: 'sphere',   name: 'Khối cầu',     desc: 'Khối cầu tròn đều mọi phía và lăn được về mọi hướng.', realName: 'Quả bóng tròn', realType: 'ball', colorId: 'red' },
        cylinder: { id: 'cylinder', name: 'Khối trụ',     desc: 'Khối trụ có hai mặt đáy tròn và lăn được khi nằm ngang.', realName: 'Lon nước ngọt', realType: 'can', colorId: 'blue' },
        cube:     { id: 'cube',     name: 'Khối vuông',   desc: 'Khối vuông có sáu mặt đều là hình vuông bằng nhau.', realName: 'Khối Rubik vuông', realType: 'rubik', colorId: 'yellow' },
        cuboid:   { id: 'cuboid',   name: 'Khối chữ nhật',desc: 'Khối chữ nhật có sáu mặt là hình chữ nhật, xếp chồng được.', realName: 'Hộp quà chữ nhật', realType: 'giftbox', colorId: 'green' }
      };

      const AGE_GROUPS = [
        { id: '2yo', title: 'Nhà trẻ 2 tuổi',   subtitle: '24 – 36 tháng tuổi', bg: '#E8F5E9', accent: '#2E7D32' },
        { id: '3yo', title: 'Mẫu giáo 3 tuổi', subtitle: '3 – 4 tuổi',         bg: '#E3F2FD', accent: '#1565C0' },
        { id: '4yo', title: 'Mẫu giáo 4 tuổi', subtitle: '4 – 5 tuổi',         bg: '#FFF8E1', accent: '#EF6C00' },
        { id: '5yo', title: 'Mẫu giáo 5 tuổi', subtitle: '5 – 6 tuổi',         bg: '#F3E5F5', accent: '#6A1B9A' }
      ];

      const PLANETS = [
        { id: 'colors',  title: 'Hành tinh Sắc Màu',  subtitle: 'Nhận biết và phân biệt màu sắc', color: '#E53935', ring: '#F8D375' },
        { id: 'shapes',  title: 'Hành tinh Hình Dạng', subtitle: 'Hình tròn, vuông, tam giác, chữ nhật', color: '#1976D2', ring: '#A8D6E8' },
        { id: 'numbers', title: 'Hành tinh Con Số',   subtitle: 'Số lượng, đếm sao và chữ số', color: '#F4C430', ring: '#F5C6D9' },
        { id: 'solids',  title: 'Hành tinh Khối Hình',subtitle: 'Khối cầu, khối trụ, khối vuông, khối chữ nhật', color: '#7B1FA2', ring: '#A8D6E8' }
      ];

      const PRAISES = [
        'Giỏi lắm! Bé chọn đúng rồi!',
        'Tuyệt vời! Bé giỏi quá đi thôi!',
        'Hoan hô! Phi hành gia nhí làm tốt lắm!',
        'Đúng rồi! Bé thông minh quá!'
      ];

      const ENCOURAGES = [
        'Con thử lại nhé!',
        'Mình cùng nhìn kỹ lại nào!',
        'Bé hãy nghe lại câu hỏi nhé!'
      ];

      function colorLabelForAge(colorId, age) {
        if (age === '2yo' && colorId === 'blue') return 'Màu xanh';
        return TARGET_COLORS[colorId].name;
      }

      // =========================================================================
      // 2. XÂY DỰNG NGÂN HÀNG CÂU HỎI ĐA ĐỘ TUỔI (KHỚP 100% HÌNH ẢNH - LỜI ĐỌC)
      // =========================================================================
      function buildQuestionBank() {
        const bank = [];

        // --- NHÀ TRẺ 2 TUỔI (24 - 36 THÁNG) ---
        const c2Pairs = [
          { ids: ['red', 'blue'], obj: 'apple', objName: 'quả táo' },
          { ids: ['yellow', 'red'], obj: 'star', objName: 'ngôi sao' },
          { ids: ['blue', 'yellow'], obj: 'ball', objName: 'quả bóng' },
          { ids: ['red', 'yellow', 'blue'], obj: 'flower', objName: 'bông hoa' },
          { ids: ['yellow', 'blue', 'red'], obj: 'car', objName: 'chiếc ô tô' },
          { ids: ['blue', 'red', 'yellow'], obj: 'apple', objName: 'quả táo' }
        ];
        c2Pairs.forEach((item, idx) => {
          const targetId = item.ids[0];
          const cLabel = colorLabelForAge(targetId, '2yo').toLowerCase();
          bank.push({
            id: `2yo_c_${idx}`,
            age: '2yo',
            planet: 'colors',
            promptText: `Bé hãy tìm ${item.objName} ${cLabel} nhé!`,
            hintText: `Con nhìn xem, đâu là ${item.objName} ${cLabel}?`,
            targetKey: `c_${targetId}`,
            options: item.ids.map(cid => ({
              key: `c_${cid}`,
              label: `${item.objName.charAt(0).toUpperCase() + item.objName.slice(1)} ${colorLabelForAge(cid, '2yo').toLowerCase()}`,
              kind: 'color',
              colorId: cid,
              objectType: item.obj,
              containerType: 'basket',
              groupId: cid
            }))
          });
        });

        const s2Pairs = [
          ['circle', 'square'],
          ['square', 'circle'],
          ['circle', 'square'],
          ['square', 'circle']
        ];
        s2Pairs.forEach((pair, idx) => {
          const tId = pair[0];
          const cols = ['red', 'blue', 'yellow'];
          bank.push({
            id: `2yo_s_${idx}`,
            age: '2yo',
            planet: 'shapes',
            promptText: `Bé hãy chọn ${SHAPES_DATA[tId].name.toLowerCase()} nào!`,
            hintText: SHAPES_DATA[tId].desc,
            targetKey: `s_${tId}`,
            options: pair.map((sid, i) => ({
              key: `s_${sid}`,
              label: SHAPES_DATA[sid].name,
              kind: 'shape',
              shapeId: sid,
              colorId: cols[(idx + i) % 3],
              containerType: 'house',
              groupId: sid
            }))
          });
        });

        const n2Items = [
          { target: 'one', prompt: 'Bé chỉ cho cô nhóm có một quả táo!', obj: 'apple', manyCount: 4 },
          { target: 'many', prompt: 'Đâu là nhóm có nhiều ngôi sao?', obj: 'star', manyCount: 5 },
          { target: 'one', prompt: 'Bé tìm nhóm có một bông hoa nhé!', obj: 'flower', manyCount: 4 },
          { target: 'many', prompt: 'Nhóm nào có nhiều quả bóng vậy bé?', obj: 'ball', manyCount: 5 }
        ];
        n2Items.forEach((item, idx) => {
          bank.push({
            id: `2yo_n_${idx}`,
            age: '2yo',
            planet: 'numbers',
            promptText: item.prompt,
            hintText: item.target === 'one' ? 'Chỉ có đúng một đồ vật đứng một mình thôi con!' : 'Nhóm nào có rất nhiều đồ vật tụ họp nào!',
            targetKey: item.target === 'one' ? 'g_one' : 'g_many',
            options: [
              { key: 'g_one', label: 'Một', kind: 'numberGroup', count: 1, objectType: item.obj, groupId: 'one' },
              { key: 'g_many', label: 'Nhiều', kind: 'numberGroup', count: item.manyCount, objectType: item.obj, groupId: 'many' }
            ]
          });
        });

        // --- MẪU GIÁO 3 TUỔI ---
        const c3List = ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink', 'white', 'black'];
        c3List.forEach((cid, idx) => {
          const d1 = c3List[(idx + 2) % c3List.length];
          const d2 = c3List[(idx + 5) % c3List.length];
          const def = TARGET_COLORS[cid];
          bank.push({
            id: `3yo_c_${idx}`,
            age: '3yo',
            planet: 'colors',
            promptText: `Bé hãy chọn ${def.exampleObj.toLowerCase()} nhé!`,
            hintText: `Con tìm đúng đồ vật có ${def.name.toLowerCase()} nào!`,
            targetKey: `c_${cid}`,
            options: [cid, d1, d2].map(id => ({
              key: `c_${id}`,
              label: TARGET_COLORS[id].exampleObj,
              kind: 'color',
              colorId: id,
              objectType: TARGET_COLORS[id].objectType,
              containerType: 'basket',
              groupId: id
            }))
          });
        });

        const s3Keys = ['circle', 'square', 'triangle', 'rectangle'];
        s3Keys.forEach((sid, idx) => {
          const others = s3Keys.filter(k => k !== sid);
          const cols = ['red', 'blue', 'yellow', 'green'];
          bank.push({
            id: `3yo_s_${idx}`,
            age: '3yo',
            planet: 'shapes',
            promptText: `Bé hãy tìm ${SHAPES_DATA[sid].name.toLowerCase()}!`,
            hintText: SHAPES_DATA[sid].desc,
            targetKey: `s_${sid}`,
            options: [sid, others[0], others[1]].map((id, i) => ({
              key: `s_${id}`,
              label: SHAPES_DATA[id].name,
              kind: 'shape',
              shapeId: id,
              colorId: cols[(idx + i) % 4],
              containerType: 'house',
              groupId: id
            }))
          });
        });

        [1, 2, 3, 4, 5].forEach((n, idx) => {
          const d1 = n === 1 ? 3 : n - 1;
          const d2 = n === 5 ? 2 : n + 1;
          const objs = ['star', 'apple', 'flower', 'ball', 'star'];
          const obj = objs[idx];
          bank.push({
            id: `3yo_n_${n}`,
            age: '3yo',
            planet: 'numbers',
            promptText: `Bé tìm nhóm có ${n} ngôi sao nhé!`,
            hintText: `Con chỉ tay đếm từng ngôi sao đến ${n} nào!`,
            targetKey: `n_${n}`,
            options: [n, d1, d2].map(cnt => ({
              key: `n_${cnt}`,
              label: `${cnt} ngôi sao`,
              kind: 'numberGroup',
              count: cnt,
              objectType: 'star',
              groupId: String(cnt)
            }))
          });
        });

        // --- MẪU GIÁO 4 TUỔI ---
        const combo4 = [
          { shape: 'circle', color: 'red' },
          { shape: 'square', color: 'blue' },
          { shape: 'triangle', color: 'yellow' },
          { shape: 'rectangle', color: 'green' },
          { shape: 'circle', color: 'orange' },
          { shape: 'triangle', color: 'purple' }
        ];
        combo4.forEach((item, idx) => {
          const altColor = item.color === 'red' ? 'blue' : 'red';
          const altShape = item.shape === 'circle' ? 'square' : 'circle';
          const lbl = `${SHAPES_DATA[item.shape].name} ${TARGET_COLORS[item.color].name.toLowerCase()}`;
          bank.push({
            id: `4yo_c_${idx}`,
            age: '4yo',
            planet: 'colors',
            promptText: `Bé tìm ${lbl.toLowerCase()} nhé!`,
            hintText: `Con chú ý cả hai đặc điểm: ${lbl.toLowerCase()}!`,
            targetKey: `${item.shape}_${item.color}`,
            options: [
              { key: `${item.shape}_${item.color}`, label: lbl, kind: 'coloredShape', shapeId: item.shape, colorId: item.color, containerType: 'house' },
              { key: `${item.shape}_${altColor}`, label: `${SHAPES_DATA[item.shape].name} ${TARGET_COLORS[altColor].name.toLowerCase()}`, kind: 'coloredShape', shapeId: item.shape, colorId: altColor, containerType: 'house' },
              { key: `${altShape}_${item.color}`, label: `${SHAPES_DATA[altShape].name} ${TARGET_COLORS[item.color].name.toLowerCase()}`, kind: 'coloredShape', shapeId: altShape, colorId: item.color, containerType: 'house' }
            ]
          });
        });

        s3Keys.forEach((sid, idx) => {
          const others = s3Keys.filter(k => k !== sid);
          const cols = ['red', 'blue', 'yellow', 'green'];
          bank.push({
            id: `4yo_s_${idx}`,
            age: '4yo',
            planet: 'shapes',
            promptText: `Đâu là ${SHAPES_DATA[sid].name.toLowerCase()} vậy bé?`,
            hintText: SHAPES_DATA[sid].desc,
            targetKey: `s_${sid}`,
            options: [sid, ...others].map((id, i) => ({
              key: `s_${id}`,
              label: SHAPES_DATA[id].name,
              kind: 'shape',
              shapeId: id,
              colorId: cols[(idx + i) % 4],
              containerType: 'house',
              groupId: id
            }))
          });
        });

        for (let n = 1; n <= 8; n++) {
          const d1 = n === 1 ? 3 : n - 1;
          const d2 = n === 8 ? 5 : n + 1;
          bank.push({
            id: `4yo_n_${n}`,
            age: '4yo',
            planet: 'numbers',
            promptText: `Bé tìm nhóm có ${n} ngôi sao tương ứng với số ${n}!`,
            hintText: `Con đếm kỹ từng ngôi sao để tìm nhóm có ${n} ngôi sao nhé!`,
            targetKey: `n_${n}`,
            options: [n, d1, d2].map(cnt => ({
              key: `n_${cnt}`,
              label: `${cnt} ngôi sao`,
              kind: 'numberGroup',
              count: cnt,
              objectType: 'star'
            }))
          });
        }

        // --- MẪU GIÁO 5 TUỔI (BAO GỒM ĐẦY ĐỦ HÌNH KHỐI 3D) ---
        combo4.forEach((item, idx) => {
          const altColor = item.color === 'purple' ? 'orange' : 'purple';
          const altShape = item.shape === 'triangle' ? 'rectangle' : 'triangle';
          const lbl = `${SHAPES_DATA[item.shape].name} ${TARGET_COLORS[item.color].name.toLowerCase()}`;
          bank.push({
            id: `5yo_c_${idx}`,
            age: '5yo',
            planet: 'colors',
            promptText: `Phi hành gia hãy chọn ${lbl.toLowerCase()}!`,
            hintText: `Tìm đúng ${lbl.toLowerCase()} nhé!`,
            targetKey: `${item.shape}_${item.color}`,
            options: [
              { key: `${item.shape}_${item.color}`, label: lbl, kind: 'coloredShape', shapeId: item.shape, colorId: item.color, containerType: 'house' },
              { key: `${item.shape}_${altColor}`, label: `${SHAPES_DATA[item.shape].name} ${TARGET_COLORS[altColor].name.toLowerCase()}`, kind: 'coloredShape', shapeId: item.shape, colorId: altColor, containerType: 'house' },
              { key: `${altShape}_${item.color}`, label: `${SHAPES_DATA[altShape].name} ${TARGET_COLORS[item.color].name.toLowerCase()}`, kind: 'coloredShape', shapeId: altShape, colorId: item.color, containerType: 'house' }
            ]
          });
        });

        s3Keys.forEach((sid, idx) => {
          const others = s3Keys.filter(k => k !== sid);
          const cols = ['red', 'blue', 'yellow', 'green'];
          bank.push({
            id: `5yo_s_${idx}`,
            age: '5yo',
            planet: 'shapes',
            promptText: `Bé chọn ${SHAPES_DATA[sid].name.toLowerCase()} nào!`,
            hintText: SHAPES_DATA[sid].desc,
            targetKey: `s_${sid}`,
            options: [sid, ...others].map((id, i) => ({
              key: `s_${id}`,
              label: SHAPES_DATA[id].name,
              kind: 'shape',
              shapeId: id,
              colorId: cols[(idx + i) % 4],
              containerType: 'house'
            }))
          });
        });

        for (let n = 1; n <= 10; n++) {
          const d1 = n <= 2 ? n + 2 : n - 2;
          const d2 = n >= 9 ? n - 1 : n + 1;
          bank.push({
            id: `5yo_n_${n}`,
            age: '5yo',
            planet: 'numbers',
            promptText: `Chọn nhóm có đúng ${n} ngôi sao ngân hà!`,
            hintText: `Đếm lần lượt từ trái sang phải để tìm đúng ${n} ngôi sao nhé!`,
            targetKey: `n_${n}`,
            options: [n, d1, d2].map(cnt => ({
              key: `n_${cnt}`,
              label: `${cnt} ngôi sao`,
              kind: 'numberGroup',
              count: cnt,
              objectType: 'star'
            }))
          });
        }

        const solidKeys = ['sphere', 'cylinder', 'cube', 'cuboid'];
        solidKeys.forEach((sid, idx) => {
          const others = solidKeys.filter(k => k !== sid);
          bank.push({
            id: `5yo_sol_${idx}`,
            age: '5yo',
            planet: 'solids',
            promptText: `Bé hãy chọn ${SOLIDS_DATA[sid].name} nào!`,
            hintText: SOLIDS_DATA[sid].desc,
            targetKey: `sol_${sid}`,
            options: [sid, others[0], others[1]].map(id => ({
              key: `sol_${id}`,
              label: SOLIDS_DATA[id].name,
              kind: 'solid',
              solidId: id,
              colorId: SOLIDS_DATA[id].colorId,
              containerType: 'house',
              groupId: id
            }))
          });
          bank.push({
            id: `5yo_sol_real_${idx}`,
            age: '5yo',
            planet: 'solids',
            promptText: `Đồ vật nào có dạng ${SOLIDS_DATA[sid].name}?`,
            hintText: `${SOLIDS_DATA[sid].realName} có dạng ${SOLIDS_DATA[sid].name.toLowerCase()} đấy con!`,
            targetKey: `sol_${sid}`,
            options: [sid, others[0], others[1]].map(id => ({
              key: `sol_${id}`,
              label: SOLIDS_DATA[id].realName,
              kind: 'realObject',
              solidId: id,
              realObjectType: SOLIDS_DATA[id].realType,
              colorId: SOLIDS_DATA[id].colorId,
              containerType: 'house',
              groupId: id
            }))
          });
        });

        return bank;
      }

      // =========================================================================
      // 3. HỆ THỐNG GIỌNG ĐỌC TIẾNG VIỆT MIỀN NAM ĐA TẦNG (ĐỌC TRỌN VẸN CÂU KHEN)
      // =========================================================================
      let speechToken = 0;
      let currentAudio = null;

      function stopSpeech() {
        speechToken++;
        if ('speechSynthesis' in window) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        if (currentAudio) {
          try { currentAudio.pause(); currentAudio.src = ''; } catch (e) {}
          currentAudio = null;
        }
        if (window.responsiveVoice && typeof window.responsiveVoice.cancel === 'function') {
          try { window.responsiveVoice.cancel(); } catch (e) {}
        }
      }

      function pickSouthernVietnameseVoice(voices) {
        if (!voices || !voices.length) return null;
        const viVoices = voices.filter(v => (v.lang || '').toLowerCase().includes('vi'));
        if (!viVoices.length) return null;
        return (
          viVoices.find(v => /linh|hoaimy|southern|nam|female/i.test(v.name)) ||
          viVoices[0]
        );
      }

      function splitTextChunks(text) {
        const raw = text.match(/[^.!?]+[.!?]*/g) || [text];
        return raw.map(s => s.trim()).filter(Boolean);
      }

      function playGoogleTTSChunks(chunks, token, rate, onAllDone) {
        if (!chunks.length || token !== speechToken) {
          if (token === speechToken && typeof onAllDone === 'function') onAllDone();
          return;
        }
        const chunk = chunks.shift();
        const encoded = encodeURIComponent(chunk);
        const urls = [
          `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${encoded}&tl=vi&client=tw-ob`,
          `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${encoded}&tl=vi&client=gtx`
        ];
        let idx = 0;

        function tryNext() {
          if (token !== speechToken) return;
          if (idx >= urls.length) {
            if (window.responsiveVoice && typeof window.responsiveVoice.speak === 'function') {
              window.responsiveVoice.speak(chunk, 'Vietnamese Female', {
                rate: Math.min(1.1, Math.max(0.75, rate)),
                pitch: 1.08,
                volume: 1,
                onend: () => playGoogleTTSChunks(chunks, token, rate, onAllDone)
              });
            } else if (typeof onAllDone === 'function') {
              onAllDone();
            }
            return;
          }
          const audio = new Audio(urls[idx]);
          audio.volume = 1.0;
          audio.playbackRate = Math.min(1.15, Math.max(0.8, rate + 0.04));
          currentAudio = audio;
          audio.onended = () => {
            if (token === speechToken) playGoogleTTSChunks(chunks, token, rate, onAllDone);
          };
          audio.onerror = () => {
            idx++;
            tryNext();
          };
          audio.play().catch(() => {
            idx++;
            tryNext();
          });
        }
        tryNext();
      }

      function speak(text, onComplete) {
        if (!AppState.config.soundEnabled || !text) {
          if (typeof onComplete === 'function') setTimeout(onComplete, 900);
          return;
        }
        stopSpeech();
        const token = ++speechToken;
        const rate = AppState.config.speechRate || 0.88;
        const chunks = splitTextChunks(text);
        let finished = false;

        const finishOnce = () => {
          if (finished || token !== speechToken) return;
          finished = true;
          if (typeof onComplete === 'function') {
            setTimeout(onComplete, 350);
          }
        };

        const safetyTimer = setTimeout(finishOnce, Math.max(2800, text.length * 145));
        const wrappedComplete = () => {
          clearTimeout(safetyTimer);
          finishOnce();
        };

        if ('speechSynthesis' in window) {
          const voices = window.speechSynthesis.getVoices();
          const viVoice = pickSouthernVietnameseVoice(voices);
          if (viVoice) {
            let started = false;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'vi-VN';
            utter.voice = viVoice;
            utter.rate = rate;
            utter.pitch = 1.08;
            utter.onstart = () => { started = true; };
            utter.onend = () => {
              if (token === speechToken) wrappedComplete();
            };
            utter.onerror = () => {
              if (token === speechToken) playGoogleTTSChunks([...chunks], token, rate, wrappedComplete);
            };
            window.speechSynthesis.speak(utter);
            setTimeout(() => {
              if (!started && token === speechToken) {
                window.speechSynthesis.cancel();
                playGoogleTTSChunks([...chunks], token, rate, wrappedComplete);
              }
            }, 650);
            return;
          }
        }
        playGoogleTTSChunks([...chunks], token, rate, wrappedComplete);
      }

      document.addEventListener('pointerdown', () => {
        if (window.audioCtx && window.audioCtx.state === 'suspended') {
          window.audioCtx.resume();
        }
      });

      // 5. TRẠNG THÁI ỨNG DỤNG & TẢI FILE HTML TRỰC TIẾP VỀ MÁY

      const AppState = {
        screen: 'welcome',
        planet: 'colors',
        mode: 'explore',
        game: 'tap',
        exploreIdx: 0,
        qIdx: 0,
        sessionQuestions: [],
        shuffledOptions: [],
        isSolved: false,
        wrongKey: null,
        feedback: '',
        dragMatched: [],
        matchLeft: null,
        matchSolved: [],
        starTarget: 3,
        starCounted: [],
        starChoices: [],
        sortSorted: [],
        config: {
          selectedAge: '2yo',
          soundEnabled: true,
          speechRate: 0.88,
          questionsPerSession: 5
        },
        stats: {
          sessions: 0,
          correct: 0,
          attempts: 0
        }
      };

      const BANK = buildQuestionBank();

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // Nút tải file HTML độc lập trực tiếp về máy tính/điện thoại
      window.downloadGameHTML = function () {
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'BeKhamPhaNganHa.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      function getFilteredQuestions() {
        return BANK.filter(q => q.age === AppState.config.selectedAge && q.planet === AppState.planet);
      }

      function startPracticeOrGame(mode, gameType = 'tap') {
        AppState.mode = mode;
        AppState.game = gameType;
        const pool = shuffle(getFilteredQuestions());
        const count = mode === 'practice' || gameType === 'challenge' ? AppState.config.questionsPerSession : Math.min(4, pool.length);
        AppState.sessionQuestions = pool.slice(0, Math.min(count, pool.length));
        AppState.qIdx = 0;
        prepareQuestion();
        render();
      }

      function prepareQuestion() {
        AppState.isSolved = false;
        AppState.wrongKey = null;
        AppState.feedback = '';
        const q = AppState.sessionQuestions[AppState.qIdx];
        if (!q) return;
        AppState.shuffledOptions = shuffle(q.options);
        AppState.dragMatched = [];
        AppState.matchLeft = null;
        AppState.matchSolved = [];
        AppState.sortSorted = [];

        if (AppState.mode === 'play' && AppState.game === 'countStars') {
          const maxS = AppState.config.selectedAge === '2yo' ? 3 : AppState.config.selectedAge === '3yo' ? 5 : 8;
          AppState.starTarget = Math.floor(Math.random() * maxS) + 1;
          AppState.starCounted = [];
          const d1 = AppState.starTarget === 1 ? 2 : AppState.starTarget - 1;
          const d2 = AppState.starTarget >= 8 ? 6 : AppState.starTarget + 1;
          AppState.starChoices = shuffle([AppState.starTarget, d1, d2]);
          speak('Bé hãy chạm vào từng ngôi sao để cùng đếm nhé!');
        } else if (AppState.mode === 'play' && AppState.game === 'drag') {
          speak('Bé hãy kéo từng đồ vật thả vào đúng giỏ hoặc ngôi nhà cùng màu nhé!');
        } else if (AppState.mode === 'play' && AppState.game === 'match') {
          speak('Bé hãy tìm hai bạn thân giống nhau nhé!');
        } else if (AppState.mode === 'play' && AppState.game === 'sort') {
          speak('Bé hãy phân loại các đồ vật vào đúng giỏ nhé!');
        } else {
          speak(q.promptText);
        }
      }

      function getExploreCards() {
        const age = AppState.config.selectedAge;
        const planet = AppState.planet;
        if (planet === 'colors') {
          const keys = age === '2yo' ? ['red', 'yellow', 'blue'] : ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink', 'white', 'black'];
          return keys.map(cid => {
            const c = TARGET_COLORS[cid];
            const cName = colorLabelForAge(cid, age);
            const objTitle = age === '2yo' && cid === 'blue' ? 'Quả bóng màu xanh' : c.exampleObj;
            return {
              title: `${cName} – ${objTitle}`,
              speech: `Đây là ${objTitle.toLowerCase()}.`,
              svg: renderOptionSVG({ key: cid, kind: 'color', colorId: cid, objectType: c.objectType }, 170)
            };
          });
        }
        if (planet === 'shapes') {
          const keys = age === '2yo' ? ['circle', 'square'] : ['circle', 'square', 'triangle', 'rectangle'];
          return keys.map(sid => {
            const s = SHAPES_DATA[sid];
            const cName = colorLabelForAge(s.colorId, age).toLowerCase();
            return {
              title: `${s.name} ${cName}`,
              desc: s.desc,
              speech: `Đây là ${s.name.toLowerCase()} ${cName}. ${s.desc}`,
              svg: renderOptionSVG({ key: sid, kind: 'shape', shapeId: sid, colorId: s.colorId }, 170)
            };
          });
        }
        if (planet === 'numbers') {
          if (age === '2yo') {
            return [
              {
                title: 'Một quả táo màu đỏ',
                desc: 'Chỉ có 1 quả táo đứng một mình.',
                speech: 'Đây là một quả táo màu đỏ.',
                svg: renderOptionSVG({ key: 'one', kind: 'numberGroup', count: 1, objectType: 'apple' }, 160)
              },
              {
                title: 'Nhiều ngôi sao màu vàng',
                desc: 'Có rất nhiều ngôi sao ở cạnh nhau.',
                speech: 'Đây là nhiều ngôi sao màu vàng.',
                svg: renderOptionSVG({ key: 'many', kind: 'numberGroup', count: 5, objectType: 'star' }, 160)
              }
            ];
          }
          const maxN = age === '3yo' ? 5 : 10;
          return Array.from({ length: maxN }, (_, i) => {
            const n = i + 1;
            return {
              title: `Số ${n} – ${n} ngôi sao màu vàng`,
              desc: `Có tất cả ${n} ngôi sao màu vàng.`,
              speech: `Đây là số ${n}. Có ${n} ngôi sao màu vàng.`,
              svg: `<div class="flex items-center gap-6">${renderOptionSVG({ kind: 'digit', count: n }, 110)}${renderOptionSVG({ kind: 'numberGroup', count: n, objectType: 'star' }, 150)}</div>`
            };
          });
        }
        return Object.values(SOLIDS_DATA).map(s => {
          const cName = TARGET_COLORS[s.colorId].name.toLowerCase();
          return {
            title: `${s.name} ${cName}`,
            desc: `${s.desc} Ví dụ: ${s.realName}.`,
            speech: `Đây là ${s.name.toLowerCase()} ${cName}. ${s.desc}`,
            svg: `<div class="flex items-center gap-6">${renderSolidSVG(s.id, 160)}${renderOptionSVG({ kind: 'realObject', realObjectType: s.realType }, 120)}</div>`
          };
        });
      }

      // =========================================================================
      // 6. KÉO THẢ DI CHUYỂN THỰC THỤ (POINTER EVENTS) CHO TRÒ CHƠI 2
      // =========================================================================
      function bindRealDragEvents() {
        const draggables = document.querySelectorAll('[data-drag-key]');
        const dropzones = document.querySelectorAll('[data-drop-key]');

        draggables.forEach(el => {
          let startX = 0, startY = 0, dragging = false;

          el.addEventListener('pointerdown', (e) => {
            if (el.dataset.done === 'true') return;
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            el.setPointerCapture(e.pointerId);
            el.style.zIndex = '50';
            el.style.transition = 'none';
            el.style.transform = 'scale(1.08)';
            speak(el.dataset.label || '');
          });

          el.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            el.style.transform = `translate(${dx}px, ${dy}px) scale(1.08)`;

            dropzones.forEach(dz => {
              const rect = dz.getBoundingClientRect();
              const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
              dz.classList.toggle('ring-4', inside);
              dz.classList.toggle('ring-emerald-400', inside);
            });
          });

          el.addEventListener('pointerup', (e) => {
            if (!dragging) return;
            dragging = false;
            el.style.zIndex = '';
            dropzones.forEach(dz => dz.classList.remove('ring-4', 'ring-emerald-400'));

            let matchedZone = null;
            dropzones.forEach(dz => {
              const rect = dz.getBoundingClientRect();
              if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                matchedZone = dz;
              }
            });

            if (matchedZone && matchedZone.dataset.dropKey === el.dataset.dragKey && !AppState.dragMatched.includes(el.dataset.dragKey)) {
              AppState.dragMatched.push(el.dataset.dragKey);
              AppState.stats.correct++;
              AppState.stats.attempts++;
              const allDone = AppState.dragMatched.length === AppState.shuffledOptions.length;
              render();
              if (allDone) {
                speak('Tuyệt vời! Bé đã kéo thả đúng tất cả đồ vật rồi!', () => {
                  AppState.screen = 'complete';
                  AppState.stats.sessions++;
                  render();
                });
              } else {
                speak('Giỏi lắm! Bé thả đúng rồi!');
              }
            } else {
              el.style.transition = 'transform 0.35s cubic-bezier(0.22, 1, 0.36, 1)';
              el.style.transform = 'translate(0px, 0px) scale(1)';
              if (matchedZone) {
                AppState.stats.attempts++;
                speak('Con thử lại nhé! Nhìn kỹ màu sắc và hình dạng nào!');
              }
            }
          });
        });
      }

      // =========================================================================
      // 7. CÁC HÀM XỬ LÝ TƯƠNG TÁC NGƯỜI DÙNG
      // =========================================================================
      window.navTo = function (scr) {
        stopSpeech();
        AppState.screen = scr;
        if (scr === 'ageSelect') speak('Bé hãy chọn độ tuổi của mình nhé!');
        if (scr === 'map') speak('Bé muốn khám phá hành tinh nào hôm nay?');
        render();
      };

      window.selectAge = function (ageId) {
        AppState.config.selectedAge = ageId;
        const found = AGE_GROUPS.find(a => a.id === ageId);
        AppState.screen = 'map';
        speak(`Chào mừng bé đến với ${found.title}! Hãy chọn một hành tinh nhé!`);
        render();
      };

      window.openPlanet = function (planetId, mode = 'explore') {
        AppState.planet = planetId;
        AppState.screen = 'lesson';
        AppState.exploreIdx = 0;
        if (mode === 'explore') {
          AppState.mode = 'explore';
          render();
          const cards = getExploreCards();
          if (cards[0]) speak(cards[0].speech);
        } else if (mode === 'practice') {
          startPracticeOrGame('practice');
        } else {
          startPracticeOrGame('play', 'tap');
        }
      };

      window.stepExplore = function (delta) {
        const cards = getExploreCards();
        AppState.exploreIdx = (AppState.exploreIdx + delta + cards.length) % cards.length;
        render();
        speak(cards[AppState.exploreIdx].speech);
      };

      window.chooseOption = function (key) {
        if (AppState.isSolved) return;
        const q = AppState.sessionQuestions[AppState.qIdx];
        if (!q) return;
        AppState.stats.attempts++;

        if (key === q.targetKey) {
          AppState.isSolved = true;
          AppState.wrongKey = null;
          AppState.stats.correct++;
          const praise = PRAISES[Math.floor(Math.random() * PRAISES.length)];
          const chosen = q.options.find(o => o.key === key);
          AppState.feedback = praise;
          render();

          // Đọc trọn vẹn 100% câu khen rồi mới tự động chuyển câu tiếp theo
          speak(`${praise} Đúng là ${chosen ? chosen.label.toLowerCase() : ''} rồi!`, () => {
            if (AppState.qIdx < AppState.sessionQuestions.length - 1) {
              AppState.qIdx++;
              prepareQuestion();
              render();
            } else {
              AppState.stats.sessions++;
              AppState.screen = 'complete';
              render();
              speak('Hoan hô! Bé đã hoàn thành xuất sắc chuyến du hành ngân hà!');
            }
          });
        } else {
          AppState.wrongKey = key;
          const enc = ENCOURAGES[Math.floor(Math.random() * ENCOURAGES.length)];
          AppState.feedback = enc;
          render();
          speak(`${enc} ${q.hintText}`);
        }
      };

      window.tapStar = function (idx) {
        if (AppState.starCounted.includes(idx)) {
          speak(`Ngôi sao này đếm rồi, hiện có ${AppState.starCounted.length} ngôi sao.`);
          return;
        }
        AppState.starCounted.push(idx);
        render();
        const cnt = AppState.starCounted.length;
        if (cnt === AppState.starTarget) {
          speak(`${cnt}! Có tất cả ${cnt} ngôi sao! Giờ bé chọn số ${cnt} bên dưới nhé!`);
        } else {
          speak(`${cnt}`);
        }
      };

      window.chooseStarDigit = function (num) {
        if (AppState.isSolved) return;
        AppState.stats.attempts++;
        if (num === AppState.starTarget) {
          AppState.isSolved = true;
          AppState.stats.correct++;
          render();
          speak(`Giỏi lắm! Đúng là số ${num} ngôi sao rồi!`, () => {
            AppState.stats.sessions++;
            AppState.screen = 'complete';
            render();
          });
        } else {
          speak(`Con thử lại nhé! Có ${AppState.starTarget} ngôi sao đấy!`);
        }
      };

      window.selectMatchLeft = function (key, label) {
        if (AppState.matchSolved.includes(key)) return;
        AppState.matchLeft = key;
        render();
        speak(label);
      };

      window.selectMatchRight = function (key, label) {
        if (!AppState.matchLeft || AppState.matchSolved.includes(key)) return;
        AppState.stats.attempts++;
        if (AppState.matchLeft === key) {
          AppState.matchSolved.push(key);
          AppState.matchLeft = null;
          AppState.stats.correct++;
          const done = AppState.matchSolved.length === AppState.shuffledOptions.length;
          render();
          if (done) {
            speak('Tuyệt vời! Bé đã tìm đúng tất cả đôi bạn thân rồi!', () => {
              AppState.stats.sessions++;
              AppState.screen = 'complete';
              render();
            });
          } else {
            speak(`Giỏi lắm! Đúng là ${label.toLowerCase()}!`);
          }
        } else {
          speak('Con thử lại nhé! Hai thẻ này chưa giống nhau rồi!');
        }
      };

      window.sortToBasket = function (groupId) {
        const remaining = AppState.shuffledOptions.filter(o => !AppState.sortSorted.includes(o.key));
        const cur = remaining[0];
        if (!cur) return;
        AppState.stats.attempts++;
        if ((cur.groupId || cur.colorId || cur.shapeId) === groupId) {
          AppState.sortSorted.push(cur.key);
          AppState.stats.correct++;
          const done = AppState.sortSorted.length === AppState.shuffledOptions.length;
          render();
          if (done) {
            speak('Hoan hô! Bé đã phân loại đúng hết rồi!', () => {
              AppState.stats.sessions++;
              AppState.screen = 'complete';
              render();
            });
          } else {
            speak('Giỏi lắm! Đúng giỏ rồi!');
          }
        } else {
          speak('Con thử lại nhé! Nhìn kỹ đặc điểm của vật này xem thuộc giỏ nào nào!');
        }
      };

      window.toggleSound = function () {
        AppState.config.soundEnabled = !AppState.config.soundEnabled;
        if (!AppState.config.soundEnabled) stopSpeech();
        render();
      };

      window.replayAudio = function () {
        if (AppState.mode === 'explore') {
          const cards = getExploreCards();
          if (cards[AppState.exploreIdx]) speak(cards[AppState.exploreIdx].speech);
        } else {
          const q = AppState.sessionQuestions[AppState.qIdx];
          if (q) speak(q.promptText);
        }
      };

                          <svg width="110" height="90" viewBox="0 0 120 100">
                            <circle cx="60" cy="50" r="34" fill="${p.color}"/>
                            <ellipse cx="60" cy="52" rx="52" ry="13" transform="rotate(-16 60 52)" fill="none" stroke="${p.ring}" stroke-width="5"/>
                          </svg>
                        </div>
                        <h3 class="text-2xl font-black text-center mb-1">${p.title}</h3>
                        <p class="text-sm font-semibold text-slate-600 text-center mb-4">${p.subtitle}</p>
                      </div>
                      <div class="space-y-2.5">
                        <button onclick="openPlanet('${p.id}', 'explore')" class="w-full min-h-[60px] rounded-2xl bg-[#A8D6E8] hover:bg-[#93c9df] font-extrabold text-lg">
                          👀 1. Bé khám phá
                        </button>
                        <button onclick="openPlanet('${p.id}', 'practice')" class="w-full min-h-[60px] rounded-2xl bg-[#F8D375] hover:bg-[#f4c653] font-extrabold text-lg">
                          ✅ 2. Bé thực hành
                        </button>
                        <button onclick="openPlanet('${p.id}', 'play')" class="w-full min-h-[60px] rounded-2xl bg-[#202E59] hover:bg-[#2d3f78] text-white font-extrabold text-lg">
                          🎮 3. Bé vui chơi
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </main>
            </div>`;
          return;
        }

        if (AppState.screen === 'complete') {
          root.innerHTML = `
            <div class="flex-1 bg-[#F8F4EC] flex items-center justify-center p-6 text-center">
              <div class="max-w-xl w-full bg-white rounded-3xl p-8 shadow-xl border-4 border-[#F8D375]">
                <div class="flex justify-center mb-3 animate-float">${renderBeSaoSVG('happy', 136)}</div>
                <div class="text-4xl mb-3">⭐⭐⭐</div>
                <h2 class="text-3xl sm:text-4xl font-black text-[#202E59] mb-2">Hoan hô phi hành gia nhí!</h2>
                <p class="text-lg sm:text-xl font-bold text-slate-600 mb-8">Bé đã hoàn thành xuất sắc hoạt động rồi!</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <button onclick="openPlanet('${AppState.planet}', '${AppState.mode}')" class="min-h-[70px] rounded-2xl bg-[#F8D375] font-black text-xl">
                    🔄 Chơi lại
                  </button>
                  <button onclick="navTo('map')" class="min-h-[70px] rounded-2xl bg-[#202E59] text-white font-black text-xl">
                    🌌 Về Ngân hà
                  </button>
                </div>
              </div>
            </div>`;
          return;
        }

        if (AppState.screen === 'teacher') {
          root.innerHTML = `
            <div class="flex-1 bg-slate-50 p-4 sm:p-8">
              <div class="max-w-4xl mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-md border border-slate-200 space-y-6">
                <div class="flex flex-wrap items-center justify-between gap-4 border-b pb-4">
                  <h2 class="text-2xl font-black text-[#202E59]">GÓC GIÁO VIÊN – QUẢN LÝ & CÀI ĐẶT</h2>
                  <button onclick="navTo('map')" class="min-h-[52px] px-5 rounded-xl bg-[#202E59] text-white font-bold">
                    ⬅️ Quay lại Bé học
                  </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div class="p-4 rounded-2xl bg-slate-50 border">
                    <div class="font-bold text-slate-600">Số lượt hoàn thành</div>
                    <div class="text-3xl font-black text-[#202E59]">${AppState.stats.sessions} lượt</div>
                  </div>
                  <div class="p-4 rounded-2xl bg-slate-50 border">
                    <div class="font-bold text-slate-600">Tỷ lệ trả lời đúng</div>
                    <div class="text-3xl font-black text-emerald-700">${AppState.stats.correct} / ${AppState.stats.attempts}</div>
                  </div>
                </div>

                <div class="space-y-3">
                  <button onclick="speak('Xin chào cô giáo Lê Chinh Nhân và các bé yêu! Giọng đọc tiếng Việt miền Nam đang hoạt động rất tốt ạ!')"
                    class="min-h-[56px] px-6 rounded-2xl bg-[#F8D375] font-extrabold text-[#202E59]">
                    🔊 Nghe thử giọng đọc tiếng Việt miền Nam
                  </button>
                </div>

                <div class="p-5 rounded-2xl bg-[#F8F4EC] text-sm space-y-1">
                  <div><strong>Tác giả:</strong> Cô giáo Lê Chinh Nhân</div>
                  <div><strong>Đơn vị:</strong> Trường Mầm non Giang Thành, Xã Giang Thành, Tỉnh An Giang</div>
                  <div><strong>Email:</strong> lechinhnhanhnan@gmail.com</div>
                </div>
              </div>
            </div>`;
          return;
        }

        // MÀN HÌNH HỌC & VUI CHƠI (EXPLORE / PRACTICE / PLAY)
        const cards = getExploreCards();
        const curCard = cards[AppState.exploreIdx] || cards[0];
        const q = AppState.sessionQuestions[AppState.qIdx];

        let bodyHTML = '';
        if (AppState.mode === 'explore' && curCard) {
          bodyHTML = `
            <div class="max-w-3xl w-full mx-auto bg-white rounded-3xl p-6 sm:p-10 shadow-lg border-2 border-slate-200 text-center">
              <div class="flex items-center justify-between mb-4">
                <span class="px-4 py-1.5 rounded-full bg-[#A8D6E8]/40 font-extrabold">Thẻ ${AppState.exploreIdx + 1} / ${cards.length}</span>
                <button onclick="replayAudio()" class="min-h-[60px] px-5 rounded-2xl bg-[#F8D375] font-extrabold text-lg">🔊 Nghe lại</button>
              </div>
              <div class="min-h-[210px] flex items-center justify-center my-4">${curCard.svg}</div>
              <h3 class="text-2xl sm:text-4xl font-black text-[#202E59] mb-2">${curCard.title}</h3>
              ${curCard.desc ? `<p class="text-base sm:text-xl font-semibold text-slate-600 mb-6">${curCard.desc}</p>` : '<div class="mb-6"></div>'}
              <div class="flex items-center justify-between gap-3">
                <button onclick="stepExplore(-1)" class="min-h-[68px] px-6 rounded-2xl bg-slate-100 font-extrabold text-lg">⬅️ Trước</button>
                ${AppState.exploreIdx < cards.length - 1
                  ? `<button onclick="stepExplore(1)" class="min-h-[68px] px-8 rounded-2xl bg-[#202E59] text-white font-extrabold text-xl">Tiếp theo ➡️</button>`
                  : `<button onclick="openPlanet('${AppState.planet}', 'practice')" class="min-h-[68px] px-8 rounded-2xl bg-[#388E3C] text-white font-extrabold text-xl">Sang Thực hành ✅</button>`}
              </div>
            </div>`;
        } else if (AppState.mode === 'play' && AppState.game === 'drag' && q) {
          bodyHTML = `
            <div class="max-w-4xl w-full mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200">
              <div class="flex items-center justify-between gap-4 mb-6">
                <div class="flex items-center gap-3">
                  ${renderBeSaoSVG('guide', 70)}
                  <h3 class="text-xl sm:text-2xl font-black text-[#202E59]">Bé hãy kéo từng đồ vật di chuyển thả vào đúng giỏ hoặc ngôi nhà cùng màu nhé!</h3>
                </div>
                <button onclick="speak('Bé hãy kéo từng đồ vật di chuyển thả vào đúng giỏ hoặc ngôi nhà cùng màu nhé!')" class="min-h-[60px] px-4 rounded-2xl bg-[#F8D375] font-bold shrink-0">🔊 Nghe</button>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8">
                ${AppState.shuffledOptions.map(opt => {
                  const isDone = AppState.dragMatched.includes(opt.key);
                  return `
                    <div data-drag-key="${opt.key}" data-done="${isDone}" data-label="${opt.label}"
                      class="touch-card min-h-[145px] p-4 rounded-3xl border-4 flex flex-col items-center justify-center transition ${
                        isDone ? 'opacity-20 border-slate-200 bg-slate-50' : 'border-[#6C6AA7] bg-white shadow-md cursor-grab active:cursor-grabbing'
                      }">
                      ${renderOptionSVG(opt, 92)}
                      <span class="font-extrabold text-base mt-1 text-center">${opt.label}</span>
                    </div>`;
                }).join('')}
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                ${q.options.map(opt => {
                  const isDone = AppState.dragMatched.includes(opt.key);
                  return `
                    <div data-drop-key="${opt.key}"
                      class="min-h-[160px] p-4 rounded-3xl border-4 border-dashed flex flex-col items-center justify-center transition ${
                        isDone ? 'border-[#388E3C] bg-emerald-50 border-solid' : 'border-slate-300 bg-[#F8F4EC]'
                      }">
                      ${renderContainerSVG(opt, isDone)}
                    </div>`;
                }).join('')}
              </div>
            </div>`;
        } else if (AppState.mode === 'play' && AppState.game === 'countStars') {
          bodyHTML = `
            <div class="max-w-4xl w-full mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200 text-center">
              <div class="flex items-center justify-between mb-4">
                <span class="px-4 py-1.5 rounded-full bg-[#202E59] text-[#F8D375] font-extrabold text-lg">
                  Đã đếm: ${AppState.starCounted.length} ngôi sao
                </span>
                <button onclick="speak('Bé hãy chạm vào từng ngôi sao để cùng đếm nhé!')" class="min-h-[60px] px-4 rounded-2xl bg-[#F8D375] font-bold">🔊 Nghe lại</button>
              </div>
              <div class="bg-[#202E59] rounded-3xl p-6 min-h-[200px] flex flex-wrap items-center justify-center gap-4 mb-6">
                ${Array.from({ length: AppState.starTarget }).map((_, idx) => {
                  const order = AppState.starCounted.indexOf(idx);
                  const counted = order !== -1;
                  return `
                    <button onclick="tapStar(${idx})" class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex items-center justify-center ${counted ? 'bg-white/20 ring-4 ring-[#F8D375]' : 'bg-white/10'}">
                      <svg width="62" height="62" viewBox="0 0 32 32">
                        <polygon points="16,2 20,11 30,12 22,19 25,29 16,23 7,29 10,19 2,12 12,11" fill="${counted ? '#F4C430' : '#94A3B8'}" stroke="#FFF" stroke-width="1.5"/>
                      </svg>
                      ${counted ? `<span class="absolute -top-2 -right-2 w-8 h-8 rounded-full bg-[#388E3C] text-white font-black flex items-center justify-center">${order + 1}</span>` : ''}
                    </button>`;
                }).join('')}
              </div>
              <p class="text-xl font-black text-[#202E59] mb-4">Có tất cả bao nhiêu ngôi sao? Bé chọn số đúng nhé!</p>
              <div class="grid grid-cols-3 gap-4 max-w-lg mx-auto">
                ${AppState.starChoices.map(num => `
                  <button onclick="chooseStarDigit(${num})" class="min-h-[90px] rounded-3xl border-4 font-black text-4xl ${AppState.isSolved && num === AppState.starTarget ? 'bg-emerald-100 border-[#388E3C]' : 'bg-[#F8F4EC] border-slate-200'}">
                    ${num}
                  </button>`).join('')}
              </div>
            </div>`;
        } else if (AppState.mode === 'play' && AppState.game === 'match' && q) {
          bodyHTML = `
            <div class="max-w-4xl w-full mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200">
              <h3 class="text-xl sm:text-2xl font-black text-[#202E59] mb-6 text-center">Chạm một thẻ bên trái rồi chạm thẻ giống nhau bên phải nhé!</h3>
              <div class="grid grid-cols-2 gap-6 sm:gap-12">
                <div class="space-y-4">
                  ${q.options.map(opt => {
                    const done = AppState.matchSolved.includes(opt.key);
                    const picked = AppState.matchLeft === opt.key;
                    return `
                      <button onclick="selectMatchLeft('${opt.key}', '${opt.label}')" class="w-full min-h-[130px] p-4 rounded-3xl border-4 flex flex-col items-center justify-center ${
                        done ? 'bg-emerald-50 border-[#388E3C] opacity-50' : picked ? 'bg-amber-50 border-[#F4C430] scale-105' : 'bg-white border-slate-200'
                      }">
                        ${renderOptionSVG(opt, 84)}
                        <span class="font-extrabold text-base mt-1">${opt.label}</span>
                      </button>`;
                  }).join('')}
                </div>
                <div class="space-y-4">
                  ${AppState.shuffledOptions.map(opt => {
                    const done = AppState.matchSolved.includes(opt.key);
                    return `
                      <button onclick="selectMatchRight('${opt.key}', '${opt.label}')" class="w-full min-h-[130px] p-4 rounded-3xl border-4 flex flex-col items-center justify-center ${
                        done ? 'bg-emerald-50 border-[#388E3C] opacity-50' : AppState.matchLeft ? 'bg-sky-50 border-[#1976D2]' : 'bg-white border-slate-200'
                      }">
                        ${renderOptionSVG(opt, 84)}
                        <span class="font-extrabold text-base mt-1">${opt.label}</span>
                      </button>`;
                  }).join('')}
                </div>
              </div>
            </div>`;
        } else if (AppState.mode === 'play' && AppState.game === 'sort' && q) {
          const remaining = AppState.shuffledOptions.filter(o => !AppState.sortSorted.includes(o.key));
          const curItem = remaining[0];
          bodyHTML = `
            <div class="max-w-4xl w-full mx-auto bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200 text-center">
              <h3 class="text-xl sm:text-2xl font-black text-[#202E59] mb-4">Đưa đồ vật đang hiện vào đúng giỏ phân loại nhé!</h3>
              <div class="min-h-[150px] flex items-center justify-center mb-6">
                ${curItem ? `<div class="p-5 rounded-3xl border-4 border-[#202E59] bg-amber-50 shadow-md">${renderOptionSVG(curItem, 96)}<div class="font-black mt-1">${curItem.label}</div></div>` : ''}
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                ${q.options.map(opt => {
                  const gId = opt.groupId || opt.colorId || opt.shapeId;
                  return `
                    <button onclick="sortToBasket('${gId}')" class="p-4 rounded-3xl border-4 border-slate-200 hover:border-[#202E59] bg-[#F8F4EC] flex flex-col items-center justify-center">
                      ${renderContainerSVG(opt, AppState.sortSorted.includes(opt.key))}
                    </button>`;
                }).join('')}
              </div>
            </div>`;
        } else if (q) {
          bodyHTML = `
            <div class="max-w-4xl w-full mx-auto bg-white rounded-3xl p-5 sm:p-8 shadow-lg border-2 border-slate-200">
              <div class="flex items-center justify-between mb-4">
                <span class="px-4 py-1.5 rounded-full bg-[#202E59] text-[#F8D375] font-extrabold">
                  Câu ${AppState.qIdx + 1} / ${AppState.sessionQuestions.length}
                </span>
                <button onclick="replayAudio()" class="min-h-[60px] px-5 rounded-2xl bg-[#F8D375] font-extrabold text-lg">🔊 Nghe lại</button>
              </div>

              <div class="bg-[#F8F4EC] rounded-2xl p-4 sm:p-6 flex items-center gap-4 mb-6">
                ${renderBeSaoSVG(AppState.isSolved ? 'happy' : 'guide', 76)}
                <h3 class="text-xl sm:text-3xl font-black text-[#202E59]">${q.promptText}</h3>
              </div>

              <div class="grid grid-cols-1 ${AppState.shuffledOptions.length === 2 ? 'sm:grid-cols-2' : 'sm:grid-cols-3'} gap-5 mb-5">
                ${AppState.shuffledOptions.map(opt => {
                  const isRight = AppState.isSolved && opt.key === q.targetKey;
                  const isWrong = AppState.wrongKey === opt.key && opt.key !== q.targetKey;
                  return `
                    <button onclick="chooseOption('${opt.key}')"
                      class="min-h-[180px] p-5 rounded-3xl border-4 flex flex-col items-center justify-center gap-3 transition transform active:scale-95 ${
                        isRight ? 'bg-emerald-50 border-[#388E3C] scale-105 shadow-lg' : isWrong ? 'bg-amber-50 border-amber-400' : 'bg-white border-slate-200 hover:border-[#6C6AA7]'
                      }">
                      ${renderOptionSVG(opt, 112)}
                      <span class="text-xl font-black text-[#202E59]">${opt.label}</span>
                    </button>`;
                }).join('')}
              </div>

              ${AppState.feedback ? `
                <div class="px-5 py-3 rounded-2xl font-extrabold text-lg sm:text-xl text-center ${
                  AppState.isSolved ? 'bg-emerald-100 text-emerald-900' : 'bg-amber-100 text-amber-900'
                }">${AppState.feedback}</div>` : ''}
            </div>`;
        }

        const gameTabsHTML = AppState.mode === 'play' ? `
          <div class="max-w-5xl w-full mx-auto grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 mb-5">
            ${[
              ['tap', '1. Chạm đúng nào'],
              ['drag', '2. Kéo thả thông minh'],
              ['match', '3. Tìm đôi bạn thân'],
              ['countStars', '4. Đếm sao ngân hà'],
              ['sort', '5. Phân loại tài giỏi'],
              ['challenge', '6. Thử thách ngân hà']
            ].map(([gid, gtitle]) => `
              <button onclick="startPracticeOrGame('play', '${gid}')"
                class="min-h-[58px] p-2.5 rounded-2xl border-2 font-extrabold text-sm ${
                  AppState.game === gid ? 'bg-[#202E59] text-white border-[#202E59]' : 'bg-white text-[#202E59] border-slate-200'
                }">${gtitle}</button>
            `).join('')}
          </div>` : '';

        root.innerHTML = `
          <div class="flex-1 bg-[#F8F4EC] flex flex-col">
            <header class="bg-white border-b-2 border-slate-200 px-3 sm:px-6 py-3">
              <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
                <button onclick="navTo('map')" class="min-h-[60px] px-5 rounded-2xl bg-slate-100 font-extrabold text-lg">⬅️ Bản đồ</button>
                <div class="flex items-center gap-2 bg-[#F8F4EC] p-1.5 rounded-2xl border">
                  <button onclick="openPlanet('${AppState.planet}', 'explore')" class="min-h-[52px] px-4 rounded-xl font-extrabold ${AppState.mode === 'explore' ? 'bg-[#202E59] text-white' : ''}">Khám phá</button>
                  <button onclick="openPlanet('${AppState.planet}', 'practice')" class="min-h-[52px] px-4 rounded-xl font-extrabold ${AppState.mode === 'practice' ? 'bg-[#202E59] text-white' : ''}">Thực hành</button>
                  <button onclick="openPlanet('${AppState.planet}', 'play')" class="min-h-[52px] px-4 rounded-xl font-extrabold ${AppState.mode === 'play' ? 'bg-[#202E59] text-white' : ''}">Vui chơi</button>
                </div>
                <button onclick="toggleSound()" class="min-h-[60px] min-w-[60px] rounded-2xl bg-slate-100 font-bold text-xl">
                  ${AppState.config.soundEnabled ? '🔊' : '🔇'}
                </button>
              </div>
            </header>
            <main class="flex-1 p-4 sm:p-6 flex flex-col justify-center">
              ${gameTabsHTML}
              ${bodyHTML}
            </main>
          </div>`;

        if (AppState.mode === 'play' && AppState.game === 'drag') {
          bindRealDragEvents();
        }
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
      }

      render();
    })();
  </script>
</body>
</html>
