    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;

    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #F8F4EC;
      color: #202E59;
      overflow-x: hidden;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(1.5deg); }
    }
    @keyframes pulseHint {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 196, 48, 0.8); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 16px rgba(244, 196, 48, 0); }
    }
    @keyframes popIn {
      0% { transform: scale(0.86); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-float { animation: floatSlow 3.6s ease-in-out infinite; }
    .animate-hint { animation: pulseHint 1.5s infinite; }
    .animate-pop { animation: popIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

      background: radial-gradient(circle at 20% 15%, #3B4384 0%, #202E59 55%, #162042 100%);

    try {
      const savedCfg = localStorage.getItem('bkpng_html_cfg_v2');

    function persistState() {
      try {
        localStorage.setItem('bkpng_html_cfg_v2', JSON.stringify(AppState.config));
        localStorage.setItem('bkpng_html_stats_v2', JSON.stringify(AppState.stats));
        localStorage.setItem('bkpng_html_custom_v2', JSON.stringify(AppState.customQuestions));
      } catch (e) {}
    }

    const SoundEngine = (function () {
      let audioCtx = null;
      let currentAudio = null;
      let speechToken = 0;

      function unlockAudio() {
        try {
          if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          }
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
          window.audioCtx = audioCtx;
        } catch (e) {}
      }

      document.addEventListener('pointerdown', unlockAudio, { passive: true });
      document.addEventListener('keydown', unlockAudio, { passive: true });

      function playSFX(type) {
        if (!AppState.config.soundEnabled) return;
        unlockAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        if (type === 'tap') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.08);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'correct') {
          [587.33, 880, 1174.66].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.24, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.36);
          });
        } else if (type === 'retry') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(240, now + 0.18);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.21);
        } else if (type === 'complete') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.13);
            gain.gain.setValueAtTime(0.26, now + idx * 0.13);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.13 + 0.45);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.13);
            osc.stop(now + idx * 0.13 + 0.46);
          });
        }
      }

      function stopAllSpeech() {
        speechToken++;
        try {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        } catch (e) {}
        try {
          if (window.responsiveVoice && typeof window.responsiveVoice.cancel === 'function') {
            window.responsiveVoice.cancel();
          }
        } catch (e) {}
        if (currentAudio) {
          try {
            currentAudio.pause();
            currentAudio.src = '';
          } catch (e) {}
          currentAudio = null;
        }
      }

      function getSouthernVietnameseVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices() || [];
        if (!voices.length) return null;
        const southernKeys = ['linh', 'hoaimy', 'hoai my', 'southern', 'miền nam', 'mien nam'];
        for (const kw of southernKeys) {
          const found = voices.find(
            (v) =>
              (v.lang.toLowerCase().includes('vi') || v.name.toLowerCase().includes('vietnam')) &&
              v.name.toLowerCase().includes(kw)
          );
          if (found) return found;
        }
        return voices.find((v) => v.lang.toLowerCase().includes('vi-vn') || v.lang.toLowerCase().startsWith('vi')) || null;
      }

      function splitIntoChunks(text) {
        const clean = text.replace(/\s+/g, ' ').trim();
        if (!clean) return [];
        const parts = clean.split(/(?<=[.!?])\s+/);
        const chunks = [];
        parts.forEach((p) => {
          if (p.length <= 135) chunks.push(p);
          else p.split(/,\s+/).forEach((s) => chunks.push(s));
        });
        return chunks.filter(Boolean);
      }

      function playGoogleTTSChunks(chunks, token, rate) {
        if (!chunks.length || token !== speechToken) return;
        const chunk = chunks.shift();
        const encoded = encodeURIComponent(chunk);
        const urls = [
          `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${encoded}&tl=vi&client=tw-ob`,
          `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${encoded}&tl=vi&client=gtx`
        ];
        let idx = 0;

        function tryNext() {
          if (token !== speechToken) return;
          if (idx >= urls.length) {
            if (window.responsiveVoice && typeof window.responsiveVoice.speak === 'function') {
              window.responsiveVoice.speak(chunk, 'Vietnamese Female', {
                rate: Math.min(1.1, Math.max(0.75, rate)),
                pitch: 1.08,
                volume: 1,
                onend: () => playGoogleTTSChunks(chunks, token, rate)
              });
            }
            return;
          }
          const audio = new Audio(urls[idx]);
          audio.volume = 1.0;
          audio.playbackRate = Math.min(1.15, Math.max(0.8, rate + 0.04));
          currentAudio = audio;
          audio.onended = () => {
            if (token === speechToken) playGoogleTTSChunks(chunks, token, rate);
          };
          audio.onerror = () => {
            idx++;
            tryNext();
          };
          audio.play().catch(() => {
            idx++;
            tryNext();
          });
        }
        tryNext();
      }

      function speak(text) {
        if (!AppState.config.soundEnabled || !text) return;
        unlockAudio();
        stopAllSpeech();
        const token = ++speechToken;
        const rate = AppState.config.speechRate || 0.88;
        const mode = AppState.config.ttsMode || 'auto';

        if (mode === 'online') {
          playGoogleTTSChunks(splitIntoChunks(text), token, rate);
          return;
        }

        const viVoice = getSouthernVietnameseVoice();
        if (viVoice && 'speechSynthesis' in window) {
          try {
            const utter = new SpeechSynthesisUtterance(text);
            utter.voice = viVoice;
            utter.lang = 'vi-VN';
            utter.rate = rate;
            utter.pitch = 1.1;
            utter.volume = 1.0;
            let started = false;
            utter.onstart = () => { started = true; };
            utter.onerror = () => {
              if (token === speechToken && mode === 'auto') {
                playGoogleTTSChunks(splitIntoChunks(text), token, rate);
              }
            };
            window.speechSynthesis.speak(utter);
            if (mode === 'auto') {
              setTimeout(() => {
                if (!started && token === speechToken && !window.speechSynthesis.speaking) {
                  window.speechSynthesis.cancel();
                  playGoogleTTSChunks(splitIntoChunks(text), token, rate);
                }
              }, 700);
            }
            return;
          } catch (e) {}
        }
        playGoogleTTSChunks(splitIntoChunks(text), token, rate);
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
      }

      return { speak, stopAllSpeech, playSFX, unlockAudio };
    })();

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getColorLabelForAge(colorId, age) {
      if (age === '2yo' && colorId === 'blue') return 'Màu xanh';
      return COLORS_DB[colorId]?.name || '';

      if (itemType === 'star') {
        return `

              <radialGradient id="sg_${uid}" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="${col.light}"/>
                <stop offset="55%" stop-color="${col.hex}"/>
                <stop offset="100%" stop-color="${col.dark}"/>
              </radialGradient>
            </defs>
            <ellipse cx="50" cy="91" rx="26" ry="5" fill="#000" opacity="0.14"/>
            <polygon points="50,8 62,34 91,38 70,58 75,87 50,73 25,87 30,58 9,38 38,34"
              fill="url(#sg_${uid})" stroke="${col.dark}" stroke-width="2.5" stroke-linejoin="round"/>
            <circle cx="43" cy="48" r="2.8" fill="#202E59"/>
            <circle cx="57" cy="48" r="2.8" fill="#202E59"/>
            <path d="M45 55 Q50 60 55 55" fill="none" stroke="#202E59" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        `;
      }
      if (itemType === 'apple') {
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 100 100">
            <defs>
              <radialGradient id="ag_${uid}" cx="35%" cy="30%" r="68%">
                <stop offset="0%" stop-color="${col.light}"/>
                <stop offset="50%" stop-color="${col.hex}"/>
                <stop offset="100%" stop-color="${col.dark}"/>

    function renderVisualOptionHTML(opt, size = 96) {
      if (opt.kind === 'object') {
        return renderSingleObjectSVG(opt.itemType || 'star', opt.colorId || 'red', size);
      }
      if (opt.kind === 'shape3d') {
        return renderShape3DSVG(opt.shapeType || 'circle', opt.colorId || 'blue', size);
      }
      if (opt.kind === 'solid3d') {
        return renderSolid3DSVG(opt.solidType || 'sphere', size);
      }
      if (opt.kind === 'digit') {
        return `<div class="w-20 h-20 rounded-2xl bg-[#202E59] text-[#F8D375] flex items-center justify-center text-5xl font-black shadow-md">${opt.count}</div>`;
      }
      if (opt.kind === 'itemGroup') {
        const c = opt.count || 1;
        const cols = c <= 2 ? c : c <= 4 ? 2 : c <= 6 ? 3 : 5;
        const itemSz = c === 1 ? 74 : c <= 3 ? 44 : c <= 5 ? 36 : 26;
        let itemsHtml = '';
        for (let i = 0; i < c; i++) {
          itemsHtml += renderSingleObjectSVG(opt.itemType || 'star', opt.colorId || 'yellow', itemSz);
        }
        return `<div class="grid gap-1 place-items-center p-1" style="grid-template-columns: repeat(${cols}, minmax(0, 1fr));">${itemsHtml}</div>`;
      }
      return '';
    }

    function getQuestionBank() {
      const list = [];
      const age = AppState.config.selectedAge;
      const ext = AppState.config.enableExtended;

      // 1. MÀU SẮC
      const colorPairs2yo = [
        ['red', 'blue', 'star'],
        ['yellow', 'red', 'star'],
        ['blue', 'yellow', 'ball'],
        ['red', 'yellow', 'apple'],
        ['yellow', 'blue', 'star'],
        ['blue', 'red', 'ball'],
        ['red', 'yellow', 'flower'],
        ['yellow', 'red', 'car']
      ];
      colorPairs2yo.forEach(([targetCol, distCol, objType], idx) => {
        const objNameMap = { star: 'ngôi sao', ball: 'quả bóng', apple: 'quả táo', flower: 'bông hoa', car: 'chiếc ô tô' };
        const objLabel = objNameMap[objType] || 'ngôi sao';
        const colShort = getColorShortForAge(targetCol, '2yo');
        list.push({
          id: `2yo_col_${idx}`,
          age: '2yo',
          planet: 'colors',
          promptText: `Bé hãy chạm vào ${objLabel} ${colShort} nhé!`,
          hintText: `Con nhìn xem, ${objLabel} nào có ${colShort}?`,
          targetKey: `${objType}_${targetCol}`,
          containerType: 'basket',
          options: [
            { key: `${objType}_${targetCol}`, label: `${objLabel.charAt(0).toUpperCase() + objLabel.slice(1)} ${colShort}`, kind: 'object', itemType: objType, colorId: targetCol, groupId: targetCol },
            { key: `${objType}_${distCol}`, label: `${objLabel.charAt(0).toUpperCase() + objLabel.slice(1)} ${getColorShortForAge(distCol, '2yo')}`, kind: 'object', itemType: objType, colorId: distCol, groupId: distCol }
          ]
        });
      });

      const colors345 = ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink'];
      ['3yo', '4yo', '5yo'].forEach((ag) => {
        colors345.forEach((cid, i) => {
          const dist = colors345[(i + 2) % colors345.length];
          const dist2 = colors345[(i + 4) % colors345.length];
          const cDef = COLORS_DB[cid];
          list.push({
            id: `${ag}_col_${i}`,
            age: ag,
            planet: 'colors',
            promptText: `Bé hãy chọn ${cDef.objName.toLowerCase()} nhé!`,
            hintText: `Tìm đồ vật có ${cDef.shortName} nào con!`,
            targetKey: `${cDef.objType}_${cid}`,
            containerType: 'basket',
            options: [
              { key: `${cDef.objType}_${cid}`, label: cDef.objName, kind: 'object', itemType: cDef.objType, colorId: cid, groupId: cid },
              { key: `${cDef.objType}_${dist}`, label: `${COLORS_DB[dist].name}`, kind: 'object', itemType: cDef.objType, colorId: dist, groupId: dist },
              { key: `${cDef.objType}_${dist2}`, label: `${COLORS_DB[dist2].name}`, kind: 'object', itemType: cDef.objType, colorId: dist2, groupId: dist2 }
            ]
          });
        });
      });

      // 2. HÌNH DẠNG
      ['2yo', '3yo', '4yo', '5yo'].forEach((ag) => {
        const shapes = ag === '2yo' ? ['circle', 'square'] : ['circle', 'square', 'triangle', 'rectangle'];
        const cols = ['red', 'blue', 'yellow', 'green'];
        shapes.forEach((sh, i) => {
          const others = shapes.filter((x) => x !== sh);
          const colId = cols[i % 4];
          const colShort = getColorShortForAge(colId, ag);
          const targetName = `${SHAPES_DB[sh].name} ${colShort}`;
          const opts = [
            { key: `${sh}_${colId}`, label: targetName, kind: 'shape3d', shapeType: sh, colorId: colId, groupId: sh }
          ];
          others.slice(0, ag === '2yo' ? 1 : 2).forEach((osh, oi) => {
            const ocol = cols[(i + oi + 1) % 4];
            opts.push({
              key: `${osh}_${ocol}`,
              label: `${SHAPES_DB[osh].name} ${getColorShortForAge(ocol, ag)}`,
              kind: 'shape3d',
              shapeType: osh,
              colorId: ocol,
              groupId: osh
            });
          });
          list.push({
            id: `${ag}_shp_${i}`,
            age: ag,
            planet: 'shapes',
            promptText: `Bé tìm ${targetName.toLowerCase()} nhé!`,
            hintText: SHAPES_DB[sh].desc,
            targetKey: `${sh}_${colId}`,
            containerType: 'house',
            options: opts
          });
        });
      });

      // 3. CON SỐ & SỐ LƯỢNG
      list.push(
        {
          id: '2yo_num_1',
          age: '2yo',
          planet: 'numbers',
          promptText: 'Bé chỉ cho cô nhóm có một ngôi sao màu vàng!',
          hintText: 'Chỉ có đúng một ngôi sao màu vàng đứng một mình thôi con!',
          targetKey: 'one_star',
          options: [
            { key: 'one_star', label: 'Một ngôi sao', kind: 'itemGroup', itemType: 'star', colorId: 'yellow', count: 1, groupId: 'one' },
            { key: 'many_star', label: 'Nhiều ngôi sao', kind: 'itemGroup', itemType: 'star', colorId: 'yellow', count: 5, groupId: 'many' }
          ]
        },
        {
          id: '2yo_num_2',
          age: '2yo',
          planet: 'numbers',
          promptText: 'Đâu là nhóm có nhiều quả táo màu đỏ?',
          hintText: 'Nhóm nào có rất nhiều quả táo màu đỏ cùng nhau nhỉ?',
          targetKey: 'many_apple',
          options: [
            { key: 'many_apple', label: 'Nhiều quả táo', kind: 'itemGroup', itemType: 'apple', colorId: 'red', count: 5, groupId: 'many' },
            { key: 'one_apple', label: 'Một quả táo', kind: 'itemGroup', itemType: 'apple', colorId: 'red', count: 1, groupId: 'one' }
          ]
        },
        {
          id: '2yo_num_3',
          age: '2yo',
          planet: 'numbers',
          promptText: 'Bé tìm nhóm có một bông hoa màu hồng nhé!',
          hintText: 'Chỉ có một bông hoa màu hồng duy nhất thôi con!',
          targetKey: 'one_flower',
          options: [
            { key: 'one_flower', label: 'Một bông hoa', kind: 'itemGroup', itemType: 'flower', colorId: 'pink', count: 1, groupId: 'one' },
            { key: 'many_flower', label: 'Nhiều bông hoa', kind: 'itemGroup', itemType: 'flower', colorId: 'pink', count: 4, groupId: 'many' }
          ]
        }
      );

      ['3yo', '4yo', '5yo'].forEach((ag) => {
        const maxN = ag === '3yo' && !ext ? 5 : 10;
        for (let n = 1; n <= maxN; n++) {
          const d1 = n === 1 ? 3 : n - 1;
          const d2 = n >= maxN ? 2 : n + 1;
          list.push({
            id: `${ag}_num_${n}`,
            age: ag,
            planet: 'numbers',
            promptText: `Nhóm nào có ${n} ngôi sao màu vàng vậy bé?`,
            hintText: `Con hãy chỉ tay đếm từng ngôi sao màu vàng đến ${n} nhé!`,
            targetKey: `stars_${n}`,
            options: [
              { key: `stars_${n}`, label: `${n} ngôi sao`, kind: 'itemGroup', itemType: 'star', colorId: 'yellow', count: n },
              { key: `stars_${d1}`, label: `${d1} ngôi sao`, kind: 'itemGroup', itemType: 'star', colorId: 'yellow', count: d1 },
              { key: `stars_${d2}`, label: `${d2} ngôi sao`, kind: 'itemGroup', itemType: 'star', colorId: 'yellow', count: d2 }
            ]
          });
        }
      });

      // 4. HÌNH KHỐI 3D
      Object.values(SOLIDS_DB).forEach((sol, idx) => {
        const others = Object.values(SOLIDS_DB).filter((x) => x.id !== sol.id);
        list.push({
          id: `5yo_sol_${idx}`,
          age: '5yo',
          planet: 'solids',
          promptText: `Bé hãy chọn ${sol.name} nhé!`,
          hintText: sol.desc,
          targetKey: `solid_${sol.id}`,
          options: [
            { key: `solid_${sol.id}`, label: sol.name, kind: 'solid3d', solidType: sol.id },
            { key: `solid_${others[0].id}`, label: others[0].name, kind: 'solid3d', solidType: others[0].id },
            { key: `solid_${others[1].id}`, label: others[1].name, kind: 'solid3d', solidType: others[1].id }
          ]
        });
      });

      return [...list, ...AppState.customQuestions];
    }

    function getActiveQuestions() {
      const all = getQuestionBank();
      let filtered = all.filter((q) => q.age === AppState.config.selectedAge && q.planet === AppState.planet);
      if (!filtered.length) {
        filtered = all.filter((q) => q.planet === AppState.planet);
      }
      return filtered;
    }

    function getExploreItems() {
      const age = AppState.config.selectedAge;
      const planet = AppState.planet;
      const ext = AppState.config.enableExtended;

      if (planet === 'colors') {
        const keys =
          age === '2yo'
            ? ['red', 'yellow', 'blue']
            : age === '3yo'
            ? ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink']
            : ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink', 'white', 'black'];
        return keys.map((k) => {
          const c = COLORS_DB[k];
          const title = getColorLabelForAge(k, age);
          const objTitle =
            age === '2yo' && k === 'blue'
              ? 'Quả bóng màu xanh'
              : c.objName;
          return {
            title: `${title} – ${objTitle}`,
            desc: `Quan sát ${objTitle.toLowerCase()} thật rõ nét nhé!`,
            speech: `Đây là ${title.toLowerCase()}. ${objTitle}.`,
            visual: `
              <div class="flex flex-col sm:flex-row items-center gap-6">
                ${renderSingleObjectSVG(c.objType, k, 165)}
              </div>
            `
          };
        });
      }

      if (planet === 'shapes') {
        const keys = age === '2yo' ? ['circle', 'square'] : ['circle', 'square', 'triangle', 'rectangle'];
        const cols = ['red', 'blue', 'yellow', 'green'];
        return keys.map((k, idx) => {
          const s = SHAPES_DB[k];
          const colId = cols[idx % 4];
          const spokenColor = getColorShortForAge(colId, age);
          const coloredShapeTitle = `${s.name} ${spokenColor}`;
          return {
            title: coloredShapeTitle,
            desc: `${s.desc} (${s.realName})`,
            speech: `Đây là ${coloredShapeTitle.toLowerCase()}. ${s.desc}`,
            visual: renderShape3DSVG(k, colId, 175)
          };
        });
      }

      if (planet === 'numbers') {
        if (age === '2yo' && !ext) {
          return [
            {
              title: 'Số lượng: Một ngôi sao màu vàng',
              desc: 'Chỉ có đúng 1 ngôi sao màu vàng đứng một mình.',
              speech: 'Đây là một ngôi sao màu vàng. Chỉ có một ngôi sao màu vàng thôi nhé!',
              visual: renderVisualOptionHTML({ kind: 'itemGroup', itemType: 'star', colorId: 'yellow', count: 1 }, 165)
            },
            {
              title: 'Số lượng: Nhiều ngôi sao màu vàng',
              desc: 'Có rất nhiều ngôi sao màu vàng ở cạnh nhau.',
              speech: 'Còn đây là nhiều ngôi sao màu vàng. Có rất nhiều ngôi sao màu vàng cùng nhau!',
              visual: renderVisualOptionHTML({ kind: 'itemGroup', itemType: 'star', colorId: 'yellow', count: 5 }, 165)
            }
          ];
        }
        const maxNum = age === '2yo' ? 3 : age === '3yo' && !ext ? 5 : 10;
        return Array.from({ length: maxNum }, (_, i) => {
          const n = i + 1;
          return {
            title: `Số ${n}`,
            desc: `Có tất cả ${n} ngôi sao màu vàng.`,
            speech: `Đây là số ${n}. Có ${n} ngôi sao màu vàng lấp lánh!`,
            visual: `
              <div class="flex flex-col sm:flex-row items-center gap-6">
                ${renderVisualOptionHTML({ kind: 'digit', count: n }, 110)}
                ${renderVisualOptionHTML({ kind: 'itemGroup', itemType: 'star', colorId: 'yellow', count: n }, 160)}
              </div>
            `
          };
        });
      }

      const solidColors = ['red', 'blue', 'yellow', 'green'];
      return Object.values(SOLIDS_DB).map((s, idx) => {
        const sColorShort = getColorShortForAge(solidColors[idx % solidColors.length], age);
        const solidTitle = `${s.name} ${sColorShort}`;
        return {
          title: solidTitle,
          desc: `${s.desc} (${s.realName})`,
          speech: `Đây là ${solidTitle.toLowerCase()}. ${s.desc}`,
          visual: `
            <div class="flex flex-col sm:flex-row items-center gap-6">
              ${renderSolid3DSVG(s.id, 165)}
              <div class="flex flex-col items-center bg-[#F8F4EC] p-4 rounded-2xl">
                ${renderSingleObjectSVG(s.realType, 'red', 100)}
                <span class="text-sm font-extrabold text-[#202E59] mt-1">${s.realName}</span>
              </div>
            </div>
          `
        };
      });
    }

    function initPracticeSession() {
      const qs = shuffle(getActiveQuestions());
      AppState.practiceList = qs.slice(0, Math.min(AppState.config.questionsPerSession, qs.length));
      AppState.practiceIdx = 0;
      setupPracticeQuestion();
    }

    function setupPracticeQuestion() {
      if (AppState.hintTimer) clearTimeout(AppState.hintTimer);
      AppState.practiceSolved = false;
      AppState.practiceSelected = null;
      AppState.practiceFeedback = '';
      AppState.hintActive = false;
      const q = AppState.practiceList[AppState.practiceIdx];
      if (q) {
        q._shuffledOpts = shuffle(q.options);
        SoundEngine.speak(q.promptText);
        AppState.hintTimer = setTimeout(() => {
          if (!AppState.practiceSolved && AppState.screen === 'lesson') {
            AppState.hintActive = true;
            render();
          }
        }, 9000);
      }
    }

    function initDragGame() {
      const q = shuffle(getActiveQuestions())[0];
      AppState.dragPairs = q ? q.options : [];
      AppState.dragShuffledTargets = shuffle(AppState.dragPairs);
      AppState.dragSelected = null;
      AppState.dragMatched = [];
      SoundEngine.speak('Bé hãy kéo từng đồ vật thả vào đúng giỏ hoặc ngôi nhà của nó nhé!');
    }

    function initMatchGame() {
      const age = AppState.config.selectedAge;
      const planet = AppState.planet;
      const count = age === '2yo' ? 2 : 3;
      let pairs = [];
      if (planet === 'numbers') {
        const nums = age === '2yo' ? [1, 3] : [2, 4, 5];
        pairs = nums.slice(0, count).map((n) => ({
          id: `m_${n}`,
          left: { kind: 'digit', count: n, label: `Số ${n}` },
          right: { kind: 'itemGroup', itemType: 'star', colorId: 'yellow', count: n, label: `${n} ngôi sao` }
        }));
      } else if (planet === 'shapes') {
        const shs = (age === '2yo' ? ['circle', 'square'] : ['circle', 'square', 'triangle']).slice(0, count);
        const cols = ['red', 'blue', 'yellow'];
        pairs = shs.map((sh, i) => ({
          id: `m_${sh}`,
          left: { kind: 'shape3d', shapeType: sh, colorId: cols[i], label: `${SHAPES_DB[sh].name} ${getColorShortForAge(cols[i], age)}` },
          right: { kind: 'shape3d', shapeType: sh, colorId: cols[i], label: `${SHAPES_DB[sh].name} ${getColorShortForAge(cols[i], age)}` }
        }));
      } else {
        const cols = ['red', 'yellow', 'blue'].slice(0, count);
        pairs = cols.map((c) => ({
          id: `m_${c}`,
          left: { kind: 'object', itemType: COLORS_DB[c].objType, colorId: c, label: getColorLabelForAge(c, age) },
          right: { kind: 'object', itemType: COLORS_DB[c].objType, colorId: c, label: getColorLabelForAge(c, age) }
        }));
      }
      AppState.matchPairs = pairs;
      AppState.matchRightList = shuffle(pairs.map((p) => ({ id: p.id, opt: p.right })));
      AppState.matchLeftPicked = null;
      AppState.matchSolved = [];
      SoundEngine.speak('Bé hãy tìm hai bạn thân giống nhau nhé!');
    }

    function initCountGame() {
      const age = AppState.config.selectedAge;
      const target = age === '2yo' ? Math.floor(Math.random() * 3) + 1 : age === '3yo' ? Math.floor(Math.random() * 5) + 1 : Math.floor(Math.random() * 7) + 3;
      AppState.countTarget = target;
      AppState.countClicked = [];
      AppState.countSolved = false;
      const d1 = target === 1 ? 2 : target - 1;
      const d2 = target >= 9 ? 7 : target + 1;
      AppState.countChoices = shuffle([target, d1, d2]);
      SoundEngine.speak('Bé hãy chạm vào từng ngôi sao màu vàng để cùng đếm nhé!');
    }

    function initSortGame() {
      const age = AppState.config.selectedAge;
      const planet = AppState.planet;
      if (planet === 'shapes') {
        AppState.sortBaskets = [
          { id: 'circle', label: 'Ngôi nhà Hình Tròn', shape: 'circle', color: 'red' },
          { id: 'square', label: 'Ngôi nhà Hình Vuông', shape: 'square', color: 'blue' }
        ];
        AppState.sortItems = shuffle([
          { key: 's1', label: 'Hình tròn màu đỏ', kind: 'shape3d', shapeType: 'circle', colorId: 'red', groupId: 'circle' },
          { key: 's2', label: 'Hình vuông màu xanh', kind: 'shape3d', shapeType: 'square', colorId: 'blue', groupId: 'square' },
          { key: 's3', label: 'Hình tròn màu vàng', kind: 'shape3d', shapeType: 'circle', colorId: 'yellow', groupId: 'circle' },
          { key: 's4', label: 'Hình vuông màu đỏ', kind: 'shape3d', shapeType: 'square', colorId: 'red', groupId: 'square' }
        ]);
      } else {
        AppState.sortBaskets =
          age === '2yo'
            ? [
                { id: 'red', label: 'Giỏ màu đỏ', color: 'red' },
                { id: 'yellow', label: 'Giỏ màu vàng', color: 'yellow' }
              ]
            : [
                { id: 'red', label: 'Giỏ màu đỏ', color: 'red' },
                { id: 'yellow', label: 'Giỏ màu vàng', color: 'yellow' },
                { id: 'blue', label: 'Giỏ màu xanh dương', color: 'blue' }
              ];
        const items = [
          { key: 'c1', label: 'Quả táo màu đỏ', kind: 'object', itemType: 'apple', colorId: 'red', groupId: 'red' },
          { key: 'c2', label: 'Ngôi sao màu vàng', kind: 'object', itemType: 'star', colorId: 'yellow', groupId: 'yellow' },
          { key: 'c3', label: 'Quả bóng màu đỏ', kind: 'object', itemType: 'ball', colorId: 'red', groupId: 'red' },
          { key: 'c4', label: 'Bông hoa màu vàng', kind: 'object', itemType: 'flower', colorId: 'yellow', groupId: 'yellow' }
        ];
        if (age !== '2yo') {
          items.push({ key: 'c5', label: 'Quả bóng màu xanh dương', kind: 'object', itemType: 'ball', colorId: 'blue', groupId: 'blue' });
        }
        AppState.sortItems = shuffle(items);
      }
      AppState.sortDone = [];
      AppState.sortActiveKey = null;
      SoundEngine.speak('Bé hãy phân loại các đồ vật vào đúng giỏ nhé!');
    }

    function recordAttempt(isCorrect, usedHint = false) {
      AppState.stats.totalAttempts++;
      if (isCorrect) AppState.stats.totalCorrect++;
      if (usedHint) AppState.stats.hintsUsed++;
      const p = AppState.stats.byPlanet[AppState.planet];
      if (p) {
        p.attempts++;
        if (isCorrect) p.correct++;
      }
      persistState();
    }

    function finishActivity() {
      AppState.stats.sessionsCompleted++;
      persistState();
      SoundEngine.playSFX('complete');
      AppState.screen = 'complete';
      SoundEngine.speak('Hoan hô! Bé đã hoàn thành xuất sắc chuyến du hành ngân hà rồi!');
      render();
    }

    window.AppActions = {
      toggleSound() {
        AppState.config.soundEnabled = !AppState.config.soundEnabled;
        if (!AppState.config.soundEnabled) SoundEngine.stopAllSpeech();
        persistState();
        render();
      },
      goWelcome() {
        SoundEngine.stopAllSpeech();
        AppState.screen = 'welcome';
        render();
      },
      goAgeSelect() {
        SoundEngine.playSFX('tap');
        SoundEngine.speak('Chào bé yêu! Mình cùng chọn độ tuổi để bắt đầu chuyến du hành nhé!');
        AppState.screen = 'ageSelect';
        render();
      },
      selectAge(ageId) {
        SoundEngine.playSFX('tap');
        AppState.config.selectedAge = ageId;
        persistState();
        AppState.screen = 'map';
        SoundEngine.speak(`Chào mừng bé đến với chương trình ${AGE_META[ageId].title}! Hãy chọn một hành tinh nhé!`);
        render();
      },
      goMap() {
        SoundEngine.stopAllSpeech();
        AppState.screen = 'map';
        render();
      },
      startPlanet(planetId, mode) {
        SoundEngine.playSFX('tap');
        AppState.planet = planetId;
        AppState.mode = mode;
        AppState.screen = 'lesson';
        if (mode === 'explore') {
          AppState.exploreIdx = 0;
          const items = getExploreItems();
          if (items[0]) SoundEngine.speak(items[0].speech);
        } else if (mode === 'practice') {
          initPracticeSession();
        } else if (mode === 'play') {
          AppState.game = 'tap';
          initPracticeSession();
        }
        render();
      },
      switchMode(mode) {
        SoundEngine.playSFX('tap');
        AppState.mode = mode;
        if (mode === 'explore') {
          AppState.exploreIdx = 0;
          const items = getExploreItems();
          if (items[0]) SoundEngine.speak(items[0].speech);
        } else if (mode === 'practice') {
          initPracticeSession();
        } else if (mode === 'play') {
          AppState.game = 'tap';
          initPracticeSession();
        }
        render();
      },
      exploreStep(delta) {
        SoundEngine.playSFX('tap');
        const items = getExploreItems();
        AppState.exploreIdx = (AppState.exploreIdx + delta + items.length) % items.length;
        SoundEngine.speak(items[AppState.exploreIdx].speech);
        render();
      },
      speakExploreCurrent() {
        const items = getExploreItems();
        if (items[AppState.exploreIdx]) SoundEngine.speak(items[AppState.exploreIdx].speech);
      },
      choosePractice(optKey, optLabel) {
        if (AppState.practiceSolved) return;
        const q = AppState.practiceList[AppState.practiceIdx];
        if (!q) return;
        AppState.practiceSelected = optKey;
        if (optKey === q.targetKey) {
          AppState.practiceSolved = true;
          AppState.practiceFeedback = 'Giỏi lắm! Bé chọn đúng rồi!';
          SoundEngine.playSFX('correct');
          SoundEngine.speak(`Giỏi lắm! Đúng là ${optLabel.toLowerCase()} rồi!`);
          recordAttempt(true, AppState.hintActive);
          AppState.hintActive = false;
          const currentIdx = AppState.practiceIdx;
          setTimeout(() => {
            if (AppState.practiceSolved && AppState.practiceIdx === currentIdx && AppState.screen === 'lesson') {
              window.AppActions.nextPractice();
            }
          }, 1600);
        } else {
          AppState.practiceFeedback = 'Con thử lại nhé! Mình cùng nhìn kỹ nào!';
          SoundEngine.playSFX('retry');
          SoundEngine.speak(`Con thử lại nhé! ${q.hintText}`);
          recordAttempt(false, false);
        }
        render();
      },
      nextPractice() {
        SoundEngine.playSFX('tap');
        if (AppState.practiceIdx < AppState.practiceList.length - 1) {
          AppState.practiceIdx++;
          setupPracticeQuestion();
          render();
        } else {
          finishActivity();
        }
      },
      selectGame(g) {
        SoundEngine.playSFX('tap');
        AppState.game = g;
        if (g === 'tap' || g === 'challenge') initPracticeSession();
        else if (g === 'drag') initDragGame();
        else if (g === 'match') initMatchGame();
        else if (g === 'countStars') initCountGame();
        else if (g === 'sort') initSortGame();
        render();
      },
      dropDragTarget(targetKey) {
        const src = AppState.dragSelected;
        if (!src || AppState.dragMatched.includes(targetKey)) return;
        if (src === targetKey) {
          AppState.dragMatched.push(targetKey);
          AppState.dragSelected = null;
          SoundEngine.playSFX('correct');
          recordAttempt(true);
          if (AppState.dragMatched.length === AppState.dragPairs.length) {
            SoundEngine.speak('Tuyệt vời! Bé đã kéo thả đúng tất cả đồ vật rồi!');
            setTimeout(finishActivity, 1000);
          } else {
            SoundEngine.speak('Giỏi lắm! Đúng chỗ rồi!');
          }
        } else {
          AppState.dragSelected = null;
          SoundEngine.playSFX('retry');
          SoundEngine.speak('Chưa đúng giỏ rồi, bé kéo thử lại nhé!');
          recordAttempt(false);
        }
        render();
      },
      pickMatchLeft(id, label) {
        if (AppState.matchSolved.includes(id)) return;
        SoundEngine.playSFX('tap');
        AppState.matchLeftPicked = id;
        SoundEngine.speak(label);
        render();
      },
      pickMatchRight(id, label) {
        if (!AppState.matchLeftPicked || AppState.matchSolved.includes(id)) return;
        if (AppState.matchLeftPicked === id) {
          AppState.matchSolved.push(id);
          AppState.matchLeftPicked = null;
          SoundEngine.playSFX('correct');
          SoundEngine.speak(`Đúng rồi! ${label}!`);
          recordAttempt(true);
          if (AppState.matchSolved.length === AppState.matchPairs.length) {
            setTimeout(finishActivity, 1000);
          }
        } else {
          SoundEngine.playSFX('retry');
          SoundEngine.speak('Con thử lại nhé!');
          recordAttempt(false);
        }
        render();
      },
      tapCountStar(idx) {
        if (AppState.countClicked.includes(idx)) {
          SoundEngine.speak(`Ngôi sao này đếm rồi, hiện có ${AppState.countClicked.length} ngôi sao.`);
          return;
        }
        SoundEngine.playSFX('tap');
        AppState.countClicked.push(idx);
        const n = AppState.countClicked.length;
        if (n === AppState.countTarget) {
          SoundEngine.speak(`${n}! Có tất cả ${AppState.countTarget} ngôi sao màu vàng! Bé chọn số ${AppState.countTarget} bên dưới nhé!`);
        } else {
          SoundEngine.speak(`${n}`);
        }
        render();
      },
      chooseCountDigit(num) {
        if (AppState.countSolved) return;
        if (num === AppState.countTarget) {
          AppState.countSolved = true;
          SoundEngine.playSFX('correct');
          SoundEngine.speak(`Giỏi lắm! Đúng là số ${AppState.countTarget} rồi!`);
          recordAttempt(true);
          setTimeout(finishActivity, 1100);
        } else {
          SoundEngine.playSFX('retry');
          SoundEngine.speak('Con thử lại nhé!');
          recordAttempt(false);
        }
        render();
      },
      pickSortItem(key, label) {
        SoundEngine.playSFX('tap');
        AppState.sortActiveKey = key;
        SoundEngine.speak(label);
        render();
      },
      dropSortBasket(basketId) {
        const rem = AppState.sortItems.filter((i) => !AppState.sortDone.includes(i.key));
        const curr = rem.find((i) => i.key === AppState.sortActiveKey) || rem[0];
        if (!curr) return;
        if (curr.groupId === basketId) {
          AppState.sortDone.push(curr.key);
          AppState.sortActiveKey = null;
          SoundEngine.playSFX('correct');
          recordAttempt(true);
          if (AppState.sortDone.length === AppState.sortItems.length) {
            SoundEngine.speak('Tuyệt vời! Bé phân loại đúng hết rồi!');
            setTimeout(finishActivity, 1000);
          } else {
            SoundEngine.speak('Giỏi lắm! Đúng giỏ rồi!');
          }
        } else {
          SoundEngine.playSFX('retry');
          SoundEngine.speak('Con thử lại nhé!');
          recordAttempt(false);
        }
        render();
      },
      openTeacherGate() {
        SoundEngine.stopAllSpeech();
        AppState.gateNums = [Math.floor(Math.random() * 5) + 3, Math.floor(Math.random() * 4) + 2];
        AppState.gateError = '';
        AppState.showGate = true;
        render();
      },
      closeTeacherGate() {
        AppState.showGate = false;
        render();
      },
      submitTeacherGate(e) {
        e.preventDefault();
        const val = parseInt(document.getElementById('gateInput')?.value || '', 10);
        if (val === AppState.gateNums[0] + AppState.gateNums[1]) {
          AppState.showGate = false;
          AppState.screen = 'teacher';
        } else {
          AppState.gateError = 'Kết quả chưa đúng, cô thử tính lại nhé!';
        }
        render();
      },
      setTeacherTab(t) {
        AppState.teacherTab = t;
        render();
      },
      updateConfig(key, val) {
        AppState.config[key] = val;
        persistState();
        render();
      },
      resetStats() {
        AppState.stats = {
          sessionsCompleted: 0,
          totalCorrect: 0,
          totalAttempts: 0,
          hintsUsed: 0,
          byPlanet: {
            colors: { correct: 0, attempts: 0 },
            shapes: { correct: 0, attempts: 0 },
            numbers: { correct: 0, attempts: 0 },
            solids: { correct: 0, attempts: 0 }
          }
        };
        persistState();
        render();
      }
    };

      return `
        <div class="flex-1 galaxy-bg text-white flex flex-col justify-between p-4 sm:p-8 relative overflow-hidden">
          <header class="relative z-10 flex items-center justify-between max-w-6xl w-full mx-auto">
            <button onclick="AppActions.toggleSound()" class="min-h-[64px] px-5 rounded-2xl bg-white/15 hover:bg-white/25 font-bold text-base flex items-center gap-2">

            </p>
            <button onclick="AppActions.goAgeSelect()" class="btn-3d min-h-[84px] px-10 sm:px-14 rounded-3xl bg-[#F8D375] hover:bg-[#ffe08a] text-[#202E59] font-black text-2xl sm:text-3xl flex items-center gap-3">

    function renderAgeSelect() {
      const cards = Object.values(AGE_META)
        .map((a) => {
          const active = AppState.config.selectedAge === a.id;
          return `
            <button onclick="AppActions.selectAge('${a.id}')"
              style="background:${a.bg}; border-color:${active ? a.border : 'transparent'};"
              class="card-3d min-h-[120px] p-6 rounded-3xl border-4 text-left flex items-center justify-between">
              <div>
                <span style="background:${a.border};" class="inline-block px-3.5 py-1 rounded-full text-white text-sm font-extrabold mb-2">${a.badge}</span>
                <h3 class="text-2xl sm:text-3xl font-black text-[#202E59]">${a.title}</h3>
                <p class="text-base sm:text-lg font-bold text-slate-700 mt-0.5">${a.sub}</p>
              </div>
              <div style="background:${a.border};" class="w-14 h-14 rounded-2xl text-white flex items-center justify-center text-2xl font-black shrink-0">➜</div>
            </button>
          `;
        })
        .join('');

      return `
        <div class="flex-1 bg-[#F8F4EC] flex flex-col p-4 sm:p-8">
          <header class="max-w-5xl w-full mx-auto flex items-center justify-between mb-6">
            <button onclick="AppActions.goWelcome()" class="min-h-[64px] px-5 rounded-2xl bg-white border-2 border-slate-200 font-extrabold text-lg">⬅ Trang chủ</button>
            <button onclick="SoundEngine.speak('Bé hãy chọn lớp học phù hợp với độ tuổi của mình nhé!')" class="min-h-[64px] px-5 rounded-2xl bg-[#202E59] text-white font-bold text-lg">🔊 Nghe hướng dẫn</button>
          </header>
          <main class="max-w-5xl w-full mx-auto flex-1 flex flex-col justify-center">
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-8 text-center sm:text-left">
              ${renderBeSaoSVG('guide', 96)}
              <div>
                <h2 class="text-2xl sm:text-4xl font-black text-[#202E59]">Bé đang học lớp mấy tuổi?</h2>
                <p class="text-base sm:text-xl font-semibold text-slate-600 mt-1">Chạm vào thẻ lớp học để mở bản đồ hành tinh dành riêng cho bé nhé!</p>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">${cards}</div>
          </main>
        </div>
      `;
    }

    function renderMap() {
      const planets =
        AppState.config.selectedAge === '5yo' || AppState.config.enableSolidsForAll
          ? Object.values(PLANET_META)
          : Object.values(PLANET_META).filter((p) => p.id !== 'solids');

      const cards = planets
        .map((p) => {
          const st = AppState.stats.byPlanet[p.id];
          return `
            <div class="bg-[#F8F4EC] text-[#202E59] rounded-3xl p-6 shadow-xl flex flex-col justify-between border-4 border-white/80">
              <div>
                <div class="flex justify-center mb-3">
                  <svg width="116" height="96" viewBox="0 0 120 100">
                    <circle cx="60" cy="50" r="34" fill="${p.color}"/>
                    <ellipse cx="60" cy="52" rx="52" ry="13" transform="rotate(-16 60 52)" fill="none" stroke="${p.ring}" stroke-width="5"/>
                  </svg>
                </div>
                <h3 class="text-2xl font-black text-center mb-1">${p.title}</h3>
                <p class="text-sm sm:text-base font-semibold text-slate-600 text-center mb-4">${p.sub}</p>
              </div>
              <div class="space-y-2.5">
                <button onclick="AppActions.startPlanet('${p.id}', 'explore')" class="w-full min-h-[64px] rounded-2xl bg-[#A8D6E8] hover:bg-[#93c9df] text-[#202E59] font-extrabold text-lg">👀 1. Bé khám phá</button>
                <button onclick="AppActions.startPlanet('${p.id}', 'practice')" class="w-full min-h-[64px] rounded-2xl bg-[#F8D375] hover:bg-[#f4c653] text-[#202E59] font-extrabold text-lg">✅ 2. Bé thực hành</button>
                <button onclick="AppActions.startPlanet('${p.id}', 'play')" class="w-full min-h-[64px] rounded-2xl bg-[#202E59] hover:bg-[#2d3f78] text-white font-extrabold text-lg">🎮 3. Bé vui chơi</button>
                ${st.attempts > 0 ? `<div class="text-center text-xs font-bold text-slate-500 pt-1">Đã luyện: ${st.correct}/${st.attempts} lượt đúng</div>` : ''}
              </div>
            </div>
          `;
        })
        .join('');

      return `
        <div class="flex-1 galaxy-bg text-white flex flex-col p-4 sm:p-8">
          <header class="max-w-6xl w-full mx-auto flex flex-wrap items-center justify-between gap-3 mb-6">
            <button onclick="AppActions.goAgeSelect()" class="min-h-[64px] px-5 rounded-2xl bg-white/15 hover:bg-white/25 font-bold text-lg">⬅ Đổi độ tuổi</button>
            <div class="px-5 py-2.5 rounded-2xl bg-[#F8D375] text-[#202E59] font-black text-base sm:text-xl shadow">${AGE_META[AppState.config.selectedAge].title}</div>
            <div class="flex items-center gap-2">
              <button onclick="AppActions.toggleSound()" class="min-h-[64px] min-w-[64px] rounded-2xl bg-white/15 hover:bg-white/25 text-xl font-bold">${AppState.config.soundEnabled ? '🔊' : '🔇'}</button>
              <button onclick="AppActions.openTeacherGate()" class="min-h-[64px] px-4 rounded-2xl bg-white/15 hover:bg-white/25 font-bold">⚙️ Góc giáo viên</button>
            </div>
          </header>
          <main class="max-w-6xl w-full mx-auto flex-1 flex flex-col justify-center">
            <div class="flex items-center justify-center gap-4 mb-6 text-center sm:text-left">
              ${renderBeSaoSVG('guide', 88)}
              <div>
                <h2 class="text-2xl sm:text-4xl font-black text-[#F8D375]">Bản đồ Ngân hà Kiến thức</h2>
                <p class="text-base sm:text-xl text-[#A8D6E8] font-semibold">Bé muốn lái phi thuyền tới hành tinh nào hôm nay?</p>
              </div>
            </div>
            <div class="grid grid-cols-1 ${planets.length === 4 ? 'md:grid-cols-2 lg:grid-cols-4' : 'md:grid-cols-3'} gap-5">${cards}</div>
          </main>
        </div>
      `;
    }

    function renderExploreContent() {
      const items = getExploreItems();
      const curr = items[AppState.exploreIdx] || items[0];
      return `
        <div class="flex-1 flex flex-col items-center justify-center">
          <div class="max-w-3xl w-full bg-white rounded-3xl p-6 sm:p-10 shadow-lg border-2 border-slate-200 flex flex-col items-center text-center animate-pop">
            <div class="w-full flex items-center justify-between mb-4">
              <span class="px-4 py-1.5 rounded-full bg-[#A8D6E8]/40 text-[#202E59] font-extrabold text-sm sm:text-base">Thẻ ${AppState.exploreIdx + 1} / ${items.length}</span>
              <button onclick="AppActions.speakExploreCurrent()" class="min-h-[64px] px-5 rounded-2xl bg-[#F8D375] hover:bg-[#f2c44d] text-[#202E59] font-extrabold text-lg">🔊 Nghe lại</button>
            </div>
            <div class="min-h-[200px] flex items-center justify-center my-4">${curr.visual}</div>
            <h3 class="text-2xl sm:text-4xl font-black text-[#202E59] mb-2">${curr.title}</h3>
            <p class="text-base sm:text-xl font-semibold text-slate-600 max-w-xl mb-8">${curr.desc}</p>
            <div class="w-full flex flex-wrap items-center justify-between gap-3">
              <button onclick="AppActions.exploreStep(-1)" class="min-h-[72px] px-6 rounded-2xl bg-slate-100 hover:bg-slate-200 font-extrabold text-lg">⬅ Trước</button>
              ${
                AppState.exploreIdx < items.length - 1
                  ? `<button onclick="AppActions.exploreStep(1)" class="min-h-[72px] px-8 rounded-2xl bg-[#202E59] text-white font-extrabold text-xl">Tiếp theo ➡</button>`
                  : `<button onclick="AppActions.switchMode('practice')" class="min-h-[72px] px-8 rounded-2xl bg-[#388E3C] text-white font-extrabold text-xl">✅ Sang Thực hành</button>`
              }
            </div>
          </div>
        </div>
      `;
    }

    function renderPracticeContent() {
      const q = AppState.practiceList[AppState.practiceIdx];
      if (!q) return `<div class="bg-white p-8 rounded-3xl text-center font-bold">Chưa có câu hỏi cho mục này.</div>`;
      const opts = q._shuffledOpts || q.options;

      const optCards = opts
        .map((opt) => {
          const isTarget = opt.key === q.targetKey;
          const isWrong = AppState.practiceSelected === opt.key && !isTarget;
          const isRight = AppState.practiceSolved && isTarget;
          const cls = isRight
            ? 'bg-emerald-50 border-[#388E3C] scale-105 shadow-lg'
            : isWrong
            ? 'bg-amber-50 border-amber-400 opacity-80'
            : AppState.hintActive && isTarget
            ? 'bg-white border-[#F4C430] animate-hint'
            : 'bg-white border-slate-200 hover:border-[#6C6AA7] shadow-sm';
          return `
            <button onclick="AppActions.choosePractice('${opt.key}', '${opt.label.replace(/'/g, "\\'")}')"
              class="min-h-[175px] p-5 rounded-3xl border-4 flex flex-col items-center justify-center gap-3 transition ${cls}">
              ${renderVisualOptionHTML(opt, 108)}
              <span class="text-xl sm:text-2xl font-black text-[#202E59]">${opt.label}</span>
            </button>
          `;
        })
        .join('');

      return `
        <div class="flex-1 flex flex-col justify-center max-w-4xl w-full mx-auto">
          <div class="bg-white rounded-3xl p-5 sm:p-8 shadow-lg border-2 border-slate-200">
            <div class="flex items-center justify-between mb-4">
              <span class="px-4 py-1 rounded-full bg-[#F8F4EC] font-extrabold text-slate-600">Câu ${AppState.practiceIdx + 1} / ${AppState.practiceList.length}</span>
              <button onclick="SoundEngine.speak('${q.promptText.replace(/'/g, "\\'")}')" class="min-h-[60px] px-5 rounded-2xl bg-[#F8D375] font-extrabold text-lg">🔊 Nghe lại</button>
            </div>
            <div class="bg-[#F8F4EC] rounded-2xl p-4 sm:p-6 flex items-center gap-4 mb-6">
              ${renderBeSaoSVG(AppState.practiceSolved ? 'happy' : 'guide', 76)}
              <h3 class="text-xl sm:text-3xl font-black text-[#202E59]">${q.promptText}</h3>
            </div>
            <div class="grid grid-cols-1 ${opts.length === 2 ? 'sm:grid-cols-2' : 'sm:grid-cols-3'} gap-5 mb-6">${optCards}</div>
            <div class="min-h-[72px] flex flex-wrap items-center justify-between gap-4">
              <div class="px-5 py-3 rounded-2xl font-extrabold text-lg ${
                AppState.practiceFeedback
                  ? AppState.practiceSolved
                    ? 'bg-emerald-100 text-emerald-900'
                    : 'bg-amber-100 text-amber-900'
                  : 'text-slate-500'
              }">
                ${AppState.practiceFeedback || 'Bé hãy chạm vào đáp án đúng nhé!'}
              </div>
              ${
                AppState.practiceSolved
                  ? `<button onclick="AppActions.nextPractice()" class="min-h-[72px] px-8 rounded-2xl bg-[#388E3C] text-white font-black text-xl shadow-lg">${
                      AppState.practiceIdx < AppState.practiceList.length - 1 ? 'Câu tiếp theo ➡' : '🎉 Hoàn thành'
                    }</button>`
                  : ''
              }
            </div>
          </div>
        </div>
      `;
    }

    function renderPlayContent() {
      const games = [
        { id: 'tap', title: '1. Chạm đúng nào!' },
        { id: 'drag', title: '2. Kéo thả thông minh' },
        { id: 'match', title: '3. Tìm đôi bạn thân' },
        { id: 'countStars', title: '4. Đếm sao ngân hà' },
        { id: 'sort', title: '5. Phân loại tài giỏi' },
        { id: 'challenge', title: '6. Thử thách phi hành gia' }
      ];

      const tabs = games
        .map(
          (g) => `
          <button onclick="AppActions.selectGame('${g.id}')"
            class="min-h-[64px] p-3 rounded-2xl border-2 text-left font-black text-sm sm:text-base transition ${
              AppState.game === g.id ? 'bg-[#202E59] text-white border-[#202E59]' : 'bg-white text-[#202E59] border-slate-200'
            }">${g.title}</button>
        `
        )
        .join('');

      let body = '';
      if (AppState.game === 'tap' || AppState.game === 'challenge') {
        body = renderPracticeContent();
      } else if (AppState.game === 'drag') {
        const srcs = AppState.dragPairs
          .map((item) => {
            const done = AppState.dragMatched.includes(item.key);
            return `
              <div data-drag-key="${item.key}"
                data-drag-active="${!done}"
                data-drag-label="${item.label.replace(/"/g, '&quot;')}"
                class="draggable-item min-h-[135px] p-4 rounded-3xl border-4 flex flex-col items-center justify-center transition-colors touch-none ${
                  done ? 'opacity-25 border-slate-200 bg-slate-50 cursor-default' : 'border-[#6C6AA7] bg-white cursor-grab hover:shadow-md'
                }">
                ${renderVisualOptionHTML(item, 86)}
                <span class="font-extrabold text-base mt-1 pointer-events-none">${item.label}</span>
              </div>
            `;
          })
          .join('');

        const tgts = AppState.dragShuffledTargets
          .map((t) => {
            const done = AppState.dragMatched.includes(t.key);
            const container =
              t.kind === 'shape3d'
                ? renderHouseSVG(t.shapeType, t.colorId, done, t.label)
                : renderBasketSVG(t.colorId || 'red', done ? 1 : 0, t.label);
            return `
              <div data-drop-key="${t.key}"
                class="drop-target-zone min-h-[155px] p-4 rounded-3xl border-4 border-dashed flex flex-col items-center justify-center transition-all ${
                  done ? 'border-[#388E3C] bg-emerald-50 border-solid' : 'border-slate-300 bg-[#F8F4EC]'
                }">
                <div class="pointer-events-none">${container}</div>
              </div>
            `;
          })
          .join('');

        body = `
          <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200 max-w-4xl w-full mx-auto">
            <h3 class="text-xl sm:text-2xl font-black text-[#202E59] mb-6 text-center">Bé hãy giữ và kéo đồ vật bên trên di chuyển thả vào đúng giỏ hoặc ngôi nhà bên dưới nhé!</h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8">${srcs}</div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">${tgts}</div>
          </div>
        `;
      } else if (AppState.game === 'match') {
        const leftHtml = AppState.matchPairs
          .map((p) => {
            const done = AppState.matchSolved.includes(p.id);
            const picked = AppState.matchLeftPicked === p.id;
            return `
              <button onclick="AppActions.pickMatchLeft('${p.id}', '${p.left.label.replace(/'/g, "\\'")}')"
                class="w-full min-h-[130px] p-4 rounded-3xl border-4 flex flex-col items-center justify-center ${
                  done ? 'bg-emerald-50 border-[#388E3C] opacity-60' : picked ? 'bg-amber-50 border-[#F4C430] scale-105' : 'bg-white border-slate-200'
                }">
                ${renderVisualOptionHTML(p.left, 82)}
                <span class="font-extrabold text-base mt-1">${p.left.label}</span>
              </button>
            `;
          })
          .join('');

        const rightHtml = AppState.matchRightList
          .map((item) => {
            const done = AppState.matchSolved.includes(item.id);
            return `
              <button onclick="AppActions.pickMatchRight('${item.id}', '${item.opt.label.replace(/'/g, "\\'")}')"
                class="w-full min-h-[130px] p-4 rounded-3xl border-4 flex flex-col items-center justify-center ${
                  done ? 'bg-emerald-50 border-[#388E3C] opacity-60' : AppState.matchLeftPicked ? 'bg-sky-50 border-[#1976D2]' : 'bg-white border-slate-200'
                }">
                ${renderVisualOptionHTML(item.opt, 82)}
                <span class="font-extrabold text-base mt-1">${item.opt.label}</span>
              </button>
            `;
          })
          .join('');

        body = `
          <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200 max-w-4xl w-full mx-auto">
            <h3 class="text-xl sm:text-2xl font-black text-[#202E59] mb-6 text-center">Chạm một thẻ bên trái rồi chạm bạn thân bên phải nhé!</h3>
            <div class="grid grid-cols-2 gap-6 sm:gap-12">
              <div class="space-y-4">${leftHtml}</div>
              <div class="space-y-4">${rightHtml}</div>
            </div>
          </div>
        `;
      } else if (AppState.game === 'countStars') {
        let starsHtml = '';
        for (let i = 0; i < AppState.countTarget; i++) {
          const order = AppState.countClicked.indexOf(i);
          const counted = order !== -1;
          starsHtml += `
            <button onclick="AppActions.tapCountStar(${i})" class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex items-center justify-center ${
              counted ? 'bg-white/20 ring-4 ring-[#F8D375]' : 'bg-white/5 hover:bg-white/15'
            }">
              ${renderSingleObjectSVG('star', counted ? 'yellow' : 'white', 62)}
              ${counted ? `<span class="absolute -top-2 -right-2 w-8 h-8 rounded-full bg-[#388E3C] text-white font-black flex items-center justify-center">${order + 1}</span>` : ''}
            </button>
          `;
        }
        const digitsHtml = AppState.countChoices
          .map(
            (num) => `
            <button onclick="AppActions.chooseCountDigit(${num})" class="min-h-[96px] rounded-3xl border-4 font-black text-4xl flex items-center justify-center ${
              AppState.countSolved && num === AppState.countTarget ? 'bg-emerald-100 border-[#388E3C]' : 'bg-[#F8F4EC] border-slate-200 hover:border-[#202E59]'
            }">${num}</button>
          `
          )
          .join('');

        body = `
          <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200 max-w-4xl w-full mx-auto text-center">
            <div class="flex items-center justify-between mb-4">
              <span class="px-4 py-1.5 rounded-full bg-[#202E59] text-[#F8D375] font-extrabold text-lg">Đã đếm: ${AppState.countClicked.length} ngôi sao</span>
              <button onclick="SoundEngine.speak('Bé hãy chạm vào từng ngôi sao màu vàng để cùng đếm nhé!')" class="min-h-[60px] px-4 rounded-2xl bg-[#F8D375] font-bold">🔊 Nghe lại</button>
            </div>
            <div class="bg-[#202E59] rounded-3xl p-6 min-h-[200px] flex flex-wrap items-center justify-center gap-4 mb-6">${starsHtml}</div>
            <p class="text-xl font-black text-[#202E59] mb-4">Có tất cả bao nhiêu ngôi sao màu vàng? Bé chọn số đúng nào!</p>
            <div class="grid grid-cols-3 gap-4 max-w-xl mx-auto">${digitsHtml}</div>
          </div>
        `;
      } else if (AppState.game === 'sort') {
        const rem = AppState.sortItems.filter((i) => !AppState.sortDone.includes(i.key));
        const curr = rem.find((i) => i.key === AppState.sortActiveKey) || rem[0];
        const remHtml = rem
          .map(
            (it) => `
            <button onclick="AppActions.pickSortItem('${it.key}', '${it.label.replace(/'/g, "\\'")}')"
              class="p-4 rounded-3xl border-4 transition ${curr && curr.key === it.key ? 'border-[#202E59] bg-amber-50 scale-110 shadow-md' : 'border-slate-200 opacity-75'}">
              ${renderVisualOptionHTML(it, 76)}
            </button>
          `
          )
          .join('');

        const basketsHtml = AppState.sortBaskets
          .map((b) => {
            const cnt = AppState.sortItems.filter((i) => AppState.sortDone.includes(i.key) && i.groupId === b.id).length;
            const vis = b.shape ? renderHouseSVG(b.shape, b.color, cnt > 0, `${b.label} (${cnt})`) : renderBasketSVG(b.color, cnt, b.label);
            return `
              <button onclick="AppActions.dropSortBasket('${b.id}')" class="min-h-[150px] p-4 rounded-3xl border-4 border-slate-200 bg-[#F8F4EC] hover:bg-white flex items-center justify-center shadow-sm">
                ${vis}
              </button>
            `;
          })
          .join('');

        body = `
          <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200 max-w-4xl w-full mx-auto text-center">
            <h3 class="text-xl sm:text-2xl font-black text-[#202E59] mb-4">Đưa đồ vật đang sáng vào đúng giỏ hoặc ngôi nhà nhé!</h3>
            <div class="flex flex-wrap items-center justify-center gap-4 mb-8 min-h-[120px]">${remHtml}</div>
            <div class="grid grid-cols-1 ${AppState.sortBaskets.length === 2 ? 'sm:grid-cols-2' : 'sm:grid-cols-3'} gap-5">${basketsHtml}</div>
          </div>
        `;
      }

      return `
        <div class="flex-1 flex flex-col gap-5">
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">${tabs}</div>
          <div class="flex-1 flex flex-col">${body}</div>
        </div>
      `;
    }

    function renderLesson() {
      const m = AppState.mode;
      const content = m === 'explore' ? renderExploreContent() : m === 'practice' ? renderPracticeContent() : renderPlayContent();
      return `
        <div class="flex-1 bg-[#F8F4EC] flex flex-col">
          <header class="bg-white border-b-2 border-slate-200 px-3 sm:px-6 py-3">
            <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <button onclick="AppActions.goMap()" class="min-h-[64px] px-5 rounded-2xl bg-slate-100 hover:bg-slate-200 font-extrabold text-lg">⬅ Bản đồ</button>
              <div class="flex items-center gap-2 bg-[#F8F4EC] p-1.5 rounded-2xl border border-slate-200">
                <button onclick="AppActions.switchMode('explore')" class="min-h-[56px] px-4 rounded-xl font-extrabold text-sm sm:text-base ${m === 'explore' ? 'bg-[#202E59] text-white shadow' : 'text-[#202E59]'}">Khám phá</button>
                <button onclick="AppActions.switchMode('practice')" class="min-h-[56px] px-4 rounded-xl font-extrabold text-sm sm:text-base ${m === 'practice' ? 'bg-[#202E59] text-white shadow' : 'text-[#202E59]'}">Thực hành</button>

    function renderGateModal() {

            <input id="gateInput" type="number" placeholder="Nhập kết quả..." class="w-full min-h-[56px] px-4 rounded-xl border-2 border-slate-300 text-xl font-bold text-center mb-3" autofocus />

      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;
      let html = '';
      if (AppState.screen === 'welcome') html = renderWelcome();
      else if (AppState.screen === 'ageSelect') html = renderAgeSelect();
      else if (AppState.screen === 'map') html = renderMap();
      else if (AppState.screen === 'lesson') html = renderLesson();
      else if (AppState.screen === 'complete') html = renderComplete();
      else if (AppState.screen === 'teacher') html = renderTeacher();
      root.innerHTML = html + renderGateModal();
      bindPointerDragEvents();
    }

    function bindPointerDragEvents() {
      const draggables = document.querySelectorAll('.draggable-item[data-drag-active="true"]');
      const dropZones = Array.from(document.querySelectorAll('.drop-target-zone'));

      draggables.forEach((el) => {
        const activeKey = el.getAttribute('data-drag-key');
        const activeLabel = el.getAttribute('data-drag-label') || '';
        let cloneEl = null;
        let isDragging = false;
        let hoveredZone = null;

        el.addEventListener('pointerdown', (e) => {
          if (e.button !== 0 && e.pointerType === 'mouse') return;
          e.preventDefault();
          isDragging = true;
          AppState.dragSelected = activeKey;
          SoundEngine.playSFX('tap');
          SoundEngine.speak(activeLabel);

          const rect = el.getBoundingClientRect();
          cloneEl = el.cloneNode(true);
          cloneEl.style.position = 'fixed';
          cloneEl.style.left = rect.left + 'px';
          cloneEl.style.top = rect.top + 'px';
          cloneEl.style.width = rect.width + 'px';
          cloneEl.style.height = rect.height + 'px';
          cloneEl.style.zIndex = '9999';
          cloneEl.style.pointerEvents = 'none';
          cloneEl.style.boxShadow = '0 18px 36px rgba(32, 46, 89, 0.28)';
          cloneEl.style.borderColor = '#F4C430';
          cloneEl.style.backgroundColor = '#FFFBEB';
          cloneEl.style.transform = 'scale(1.08)';
          document.body.appendChild(cloneEl);

          el.style.opacity = '0.35';
          el.setPointerCapture(e.pointerId);
        });

        el.addEventListener('pointermove', (e) => {
          if (!isDragging || !cloneEl) return;
          e.preventDefault();
          cloneEl.style.left = (e.clientX - cloneEl.offsetWidth / 2) + 'px';
          cloneEl.style.top = (e.clientY - cloneEl.offsetHeight / 2) + 'px';

          // Highlight giỏ/nhà khi đồ vật di chuyển tới gần
          let foundZone = null;
          for (const z of dropZones) {
            const r = z.getBoundingClientRect();
            if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
              foundZone = z;
              break;
            }
          }
          if (hoveredZone && hoveredZone !== foundZone) {
            hoveredZone.classList.remove('ring-4', 'ring-[#1976D2]', 'scale-105', 'bg-sky-50');
          }
          if (foundZone) {
            foundZone.classList.add('ring-4', 'ring-[#1976D2]', 'scale-105', 'bg-sky-50');
          }
          hoveredZone = foundZone;
        });

        const finishPointerDrag = (e) => {
          if (!isDragging) return;
          isDragging = false;
          if (cloneEl) {
            cloneEl.remove();
            cloneEl = null;
          }
          el.style.opacity = '1';

          if (hoveredZone) {
            hoveredZone.classList.remove('ring-4', 'ring-[#1976D2]', 'scale-105', 'bg-sky-50');
            const targetKey = hoveredZone.getAttribute('data-drop-key');
            hoveredZone = null;
            if (targetKey) {
              window.AppActions.dropDragTarget(targetKey);
              return;
            }
          }
          // Nếu bé thả ra ngoài vùng giỏ/ngôi nhà, đồ vật tự quay về chỗ cũ
          AppState.dragSelected = null;
        };

        el.addEventListener('pointerup', finishPointerDrag);
        el.addEventListener('pointercancel', finishPointerDrag);
      });
    }

    window.addEventListener('DOMContentLoaded', render);
    render();
  </script>
