<!DOCTYPE html>
<html lang="vi">
<head>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #F8F4EC;
      color: #202E59;
      overflow-x: hidden;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(1.5deg); }
    }
    @keyframes pulseHint {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 196, 48, 0.8); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 16px rgba(244, 196, 48, 0); }
    }
    @keyframes popIn {
      0% { transform: scale(0.86); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-float { animation: floatSlow 3.6s ease-in-out infinite; }
    .animate-hint { animation: pulseHint 1.5s infinite; }
    .animate-pop { animation: popIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .galaxy-bg {
      background: radial-gradient(circle at 20% 15%, #3B4384 0%, #202E59 55%, #162042 100%);
    }
    .card-3d {
      box-shadow: 0 10px 24px -5px rgba(32, 46, 89, 0.14), 0 4px 10px -2px rgba(32, 46, 89, 0.08);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }
    .card-3d:active { transform: scale(0.96); }
    .btn-3d {
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
    }
    input, textarea, select { user-select: text; }

</head>
<body class="min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
  /**
   * ============================================================================
   * 1. BỘ MÁY ÂM THANH & GIỌNG ĐỌC TIẾNG VIỆT MIỀN NAM 3 TẦNG (MULTI-LAYER TTS)
   * Đảm bảo to rõ, dễ nghe, không chồng tiếng và không bao giờ mất giọng
   * ============================================================================
   */
  const SoundEngine = (function () {
    let audioCtx = null;
    let currentAudio = null;
    let speechToken = 0;

    function unlockAudio() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        window.audioCtx = audioCtx;
      } catch (e) {}
    }

    document.addEventListener('pointerdown', unlockAudio, { passive: true });
    document.addEventListener('keydown', unlockAudio, { passive: true });

    function playSFX(type) {
      if (!AppState.config.soundEnabled) return;
      unlockAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === 'tap') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.08);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } else if (type === 'correct') {
        [587.33, 880, 1174.66].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(0.25, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.36);
        });
      } else if (type === 'retry') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(240, now + 0.18);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.21);
      } else if (type === 'complete') {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.13);
          gain.gain.setValueAtTime(0.28, now + idx * 0.13);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.13 + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.13);
          osc.stop(now + idx * 0.13 + 0.46);
        });
      }
    }

    function stopAllSpeech() {
      speechToken++;
      try {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } catch (e) {}
      try {
        if (window.responsiveVoice && typeof window.responsiveVoice.cancel === 'function') {
          window.responsiveVoice.cancel();
        }
      } catch (e) {}
      if (currentAudio) {
        try {
          currentAudio.pause();
          currentAudio.src = '';
        } catch (e) {}
        currentAudio = null;
      }
    }

    function getSouthernVietnameseVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;
      const southernKeys = ['linh', 'hoaimy', 'hoai my', 'southern', 'miền nam', 'mien nam'];
      for (const kw of southernKeys) {
        const found = voices.find(
          (v) =>
            (v.lang.toLowerCase().includes('vi') || v.name.toLowerCase().includes('vietnam')) &&
            v.name.toLowerCase().includes(kw)
        );
        if (found) return found;
      }
      return (
        voices.find((v) => v.lang.toLowerCase().includes('vi-vn') || v.lang.toLowerCase().startsWith('vi')) ||
        null
      );
    }

    function splitIntoChunks(text) {
      const clean = text.replace(/\s+/g, ' ').trim();
      if (!clean) return [];
      const parts = clean.split(/(?<=[.!?])\s+/);
      const chunks = [];
      parts.forEach((p) => {
        if (p.length <= 135) chunks.push(p);
        else p.split(/,\s+/).forEach((s) => chunks.push(s));
      });
      return chunks.filter(Boolean);
    }

    function playGoogleTTSChunks(chunks, token, rate) {
      if (!chunks.length || token !== speechToken) return;
      const chunk = chunks.shift();
      const encoded = encodeURIComponent(chunk);
      const urls = [
        `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${encoded}&tl=vi&client=tw-ob`,
        `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${encoded}&tl=vi&client=gtx`,
      ];
      let idx = 0;

      function tryNext() {
        if (token !== speechToken) return;
        if (idx >= urls.length) {
          if (window.responsiveVoice && typeof window.responsiveVoice.speak === 'function') {
            window.responsiveVoice.speak(chunk, 'Vietnamese Female', {
              rate: Math.min(1.1, Math.max(0.75, rate)),
              pitch: 1.08,
              volume: 1,
              onend: () => playGoogleTTSChunks(chunks, token, rate),
            });
          }
          return;
        }
        const audio = new Audio(urls[idx]);
        audio.volume = 1.0;
        audio.playbackRate = Math.min(1.15, Math.max(0.8, rate + 0.04));
        currentAudio = audio;
        audio.onended = () => {
          if (token === speechToken) playGoogleTTSChunks(chunks, token, rate);
        };
        audio.onerror = () => {
          idx++;
          tryNext();
        };
        audio.play().catch(() => {
          idx++;
          tryNext();
        });
      }
      tryNext();
    }

    function speak(text) {
      if (!AppState.config.soundEnabled || !text) return;
      unlockAudio();
      stopAllSpeech();

      const token = ++speechToken;
      const rate = AppState.config.speechRate || 0.88;
      const mode = AppState.config.ttsMode || 'auto';

      if (mode === 'online') {
        playGoogleTTSChunks(splitIntoChunks(text), token, rate);
        return;
      }

      const viVoice = getSouthernVietnameseVoice();
      if (viVoice && 'speechSynthesis' in window) {
        try {
          const utter = new SpeechSynthesisUtterance(text);
          utter.voice = viVoice;
          utter.lang = 'vi-VN';
          utter.rate = rate;
          utter.pitch = 1.1;
          utter.volume = 1.0;

          let started = false;
          utter.onstart = () => { started = true; };
          utter.onerror = () => {
            if (token === speechToken && mode === 'auto') {
              playGoogleTTSChunks(splitIntoChunks(text), token, rate);
            }
          };
          window.speechSynthesis.speak(utter);

          if (mode === 'auto') {
            setTimeout(() => {
              if (!started && token === speechToken && !window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                playGoogleTTSChunks(splitIntoChunks(text), token, rate);
              }
            }, 700);
          }
          return;
        } catch (e) {}
      }

      playGoogleTTSChunks(splitIntoChunks(text), token, rate);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    return { speak, stopAllSpeech, playSFX, unlockAudio };
  })();

  /**
   * ============================================================================
   * 2. NGUỒN DỮ LIỆU CHUẨN DUY NHẤT (SINGLE SOURCE OF TRUTH)
   * Ràng buộc trực tiếp objectType, colorId, count, containerType
   * Đảm bảo: Nói "ngôi sao" -> hiện NGÔI SAO; nói "giỏ" -> hiện CHIẾC GIỎ; nói "ngôi nhà" -> hiện NGÔI NHÀ
   * ============================================================================
   */
  const COLORS_DB = {
    red: { id: 'red', name: 'Màu đỏ', shortName: 'màu đỏ', hex: '#E53935', light: '#FFCDD2', dark: '#9A0007', objName: 'Quả táo đỏ', objType: 'apple' },
    yellow: { id: 'yellow', name: 'Màu vàng', shortName: 'màu vàng', hex: '#F4C430', light: '#FFF9C4', dark: '#B28704', objName: 'Ngôi sao vàng', objType: 'star' },
    blue: { id: 'blue', name: 'Màu xanh dương', shortName: 'màu xanh dương', hex: '#1976D2', light: '#BBDEFB', dark: '#004BA0', objName: 'Quả bóng xanh dương', objType: 'ball' },
    green: { id: 'green', name: 'Màu xanh lá', shortName: 'màu xanh lá', hex: '#388E3C', light: '#C8E6C9', dark: '#00600F', objName: 'Chiếc lá xanh', objType: 'leaf' },
    orange: { id: 'orange', name: 'Màu cam', shortName: 'màu cam', hex: '#FB8C00', light: '#FFE0B2', dark: '#BB4D00', objName: 'Quả cam chín', objType: 'orange' },
    purple: { id: 'purple', name: 'Màu tím', shortName: 'màu tím', hex: '#8E24AA', light: '#E1BEE7', dark: '#5C007A', objName: 'Bông hoa tím', objType: 'flower' },
    pink: { id: 'pink', name: 'Màu hồng', shortName: 'màu hồng', hex: '#EC407A', light: '#F8BBD0', dark: '#B4004E', objName: 'Bông hoa hồng', objType: 'flower' },
    white: { id: 'white', name: 'Màu trắng', shortName: 'màu trắng', hex: '#FFFFFF', light: '#FFFFFF', dark: '#94A3B8', objName: 'Đám mây trắng', objType: 'cloud' },
    black: { id: 'black', name: 'Màu đen', shortName: 'màu đen', hex: '#263238', light: '#78909C', dark: '#000A12', objName: 'Chiếc ô tô đen', objType: 'car' },
  };

  const OBJECT_LABELS = {
    star: 'Ngôi sao',
    ball: 'Quả bóng',
    apple: 'Quả táo',
    flower: 'Bông hoa',
    car: 'Chiếc ô tô',
    leaf: 'Chiếc lá',
    orange: 'Quả cam',
    cloud: 'Đám mây',
  };

  const SHAPES_DB = {
    circle: { id: 'circle', name: 'Hình tròn', desc: 'Hình tròn có đường bao cong khép kín, lăn được.', realName: 'Chiếc đồng hồ tròn', realType: 'clock' },
    square: { id: 'square', name: 'Hình vuông', desc: 'Hình vuông có 4 cạnh bằng nhau và 4 góc vuông.', realName: 'Chiếc bánh quy vuông', realType: 'biscuit' },
    triangle: { id: 'triangle', name: 'Hình tam giác', desc: 'Hình tam giác có 3 cạnh và 3 góc nhọn.', realName: 'Miếng dưa hấu tam giác', realType: 'watermelon' },
    rectangle: { id: 'rectangle', name: 'Hình chữ nhật', desc: 'Hình chữ nhật có 2 cạnh dài và 2 cạnh ngắn.', realName: 'Quyển sách chữ nhật', realType: 'book' },
  };

  const SOLIDS_DB = {
    sphere: { id: 'sphere', name: 'Khối cầu', desc: 'Khối cầu tròn đều mọi phía và lăn được về mọi hướng.', realName: 'Quả bóng tròn', realType: 'soccer' },
    cylinder: { id: 'cylinder', name: 'Khối trụ', desc: 'Khối trụ có 2 mặt đáy hình tròn và lăn được khi nằm ngang.', realName: 'Lon sữa hình trụ', realType: 'milkcan' },
    cube: { id: 'cube', name: 'Khối vuông', desc: 'Khối vuông (khối lập phương) có 6 mặt đều là hình vuông bằng nhau.', realName: 'Khối Rubik vuông', realType: 'rubik' },
    cuboid: { id: 'cuboid', name: 'Khối chữ nhật', desc: 'Khối chữ nhật có 6 mặt hình chữ nhật, không lăn được và xếp chồng được.', realName: 'Hộp quà chữ nhật', realType: 'giftbox' },
  };

  const AGE_META = {
    '2yo': { id: '2yo', title: 'Nhà trẻ 2 tuổi', sub: '24 – 36 tháng tuổi', badge: 'Lớp Nhà trẻ 2', bg: '#E8F5E9', border: '#388E3C' },
    '3yo': { id: '3yo', title: 'Mẫu giáo 3 tuổi', sub: '3 – 4 tuổi', badge: 'Lớp Mầm', bg: '#E3F2FD', border: '#1976D2' },
    '4yo': { id: '4yo', title: 'Mẫu giáo 4 tuổi', sub: '4 – 5 tuổi', badge: 'Lớp Chồi', bg: '#FFF8E1', border: '#FB8C00' },
    '5yo': { id: '5yo', title: 'Mẫu giáo 5 tuổi', sub: '5 – 6 tuổi', badge: 'Lớp Lá', bg: '#F3E5F5', border: '#8E24AA' },
  };

  const PLANETS_META = [
    { id: 'colors', title: 'Sắc Màu Rực Rỡ', desc: 'Nhận biết và phân biệt màu sắc tươi sáng', mainColor: '#E53935', ringColor: '#F8D375' },
    { id: 'shapes', title: 'Hình Dạng Kỳ Diệu', desc: 'Khám phá hình tròn, vuông, tam giác, chữ nhật', mainColor: '#1976D2', ringColor: '#A8D6E8' },
    { id: 'numbers', title: 'Con Số Vui Nhộn', desc: 'Số lượng, đếm sao và làm quen chữ số', mainColor: '#F4C430', ringColor: '#F5C6D9' },
    { id: 'solids', title: 'Khối Hình Thần Kỳ', desc: 'Khám phá khối cầu, khối trụ, khối vuông, khối chữ nhật 3D', mainColor: '#8E24AA', ringColor: '#A8D6E8' },
  ];

  function createDefaultQuestions() {
    const list = [];

    // --- NHÓM A: NHÀ TRẺ 2 TUỔI (24 - 36 THÁNG) ---
    const specs2yoColor = [
      { cols: ['red', 'yellow'], objType: 'star' },
      { cols: ['yellow', 'blue'], objType: 'ball' },
      { cols: ['blue', 'red'], objType: 'apple' },
      { cols: ['red', 'blue'], objType: 'flower' },
      { cols: ['yellow', 'red'], objType: 'car' },
      { cols: ['blue', 'yellow'], objType: 'star' },
      { cols: ['red', 'yellow', 'blue'], objType: 'ball' },
      { cols: ['yellow', 'red', 'blue'], objType: 'star' },
      { cols: ['blue', 'red', 'yellow'], objType: 'apple' },
      { cols: ['red', 'blue', 'yellow'], objType: 'flower' },
    ];
    specs2yoColor.forEach((spec, i) => {
      const targetId = spec.cols[0];
      const spokenColor = targetId === 'blue' ? 'màu xanh' : COLORS_DB[targetId].shortName;
      const objLabel = OBJECT_LABELS[spec.objType];
      list.push({
        id: `2yo_c_${i + 1}`,
        ageGroup: '2yo',
        planet: 'colors',
        objectType: spec.objType,
        containerType: 'basket',
        promptText: `Bé hãy chạm vào ${objLabel.toLowerCase()} ${spokenColor} nhé!`,
        hintText: `Con nhìn kỹ xem, đâu là ${objLabel.toLowerCase()} ${spokenColor}?`,
        targetKey: `col_${targetId}`,
        options: spec.cols.map((cid) => ({
          key: `col_${cid}`,
          label: `${objLabel} ${cid === 'blue' ? 'màu xanh' : COLORS_DB[cid].shortName}`,
          kind: 'coloredObj',
          colorId: cid,
          objType: spec.objType,
          groupId: cid,
        })),
      });
    });

    const shapes2yo = ['circle', 'square', 'circle', 'square', 'circle', 'square', 'circle', 'square', 'circle', 'square'];
    shapes2yo.forEach((shId, i) => {
      const otherId = shId === 'circle' ? 'square' : 'circle';
      const c1 = i % 2 === 0 ? 'red' : 'blue';
      const c2 = i % 2 === 0 ? 'yellow' : 'red';
      list.push({
        id: `2yo_s_${i + 1}`,
        ageGroup: '2yo',
        planet: 'shapes',
        objectType: 'shape',
        containerType: 'house',
        promptText: `Bé tìm ${SHAPES_DB[shId].name.toLowerCase()} nào!`,
        hintText: shId === 'circle' ? 'Hình tròn lăn được như quả bóng đấy con!' : 'Hình vuông có 4 góc vuông vắn nhé!',
        targetKey: `shp_${shId}`,
        options: [
          { key: `shp_${shId}`, label: SHAPES_DB[shId].name, kind: 'shape3d', shapeType: shId, colorId: c1, groupId: shId },
          { key: `shp_${otherId}`, label: SHAPES_DB[otherId].name, kind: 'shape3d', shapeType: otherId, colorId: c2, groupId: otherId },
        ],
      });
    });

    const countObjs2yo = [
      { itemType: 'star', singular: 'một ngôi sao', plural: 'nhiều ngôi sao', unit: 'ngôi sao' },
      { itemType: 'apple', singular: 'một quả táo', plural: 'nhiều quả táo', unit: 'quả táo' },
      { itemType: 'flower', singular: 'một bông hoa', plural: 'nhiều bông hoa', unit: 'bông hoa' },
      { itemType: 'star', singular: 'một ngôi sao', plural: 'nhiều ngôi sao', unit: 'ngôi sao' },
      { itemType: 'ball', singular: 'một quả bóng', plural: 'nhiều quả bóng', unit: 'quả bóng' },
      { itemType: 'star', singular: 'một ngôi sao', plural: 'nhiều ngôi sao', unit: 'ngôi sao' },
    ];
    countObjs2yo.forEach((spec, i) => {
      const isOne = i % 2 === 0;
      const manyCnt = (i % 3) + 4;
      list.push({
        id: `2yo_n_${i + 1}`,
        ageGroup: '2yo',
        planet: 'numbers',
        objectType: spec.itemType,
        containerType: 'basket',
        promptText: isOne ? `Bé chỉ cho cô nhóm có ${spec.singular}!` : `Đâu là nhóm có ${spec.plural}?`,
        hintText: isOne ? `Chỉ có đúng ${spec.singular} đứng một mình thôi con!` : `Nhóm nào có rất ${spec.plural} cùng nhau nhỉ?`,
        targetKey: isOne ? 'num_one' : 'num_many',
        options: [
          { key: 'num_one', label: `Một ${spec.unit}`, kind: 'itemGroup', itemType: spec.itemType, count: 1, groupId: 'one' },
          { key: 'num_many', label: `Nhiều ${spec.unit}`, kind: 'itemGroup', itemType: spec.itemType, count: manyCnt, groupId: 'many' },
        ],
      });
    });

    [1, 2, 3, 2].forEach((n, i) => {
      const wrong = n === 1 ? 3 : n === 2 ? 4 : 1;
      list.push({
        id: `2yo_n_ext_${i + 1}`,
        ageGroup: '2yo',
        planet: 'numbers',
        isExtended: true,
        objectType: 'star',
        containerType: 'basket',
        promptText: `Bé tìm nhóm có ${n} ngôi sao nhé!`,
        hintText: `Mình cùng chỉ tay đếm từng ngôi sao đến ${n} nào!`,
        targetKey: `cnt_${n}`,
        options: [
          { key: `cnt_${n}`, label: `${n} ngôi sao`, kind: 'itemGroup', itemType: 'star', count: n },
          { key: `cnt_${wrong}`, label: `${wrong} ngôi sao`, kind: 'itemGroup', itemType: 'star', count: wrong },
        ],
      });
    });

    // --- NHÓM B: MẪU GIÁO 3 TUỔI ---
    const cols3yo = ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink', 'white', 'black', 'red'];
    cols3yo.forEach((cid, i) => {
      const pool = Object.keys(COLORS_DB).filter((k) => k !== cid);
      const d1 = pool[i % pool.length];
      const d2 = pool[(i + 3) % pool.length];
      list.push({
        id: `3yo_c_${i + 1}`,
        ageGroup: '3yo',

  const DEFAULT_CONFIG = {
    selectedAge: '2yo',
    enableExtended: false,
    enableSolidsForAll: false,
    questionsPerSession: 5,
    soundEnabled: true,
    speechRate: 0.88,
    ttsMode: 'auto',
  };

  const DEFAULT_STATS = {
    sessionsCompleted: 0,
    totalCorrect: 0,
    totalAttempts: 0,
    hintsUsed: 0,
    byPlanet: {
      colors: { correct: 0, attempts: 0 },
      shapes: { correct: 0, attempts: 0 },
      numbers: { correct: 0, attempts: 0 },
      solids: { correct: 0, attempts: 0 },
    },
  };

  function loadStorage(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? { ...fallback, ...JSON.parse(raw) } : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function loadCustomQuestions() {
    try {
      const raw = localStorage.getItem('bkpng_html_custom_q');
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  const AppState = {
    screen: 'welcome', // 'welcome' | 'ageSelect' | 'map' | 'lesson' | 'complete' | 'teacher'
    config: loadStorage('bkpng_html_cfg', DEFAULT_CONFIG),
    stats: loadStorage('bkpng_html_stats', DEFAULT_STATS),
    questionBank: [...createDefaultQuestions(), ...loadCustomQuestions()],
    activePlanet: 'colors',
    activeMode: 'explore', // 'explore' | 'practice' | 'play'

    },
  };

  let hintTimer = null;

  function saveConfig() {
    try { localStorage.setItem('bkpng_html_cfg', JSON.stringify(AppState.config)); } catch (e) {}
  }

  function saveStats() {
    try { localStorage.setItem('bkpng_html_stats', JSON.stringify(AppState.stats)); } catch (e) {}
  }

  function saveCustomQuestions() {
    try {
      const custom = AppState.questionBank.filter((q) => q.isCustom);
      localStorage.setItem('bkpng_html_custom_q', JSON.stringify(custom));
    } catch (e) {}
  }

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function getFilteredQuestions() {
    return AppState.questionBank.filter(
      (q) =>
        q.ageGroup === AppState.config.selectedAge &&
        q.planet === AppState.activePlanet &&
        (AppState.config.enableExtended || !q.isExtended)
    );
  }

  function recordAttempt(isCorrect, usedHint = false) {
    const p = AppState.activePlanet;
    AppState.stats.totalAttempts += 1;
    if (isCorrect) AppState.stats.totalCorrect += 1;
    if (usedHint) AppState.stats.hintsUsed += 1;
    AppState.stats.byPlanet[p].attempts += 1;
    if (isCorrect) AppState.stats.byPlanet[p].correct += 1;
    saveStats();
  }

  function clearHintTimer() {
    if (hintTimer) {
      clearTimeout(hintTimer);
      hintTimer = null;
    }
  }

  function startHintTimer() {
    clearHintTimer();
    hintTimer = setTimeout(() => {
      if (
        AppState.screen === 'lesson' &&
        (AppState.activeMode === 'practice' ||
          (AppState.activeMode === 'play' && (AppState.activeGame === 'tap' || AppState.activeGame === 'challenge'))) &&
        !AppState.lesson.isSolved
      ) {
        AppState.lesson.showHintGlow = true;
        renderApp();
      }
    }, 8000);
  }

  /**
   * ============================================================================
   * 5. KHỞI TẠO CÁC HOẠT ĐỘNG & TRÒ CHƠI
   * ============================================================================
   */
  function initPracticeSession(limitOverride = null) {
    const pool = shuffleArray(getFilteredQuestions());
    const limit = limitOverride || AppState.config.questionsPerSession;
    AppState.lesson.sessionList = pool.slice(0, Math.min(limit, pool.length));
    AppState.lesson.qIdx = 0;
    loadCurrentQuestion();
  }

  function loadCurrentQuestion() {
    clearHintTimer();
    const q = AppState.lesson.sessionList[AppState.lesson.qIdx];
    AppState.lesson.selectedKey = null;
    AppState.lesson.isSolved = false;
    AppState.lesson.feedback = '';
    AppState.lesson.showHintGlow = false;
    AppState.lesson.shuffledOptions = q ? shuffleArray(q.options) : [];
    if (q) {
      SoundEngine.speak(q.promptText);
      startHintTimer();
    }
  }

  function initDragGame() {
    const pool = getFilteredQuestions();
    const sample = pool[Math.floor(Math.random() * pool.length)] || pool[0];
    AppState.lesson.dragSampleQ = sample;
    AppState.lesson.dragSources = sample ? shuffleArray(sample.options) : [];
    AppState.lesson.dragSelectedSource = null;
    AppState.lesson.dragMatched = [];
    const promptMsg =
      sample && sample.containerType === 'basket'
        ? 'Bé hãy kéo từng đồ vật bỏ vào đúng chiếc giỏ nhé!'
        : 'Bé hãy đưa từng hình về đúng ngôi nhà của nó nhé!';
    AppState.lesson.dragMsg = promptMsg;
    SoundEngine.speak(promptMsg);
  }

  function initMatchGame() {
    const age = AppState.config.selectedAge;
    const planet = AppState.activePlanet;
    const count = age === '2yo' ? 2 : 3;
    let pairs = [];

    if (planet === 'numbers') {
      const nums = age === '2yo' ? [1, 3] : [2, 4, 5];
      pairs = nums.slice(0, count).map((n) => ({
        pairId: `p_${n}`,
        left: { key: `l_${n}`, label: `Số ${n}`, kind: 'digit', count: n },
        right: { key: `r_${n}`, label: `${n} ngôi sao`, kind: 'itemGroup', itemType: 'star', count: n },
      }));
    } else if (planet === 'solids') {
      pairs = ['sphere', 'cylinder', 'cube'].slice(0, count).map((sk) => ({
        pairId: `p_${sk}`,
        left: { key: `l_${sk}`, label: SOLIDS_DB[sk].name, kind: 'solid3d', solidType: sk },
        right: { key: `r_${sk}`, label: SOLIDS_DB[sk].realName, kind: 'realSolidObj', realType: SOLIDS_DB[sk].realType },
      }));
    } else if (planet === 'shapes') {
      const shs = (age === '2yo' ? ['circle', 'square'] : ['circle', 'square', 'triangle']).slice(0, count);
      const cols = ['red', 'blue', 'yellow'];
      pairs = shs.map((sh, i) => ({
        pairId: `p_${sh}`,
        left: { key: `l_${sh}`, label: SHAPES_DB[sh].name, kind: 'shape3d', shapeType: sh, colorId: cols[i] },
        right: { key: `r_${sh}`, label: SHAPES_DB[sh].realName, kind: 'realShapeObj', realType: SHAPES_DB[sh].realType },
      }));
    } else {
      const cols = ['red', 'yellow', 'blue'].slice(0, count);
      pairs = cols.map((ck) => ({
        pairId: `p_${ck}`,
        left: { key: `l_${ck}`, label: COLORS_DB[ck].objName, kind: 'coloredObj', colorId: ck, objType: COLORS_DB[ck].objType },
        right: { key: `r_${ck}`, label: COLORS_DB[ck].name, kind: 'coloredObj', colorId: ck, objType: COLORS_DB[ck].objType },
      }));
    }

    AppState.lesson.matchPairs = pairs;
    AppState.lesson.matchRightList = shuffleArray(pairs.map((p) => ({ pairId: p.pairId, opt: p.right })));
    AppState.lesson.matchSelectedLeft = null;
    AppState.lesson.matchSolved = [];
    SoundEngine.speak('Bé hãy tìm hai bạn thân tương ứng với nhau nhé!');
  }

  function initCountStarsGame() {
    const age = AppState.config.selectedAge;
    const n = age === '2yo' ? Math.floor(Math.random() * 3) + 1 : age === '3yo' ? Math.floor(Math.random() * 5) + 1 : Math.floor(Math.random() * 7) + 3;
    const d1 = n === 1 ? 2 : n - 1;
    const d2 = n >= 9 ? 7 : n + 1;
    AppState.lesson.starTargetCount = n;
    AppState.lesson.starCounted = [];
    AppState.lesson.starChoices = shuffleArray([n, d1, d2]);
    AppState.lesson.starAnswered = false;
    SoundEngine.speak('Bé hãy chạm vào từng ngôi sao để cùng đếm nhé!');
  }

      `;
    }

    root.innerHTML = html;
    bindDynamicEvents();
  }

  /**
   * ============================================================================
   * 7. RENDER MÀN HÌNH HỌC & 6 TRÒ CHƠI TƯƠNG TÁC
   * ============================================================================
   */
  function getExploreItems() {
    const age = AppState.config.selectedAge;
    const planet = AppState.activePlanet;
    const ext = AppState.config.enableExtended;

    if (planet === 'colors') {
      const keys =
        age === '2yo'
          ? ['red', 'yellow', 'blue']
          : age === '3yo' && !ext
          ? ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink', 'white', 'black']
          : ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink', 'white', 'black'];
      return keys.map((k) => {
        const c = COLORS_DB[k];
        const title = age === '2yo' && k === 'blue' ? 'Màu xanh' : c.name;
        const objDisplay = age === '2yo' && k === 'blue' ? 'Quả bóng màu xanh' : c.objName;
        return {
          title,
          desc: objDisplay,
          speech: `Đây là ${title.toLowerCase()}. ${objDisplay}!`,
          visual: renderVisualOptionHTML({ kind: 'coloredObj', colorId: k, objType: c.objType }, 175),
        };
      });
    }

    if (planet === 'shapes') {
      const keys = age === '2yo' ? ['circle', 'square'] : ['circle', 'square', 'triangle', 'rectangle'];
      const cols = ['red', 'blue', 'yellow', 'green'];
      return keys.map((k, idx) => {
        const s = SHAPES_DB[k];
        return {
          title: s.name,
          desc: `${s.desc} (${s.realName})`,
          speech: `Đây là ${s.name.toLowerCase()}. ${s.desc}`,
          visual: renderVisualOptionHTML({ kind: 'shape3d', shapeType: k, colorId: cols[idx % 4] }, 175),
        };
      });
    }

    if (planet === 'numbers') {
      if (age === '2yo' && !ext) {
        return [
          {
            title: 'Số lượng: Một ngôi sao',
            desc: 'Chỉ có đúng 1 ngôi sao đứng một mình.',
            speech: 'Đây là một ngôi sao. Chỉ có một ngôi sao thôi nhé!',
            visual: renderVisualOptionHTML({ kind: 'itemGroup', itemType: 'star', count: 1 }, 165),
          },
          {
            title: 'Số lượng: Nhiều ngôi sao',
            desc: 'Có rất nhiều ngôi sao ở cạnh nhau.',
            speech: 'Còn đây là nhiều ngôi sao. Có rất nhiều ngôi sao cùng nhau!',
            visual: renderVisualOptionHTML({ kind: 'itemGroup', itemType: 'star', count: 5 }, 165),
          },
        ];
      }
      const maxNum = age === '2yo' ? 3 : age === '3yo' && !ext ? 5 : 10;
      return Array.from({ length: maxNum }, (_, i) => {
        const n = i + 1;
        return {
          title: `Số ${n}`,
          desc: `Có tất cả ${n} ngôi sao ngân hà.`,
          speech: `Đây là số ${n}. Có ${n} ngôi sao lấp lánh!`,
          visual: `
            <div class="flex flex-col sm:flex-row items-center gap-6">
              ${renderVisualOptionHTML({ kind: 'digit', count: n }, 110)}
              ${renderVisualOptionHTML({ kind: 'itemGroup', itemType: 'star', count: n }, 160)}
            </div>
          `,
        };
      });
    }

    return Object.values(SOLIDS_DB).map((s) => ({
      title: s.name,
      desc: `${s.desc} (${s.realName}).`,
      speech: `Đây là ${s.name.toLowerCase()}. ${s.desc} ${s.realName}.`,
      visual: `
        <div class="flex flex-col sm:flex-row items-center gap-6">
          <div id="solid3dTouchBox" class="flex flex-col items-center cursor-grab active:cursor-grabbing touch-none">
            ${renderVisualOptionHTML({ kind: 'solid3d', solidType: s.id }, 165, AppState.lesson.solidRotY, AppState.lesson.solidRotX)}
            <span class="text-xs font-extrabold text-[#6C6AA7] mt-1">👆 Chạm và kéo để xoay khối</span>
          </div>
          <div class="flex flex-col items-center bg-[#F8F4EC] p-4 rounded-2xl border border-slate-200">
            ${renderVisualOptionHTML({ kind: 'realSolidObj', realType: s.realType }, 110)}
            <span class="text-sm font-black text-[#202E59] mt-1">${s.realName}</span>
          </div>
        </div>
      `,
    }));
  }

  function renderLessonScreen() {
    const mode = AppState.activeMode;
    let bodyHTML = '';

    // 1. CHẾ ĐỘ KHÁM PHÁ
    if (mode === 'explore') {
      const items = getExploreItems();
      const idx = Math.min(AppState.lesson.exploreIdx, items.length - 1);
      const cur = items[idx];
      bodyHTML = `
        <div class="flex-1 flex flex-col items-center justify-center animate-pop">
          <div class="max-w-3xl w-full bg-white rounded-3xl p-6 sm:p-10 shadow-lg border-2 border-slate-200 flex flex-col items-center text-center">
            <div class="w-full flex items-center justify-between mb-4">
              <span class="px-4 py-1.5 rounded-full bg-[#A8D6E8]/40 text-[#202E59] font-extrabold text-sm sm:text-base">
                Thẻ ${idx + 1} / ${items.length}
              </span>
              <button data-action="speakGuide" data-text="${cur.speech}" class="min-h-[64px] px-5 rounded-2xl bg-[#F8D375] text-[#202E59] font-extrabold text-base sm:text-lg shadow-sm active:scale-95">
                🔊 Nghe lại
              </button>
            </div>
            <div class="min-h-[210px] flex items-center justify-center my-4">${cur.visual}</div>
            <h3 class="text-3xl sm:text-4xl font-black text-[#202E59] mb-2">${cur.title}</h3>
            <p class="text-base sm:text-xl font-bold text-slate-600 max-w-xl mb-8">${cur.desc}</p>
            <div class="w-full flex flex-wrap items-center justify-between gap-3">
              <button data-action="explorePrev" class="min-h-[72px] px-6 rounded-2xl bg-slate-100 hover:bg-slate-200 font-extrabold text-lg active:scale-95">
                ⬅ Trước
              </button>
              ${
                idx < items.length - 1
                  ? `<button data-action="exploreNext" class="min-h-[72px] px-8 rounded-2xl bg-[#202E59] text-white font-extrabold text-xl shadow active:scale-95">Tiếp theo ➜</button>`
                  : `<button data-action="switchMode" data-mode="practice" class="min-h-[72px] px-8 rounded-2xl bg-[#388E3C] text-white font-extrabold text-xl shadow active:scale-95">⭐ Sang Thực hành</button>`
              }
            </div>
          </div>
        </div>
      `;
    }

    // 2. CHẾ ĐỘ THỰC HÀNH (HOẶC GAME 1 & GAME 6)
    else if (
      mode === 'practice' ||
      (mode === 'play' && (AppState.activeGame === 'tap' || AppState.activeGame === 'challenge'))
    ) {
      const list = AppState.lesson.sessionList;
      const qIdx = AppState.lesson.qIdx;
      const q = list[qIdx];

      if (!q) {
        bodyHTML = `<div class="bg-white rounded-3xl p-8 text-center font-bold">Chưa có câu hỏi cho chủ đề này.</div>`;
      } else {
        const dots = list
          .map(
            (_, i) =>
              `<div class="h-3.5 rounded-full transition-all ${
                i < qIdx ? 'w-8 bg-[#388E3C]' : i === qIdx ? 'w-10 bg-[#F4C430]' : 'w-6 bg-slate-200'
              }"></div>`
          )
          .join('');

        const optsHTML = AppState.lesson.shuffledOptions
          .map((opt) => {
            const isTarget = opt.key === q.targetKey;
            const isWrong = AppState.lesson.selectedKey === opt.key && !isTarget;
            const isRight = AppState.lesson.isSolved && isTarget;
            const cls = isRight
              ? 'bg-emerald-50 border-[#388E3C] scale-105 shadow-lg'
              : isWrong
              ? 'bg-amber-50 border-amber-400 opacity-85'
              : AppState.lesson.showHintGlow && isTarget
              ? 'bg-white border-[#F4C430] animate-hint'
              : 'bg-white border-slate-200 hover:border-[#6C6AA7]';

            return `
              <button data-action="chooseOption" data-key="${opt.key}"
                      class="card-3d min-h-[180px] p-5 rounded-3xl border-4 flex flex-col items-center justify-center gap-3 ${cls}">
                ${renderVisualOptionHTML(opt, 112)}
                <span class="text-xl sm:text-2xl font-black text-[#202E59]">${opt.label}</span>
              </button>
            `;
          })
          .join('');

        bodyHTML = `
          <div class="flex-1 flex flex-col justify-center max-w-4xl w-full mx-auto animate-pop">
            <div class="bg-white rounded-3xl p-5 sm:p-8 shadow-lg border-2 border-slate-200">
              <div class="flex items-center justify-between gap-4 mb-5">
                <div class="flex items-center gap-2">${dots}</div>
                <span class="font-extrabold text-slate-600 text-base sm:text-lg">Câu ${qIdx + 1} / ${list.length}</span>
              </div>

              <div class="bg-[#F8F4EC] rounded-2xl p-4 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
                <div class="flex items-center gap-4">
                  ${renderBeSaoSVG(AppState.lesson.isSolved ? 'happy' : 'guide', 76)}
                  <h3 class="text-xl sm:text-3xl font-black text-[#202E59]">${q.promptText}</h3>
                </div>
                <button data-action="speakGuide" data-text="${q.promptText}" class="min-h-[64px] px-5 rounded-2xl bg-[#F8D375] text-[#202E59] font-extrabold text-lg shrink-0 active:scale-95">
                  🔊 Nghe lại
                </button>
              </div>

              <div class="grid grid-cols-1 ${AppState.lesson.shuffledOptions.length === 2 ? 'sm:grid-cols-2' : 'sm:grid-cols-2 md:grid-cols-3'} gap-5 mb-6">
                ${optsHTML}
              </div>

              <div class="min-h-[76px] flex flex-col sm:flex-row items-center justify-between gap-4">
                ${
                  AppState.lesson.feedback
                    ? `<div class="px-5 py-3 rounded-2xl font-extrabold text-lg sm:text-xl ${
                        AppState.lesson.isSolved ? 'bg-emerald-100 text-emerald-900' : 'bg-amber-100 text-amber-900'
                      }">${AppState.lesson.feedback}</div>`
                    : `<div class="text-slate-500 font-bold text-base">Bé hãy chạm vào đáp án đúng nhé!</div>`
                }
                ${
                  AppState.lesson.isSolved
                    ? `<button data-action="nextQuestion" class="btn-3d min-h-[72px] px-8 rounded-2xl bg-[#388E3C] text-white font-black text-xl">${
                        qIdx < list.length - 1 ? 'Câu tiếp theo ➜' : '🎉 Hoàn thành'
                      }</button>`
                    : ''
                }
              </div>
            </div>
          </div>
        `;
      }
    }

    // 3. CHẾ ĐỘ VUI CHƠI (GAME 2, 3, 4, 5)
    if (mode === 'play') {
      const gamesMenu = [
        { id: 'tap', title: '1. Chạm đúng nào!' },
        { id: 'drag', title: '2. Kéo thả thông minh' },
        { id: 'match', title: '3. Tìm đôi bạn thân' },
        { id: 'countStars', title: '4. Đếm sao ngân hà' },
        { id: 'sort', title: '5. Phân loại tài giỏi' },
        { id: 'challenge', title: '6. Thử thách phi hành gia' },

      const tabsHTML = gamesMenu
        .map(
          (g) => `
          <button data-action="selectGame" data-game="${g.id}"
                  class="min-h-[64px] p-3 rounded-2xl border-2 text-left font-black text-sm sm:text-base transition active:scale-95 ${
                    AppState.activeGame === g.id
                      ? 'bg-[#202E59] text-white border-[#202E59] shadow-md'
                      : 'bg-white text-[#202E59] border-slate-200 hover:border-[#6C6AA7]'
                  }">
            ${g.title}
          </button>
        `
        )
        .join('');

      let gameContentHTML = bodyHTML;

      // GAME 2: KÉO THẢ THÔNG MINH (BỎ VÀO CHIẾC GIỎ HOẶC ĐƯA VỀ NGÔI NHÀ)
      if (AppState.activeGame === 'drag' && AppState.lesson.dragSampleQ) {
        const q = AppState.lesson.dragSampleQ;
        const targets = q.options;
        const isBasket = q.containerType === 'basket';

        const sourcesHTML = AppState.lesson.dragSources
          .map((item) => {
            const done = AppState.lesson.dragMatched.includes(item.key);
            const picked = AppState.lesson.dragSelectedSource === item.key;
            return `
              <div draggable="${!done}" data-drag-key="${item.key}" data-action="pickDragSource" data-key="${item.key}"
                   class="min-h-[140px] p-4 rounded-3xl border-4 flex flex-col items-center justify-center cursor-pointer transition ${
                     done
                       ? 'opacity-25 border-slate-200 bg-slate-50 cursor-default'
                       : picked
                       ? 'border-[#F4C430] bg-amber-50 scale-105 shadow-md'
                       : 'border-[#6C6AA7] bg-white hover:shadow-md'
                   }">
                ${renderVisualOptionHTML(item, 86)}
                <span class="font-extrabold text-base mt-1 text-center">${item.label}</span>
              </div>
            `;
          })
          .join('');

        const targetsHTML = targets
          .map((t) => {
            const done = AppState.lesson.dragMatched.includes(t.key);
            const containerSVG = isBasket
              ? renderBasketContainerSVG(t.colorId || 'red', t.shapeType || t.solidType, 118)
              : renderHouseContainerSVG(t, 120);
            const containerLabel = isBasket ? `Giỏ ${t.label.toLowerCase()}` : `Nhà ${t.label.toLowerCase()}`;

            return `
              <div data-drop-key="${t.key}" data-action="dropOnTarget" data-key="${t.key}"
                   class="min-h-[175px] p-4 rounded-3xl border-4 border-dashed flex flex-col items-center justify-center transition ${
                     done
                       ? 'border-[#388E3C] bg-emerald-50 border-solid'
                       : AppState.lesson.dragSelectedSource
                       ? 'border-[#1976D2] bg-sky-50 cursor-pointer'
                       : 'border-slate-300 bg-[#F8F4EC]'
                   }">
                ${containerSVG}

              </div>

          <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200 max-w-4xl w-full mx-auto animate-pop">

              <div class="flex items-center gap-3">
                ${renderBeSaoSVG('guide', 72)}
                <p class="text-lg sm:text-2xl font-black text-[#202E59]">${AppState.lesson.dragMsg}</p>
              </div>
              <button data-action="speakGuide" data-text="${AppState.lesson.dragMsg}" class="min-h-[60px] px-4 rounded-2xl bg-[#F8D375] font-bold shrink-0">🔊</button>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-7">${sourcesHTML}</div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">${targetsHTML}</div>
          </div>
        `;
      }

      // GAME 3: TÌM ĐÔI BẠN THÂN
      if (AppState.activeGame === 'match') {
        const leftHTML = AppState.lesson.matchPairs
          .map((p) => {
            const done = AppState.lesson.matchSolved.includes(p.pairId);
            const picked = AppState.lesson.matchSelectedLeft === p.pairId;
            return `
              <button ${done ? 'disabled' : ''} data-action="pickMatchLeft" data-pair="${p.pairId}" data-label="${p.left.label}"
                      class="w-full min-h-[135px] p-4 rounded-3xl border-4 flex flex-col items-center justify-center transition ${
                        done
                          ? 'bg-emerald-50 border-[#388E3C] opacity-60'
                          : picked
                          ? 'bg-amber-50 border-[#F4C430] scale-105 shadow-md'
                          : 'bg-white border-slate-200 hover:border-[#6C6AA7]'
                      }">
                ${renderVisualOptionHTML(p.left, 82)}
                <span class="font-extrabold text-base mt-1">${p.left.label}</span>
              </button>
            `;
          })
          .join('');

        const rightHTML = AppState.lesson.matchRightList
          .map((item) => {
            const done = AppState.lesson.matchSolved.includes(item.pairId);
            return `
              <button ${done ? 'disabled' : ''} data-action="pickMatchRight" data-pair="${item.pairId}" data-label="${item.opt.label}"
                      class="w-full min-h-[135px] p-4 rounded-3xl border-4 flex flex-col items-center justify-center transition ${
                        done
                          ? 'bg-emerald-50 border-[#388E3C] opacity-60'
                          : AppState.lesson.matchSelectedLeft
                          ? 'bg-sky-50 border-[#1976D2] hover:scale-105'
                          : 'bg-white border-slate-200'
                      }">
                ${renderVisualOptionHTML(item.opt, 82)}
                <span class="font-extrabold text-base mt-1">${item.opt.label}</span>
              </button>

          })
          .join('');

        gameContentHTML = `
          <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200 max-w-4xl w-full mx-auto animate-pop">

              <h3 class="text-xl sm:text-2xl font-black text-[#202E59]">Chạm thẻ bên trái rồi chạm thẻ tương ứng bên phải nhé!</h3>
              <button data-action="speakGuide" data-text="Chạm thẻ bên trái rồi chạm thẻ tương ứng bên phải nhé!" class="min-h-[60px] px-4 rounded-2xl bg-[#F8D375] font-bold shrink-0">🔊</button>

      // GAME 4: ĐẾM SAO NGÂN HÀ
      if (AppState.activeGame === 'countStars') {
        const n = AppState.lesson.starTargetCount;
        const counted = AppState.lesson.starCounted;
        const starsHTML = Array.from({ length: n }, (_, idx) => {
          const order = counted.indexOf(idx);
          const isCounted = order !== -1;
          return `
            <button data-action="tapStar" data-idx="${idx}"
                    class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex items-center justify-center transition transform active:scale-90 ${
                      isCounted ? 'bg-white/25 scale-105 ring-4 ring-[#F8D375]' : 'bg-white/10 hover:bg-white/20'
                    }">
              ${renderSingleIconSVG('star', isCounted ? 'yellow' : 'white', 64, `gs_${idx}`)}

                isCounted
                  ? `<span class="absolute -top-2 -right-2 w-8 h-8 rounded-full bg-[#388E3C] text-white font-black text-base flex items-center justify-center shadow">${order + 1}</span>`
                  : ''
              }
            </button>

        }).join('');

        const choicesHTML = AppState.lesson.starChoices
          .map(
            (num) => `
            <button data-action="chooseStarCount" data-num="${num}"
                    class="min-h-[96px] rounded-3xl border-4 font-black text-4xl flex items-center justify-center transition active:scale-95 ${
                      AppState.lesson.starAnswered && num === n
                        ? 'bg-emerald-100 border-[#388E3C] text-emerald-900'
                        : 'bg-[#F8F4EC] border-slate-200 hover:border-[#202E59] text-[#202E59]'
                    }">
              ${num}
            </button>
          `
          )
          .join('');

        gameContentHTML = `
          <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200 max-w-4xl w-full mx-auto text-center animate-pop">

                Đã đếm: ${counted.length} ngôi sao

              <button data-action="speakGuide" data-text="Bé hãy chạm vào từng ngôi sao để cùng đếm nhé!" class="min-h-[60px] px-4 rounded-2xl bg-[#F8D375] font-bold">🔊 Nghe lại</button>
            </div>
            <div class="galaxy-bg rounded-3xl p-6 sm:p-8 min-h-[200px] flex flex-wrap items-center justify-center gap-5 mb-6">
              ${starsHTML}
            </div>
            <p class="text-xl font-black text-[#202E59] mb-4">Có tất cả bao nhiêu ngôi sao? Bé chọn số đúng bên dưới nào!</p>
            <div class="grid grid-cols-3 gap-4 max-w-xl mx-auto">${choicesHTML}</div>
          </div>
        `;
      }

      // GAME 5: PHÂN LOẠI TÀI GIỎI (BỎ VÀO CHIẾC GIỎ HOẶC NGÔI NHÀ)
      if (AppState.activeGame === 'sort') {
        const remaining = AppState.lesson.sortItems.filter((i) => !AppState.lesson.sortSortedIds.includes(i.key));
        const activeItem = remaining.find((i) => i.key === AppState.lesson.sortActiveKey) || remaining[0];

        const itemsHTML = remaining
          .map((item) => {
            const isCur = activeItem && activeItem.key === item.key;
            return `
              <button data-action="pickSortItem" data-key="${item.key}" data-label="${item.label}"
                      class="p-4 rounded-3xl border-4 transition ${
                        isCur ? 'border-[#202E59] bg-amber-50 scale-110 shadow-md' : 'border-slate-200 opacity-75'
                      }">
                ${renderVisualOptionHTML(item, 76)}
                <div class="text-xs font-extrabold mt-1">${item.label}</div>
              </button>
            `;
          })
          .join('');

        const basketsHTML = AppState.lesson.sortBaskets
          .map((b) => {
            const cnt = AppState.lesson.sortItems.filter(
              (i) => AppState.lesson.sortSortedIds.includes(i.key) && i.groupId === b.id
            ).length;
            const cHex = COLORS_DB[b.colorId]?.hex || '#E53935';
            const containerSVG =
              b.containerType === 'house'
                ? renderHouseContainerSVG({ colorId: b.colorId, shapeType: b.shapeType }, 118)
                : renderBasketContainerSVG(b.colorId, b.badgeShape, 118);

            return `
              <button data-action="dropSortBasket" data-basket="${b.id}" style="border-color: ${cHex};"
                      class="min-h-[180px] p-5 rounded-3xl border-4 bg-[#F8F4EC] hover:bg-white flex flex-col items-center justify-center gap-1 transition active:scale-95 shadow-sm relative">
                <span style="background-color: ${cHex};" class="absolute top-3 right-3 w-9 h-9 rounded-full text-white font-black text-lg flex items-center justify-center shadow">
                  ${cnt}
                </span>
                ${containerSVG}
                <span class="text-xl font-black text-[#202E59]">${b.label}</span>
              </button>
            `;
          })
          .join('');

        gameContentHTML = `
          <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-lg border-2 border-slate-200 max-w-4xl w-full mx-auto text-center animate-pop">
            <h3 class="text-xl sm:text-2xl font-black text-[#202E59] mb-4">

  /**
   * ============================================================================
   * 9. XỬ LÝ SỰ KIỆN TƯƠNG TÁC (CHUỘT, CẢM ỨNG, KÉO THẢ, XOAY KHỐI 3D)
   * ============================================================================
   */
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-action');
    SoundEngine.playSFX('tap');

    if (action === 'toggleSound') {
      AppState.config.soundEnabled = !AppState.config.soundEnabled;
      if (!AppState.config.soundEnabled) SoundEngine.stopAllSpeech();
      saveConfig();
      renderApp();
    } else if (action === 'goWelcome') {
      SoundEngine.stopAllSpeech();
      AppState.screen = 'welcome';
      renderApp();
    } else if (action === 'goAgeSelect') {
      AppState.screen = 'ageSelect';
      SoundEngine.speak('Chào bé yêu! Mình cùng chọn độ tuổi để bắt đầu chuyến du hành nhé!');
      renderApp();
    } else if (action === 'selectAge') {
      AppState.config.selectedAge = btn.getAttribute('data-age');
      saveConfig();
      AppState.screen = 'map';
      SoundEngine.speak(`Chào mừng bé đến với chương trình ${AGE_META[AppState.config.selectedAge].title}! Hãy chọn một hành tinh để khám phá nào!`);
      renderApp();
    } else if (action === 'goMap') {
      clearHintTimer();
      SoundEngine.stopAllSpeech();
      AppState.screen = 'map';
      renderApp();
    } else if (action === 'speakGuide') {
      SoundEngine.speak(btn.getAttribute('data-text'));
    } else if (action === 'enterPlanet') {
      AppState.activePlanet = btn.getAttribute('data-planet');
      AppState.activeMode = btn.getAttribute('data-mode');
      AppState.screen = 'lesson';
      AppState.lesson.exploreIdx = 0;
      if (AppState.activeMode === 'explore') {
        const items = getExploreItems();
        if (items[0]) SoundEngine.speak(items[0].speech);
      } else if (AppState.activeMode === 'practice') {
        initPracticeSession();
      } else if (AppState.activeMode === 'play') {
        AppState.activeGame = 'tap';
        initPracticeSession(4);
      }
      renderApp();
    } else if (action === 'switchMode') {
      clearHintTimer();
      AppState.activeMode = btn.getAttribute('data-mode');
      AppState.lesson.exploreIdx = 0;
      if (AppState.activeMode === 'explore') {
        const items = getExploreItems();
        if (items[0]) SoundEngine.speak(items[0].speech);
      } else if (AppState.activeMode === 'practice') {
        initPracticeSession();
      } else if (AppState.activeMode === 'play') {
        AppState.activeGame = 'tap';
        initPracticeSession(4);
      }
      renderApp();
    } else if (action === 'explorePrev') {
      const items = getExploreItems();
      AppState.lesson.exploreIdx = (AppState.lesson.exploreIdx - 1 + items.length) % items.length;
      SoundEngine.speak(items[AppState.lesson.exploreIdx].speech);
      renderApp();
    } else if (action === 'exploreNext') {
      const items = getExploreItems();
      AppState.lesson.exploreIdx = (AppState.lesson.exploreIdx + 1) % items.length;
      SoundEngine.speak(items[AppState.lesson.exploreIdx].speech);
      renderApp();
    } else if (action === 'chooseOption') {
      if (AppState.lesson.isSolved) return;
      const key = btn.getAttribute('data-key');
      const q = AppState.lesson.sessionList[AppState.lesson.qIdx];
      if (!q) return;
      AppState.lesson.selectedKey = key;

      if (key === q.targetKey) {
        clearHintTimer();
        AppState.lesson.isSolved = true;
        const chosen = q.options.find((o) => o.key === key);
        const praises = ['Giỏi lắm!', 'Bé làm tốt rồi!', 'Tuyệt vời!', 'Hoan hô phi hành gia nhí!'];
        const praise = praises[Math.floor(Math.random() * praises.length)];
        AppState.lesson.feedback = `🌟 ${praise}`;
        SoundEngine.playSFX('correct');
        SoundEngine.speak(`${praise} Đúng là ${chosen ? chosen.label.toLowerCase() : ''} rồi!`);
        recordAttempt(true, AppState.lesson.showHintGlow);
        AppState.lesson.showHintGlow = false;
      } else {
        const encs = ['Con thử lại nhé!', 'Mình cùng nhìn kỹ nào!', 'Bé hãy nghe lại câu hỏi nhé!'];
        const enc = encs[Math.floor(Math.random() * encs.length)];
        AppState.lesson.feedback = `💛 ${enc}`;
        SoundEngine.playSFX('retry');
        SoundEngine.speak(`${enc} ${q.hintText}`);
        recordAttempt(false, false);
      }
      renderApp();
    } else if (action === 'nextQuestion') {
      if (AppState.lesson.qIdx < AppState.lesson.sessionList.length - 1) {
        AppState.lesson.qIdx += 1;
        loadCurrentQuestion();
        renderApp();
      } else {
        AppState.stats.sessionsCompleted += 1;
        saveStats();
        AppState.screen = 'complete';
        SoundEngine.playSFX('complete');
        SoundEngine.speak('Tuyệt vời! Bé đã hoàn thành chuyến du hành ngân hà rồi!');
        renderApp();
      }
    } else if (action === 'replayLesson') {
      AppState.screen = 'lesson';
      if (AppState.activeMode === 'practice') initPracticeSession();
      else if (AppState.activeMode === 'play') {
        if (AppState.activeGame === 'drag') initDragGame();
        else if (AppState.activeGame === 'match') initMatchGame();
        else if (AppState.activeGame === 'countStars') initCountStarsGame();
        else if (AppState.activeGame === 'sort') initSortGame();
        else initPracticeSession();
      }
      renderApp();
    } else if (action === 'selectGame') {
      clearHintTimer();
      AppState.activeGame = btn.getAttribute('data-game');
      if (AppState.activeGame === 'tap') initPracticeSession(4);
      else if (AppState.activeGame === 'challenge') initPracticeSession(AppState.config.questionsPerSession);
      else if (AppState.activeGame === 'drag') initDragGame();
      else if (AppState.activeGame === 'match') initMatchGame();
      else if (AppState.activeGame === 'countStars') initCountStarsGame();
      else if (AppState.activeGame === 'sort') initSortGame();
      renderApp();
    } else if (action === 'pickDragSource') {
      const k = btn.getAttribute('data-key');
      if (!AppState.lesson.dragMatched.includes(k)) {
        AppState.lesson.dragSelectedSource = k;
        const item = AppState.lesson.dragSources.find((i) => i.key === k);
        if (item) SoundEngine.speak(item.label);
        renderApp();
      }
    } else if (action === 'dropOnTarget') {
      const targetKey = btn.getAttribute('data-key');
      const sourceKey = AppState.lesson.dragSelectedSource;
      if (!sourceKey || AppState.lesson.dragMatched.includes(targetKey)) return;
      handleDragMatch(sourceKey, targetKey);
    } else if (action === 'pickMatchLeft') {
      AppState.lesson.matchSelectedLeft = btn.getAttribute('data-pair');
      SoundEngine.speak(btn.getAttribute('data-label'));
      renderApp();
    } else if (action === 'pickMatchRight') {
      const rightPair = btn.getAttribute('data-pair');
      const leftPair = AppState.lesson.matchSelectedLeft;
      if (!leftPair) return;
      if (leftPair === rightPair) {
        AppState.lesson.matchSolved.push(rightPair);
        AppState.lesson.matchSelectedLeft = null;
        SoundEngine.playSFX('correct');
        SoundEngine.speak(`Đúng rồi! ${btn.getAttribute('data-label')}!`);
        recordAttempt(true);
        if (AppState.lesson.matchSolved.length === AppState.lesson.matchPairs.length) {
          setTimeout(() => {
            AppState.stats.sessionsCompleted += 1;
            saveStats();
            AppState.screen = 'complete';
            SoundEngine.playSFX('complete');
            renderApp();
          }, 1100);
        }
      } else {
        SoundEngine.playSFX('retry');
        SoundEngine.speak('Con thử lại nhé! Hai bạn này chưa phải một đôi rồi!');
        recordAttempt(false);
      }
      renderApp();
    } else if (action === 'tapStar') {
      const idx = Number(btn.getAttribute('data-idx'));
      if (AppState.lesson.starCounted.includes(idx)) {
        SoundEngine.speak(`Ngôi sao này đếm rồi, hiện có ${AppState.lesson.starCounted.length} ngôi sao.`);
        return;
      }
      AppState.lesson.starCounted.push(idx);
      const cnt = AppState.lesson.starCounted.length;
      if (cnt === AppState.lesson.starTargetCount) {
        SoundEngine.speak(`${cnt}! Có tất cả ${cnt} ngôi sao! Giờ bé chọn số ${cnt} bên dưới nhé!`);
      } else {
        SoundEngine.speak(`${cnt}`);
      }
      renderApp();
    } else if (action === 'chooseStarCount') {
      if (AppState.lesson.starAnswered) return;
      const num = Number(btn.getAttribute('data-num'));
      const target = AppState.lesson.starTargetCount;
      if (num === target) {
        AppState.lesson.starAnswered = true;
        SoundEngine.playSFX('correct');
        SoundEngine.speak(`Giỏi lắm! Đúng là số ${target} rồi!`);
        recordAttempt(true);
        renderApp();
        setTimeout(() => {
          AppState.stats.sessionsCompleted += 1;
          saveStats();
          AppState.screen = 'complete';
          SoundEngine.playSFX('complete');
          renderApp();
        }, 1200);
      } else {
        SoundEngine.playSFX('retry');
        SoundEngine.speak(`Con thử lại nhé! Mình vừa đếm được ${AppState.lesson.starCounted.length || target} ngôi sao đấy!`);
        recordAttempt(false);
      }
    } else if (action === 'pickSortItem') {
      AppState.lesson.sortActiveKey = btn.getAttribute('data-key');
      SoundEngine.speak(btn.getAttribute('data-label'));
      renderApp();
    } else if (action === 'dropSortBasket') {
      const basketId = btn.getAttribute('data-basket');
      const remaining = AppState.lesson.sortItems.filter((i) => !AppState.lesson.sortSortedIds.includes(i.key));
      const activeItem = remaining.find((i) => i.key === AppState.lesson.sortActiveKey) || remaining[0];
      if (!activeItem) return;

      if (activeItem.groupId === basketId) {
        AppState.lesson.sortSortedIds.push(activeItem.key);
        AppState.lesson.sortActiveKey = null;
        SoundEngine.playSFX('correct');
        recordAttempt(true);
        if (AppState.lesson.sortSortedIds.length === AppState.lesson.sortItems.length) {
          SoundEngine.speak('Tuyệt vời! Bé đã phân loại đúng tất cả đồ vật rồi!');
          renderApp();
          setTimeout(() => {
            AppState.stats.sessionsCompleted += 1;
            saveStats();
            AppState.screen = 'complete';
            SoundEngine.playSFX('complete');
            renderApp();
          }, 1100);
          return;
        } else {
          SoundEngine.speak('Giỏi lắm! Đúng chỗ rồi!');
        }
      } else {
        SoundEngine.playSFX('retry');
        SoundEngine.speak('Con thử lại nhé! Nhìn kỹ đặc điểm của đồ vật này xem thuộc nhóm nào nào!');
        recordAttempt(false);
      }
      renderApp();
    } else if (action === 'openTeacherGate') {
      SoundEngine.stopAllSpeech();
      AppState.gateNums = [Math.floor(Math.random() * 5) + 3, Math.floor(Math.random() * 4) + 2];
      AppState.gateError = '';
      AppState.showAdultGate = true;
      renderApp();
    } else if (action === 'closeAdultGate') {
      AppState.showAdultGate = false;
      renderApp();
    } else if (action === 'teacherTab') {
      AppState.teacherTab = btn.getAttribute('data-tab');
      renderApp();
    } else if (action === 'cfgAge') {
      AppState.config.selectedAge = btn.getAttribute('data-age');
      saveConfig();
      renderApp();
    } else if (action === 'deleteCustomQ') {
      const id = btn.getAttribute('data-id');
      AppState.questionBank = AppState.questionBank.filter((q) => q.id !== id);
      saveCustomQuestions();
      renderApp();
    } else if (action === 'restoreDefaultBank') {
      AppState.questionBank = createDefaultQuestions();
      saveCustomQuestions();
      AppState.teacherUI.bankNotice = 'Đã khôi phục toàn bộ ngân hàng học liệu chuẩn mặc định.';
      renderApp();
    } else if (action === 'setAiMode') {
      AppState.teacherUI.aiMode = btn.getAttribute('data-mode');
      AppState.teacherUI.aiOutput = '';
      renderApp();
    } else if (action === 'runTeacherAI') {
      generateSmartTeacherContent();
    } else if (action === 'resetStats') {
      AppState.stats = JSON.parse(JSON.stringify(DEFAULT_STATS));
      saveStats();
      renderApp();
    } else if (action === 'testSouthernVoice') {
      SoundEngine.speak('Xin chào quý thầy cô và các bé! Giọng đọc tiếng Việt miền Nam đã sẵn sàng đồng hành cùng các phi hành gia nhí!');
    }
  });

  function handleDragMatch(sourceKey, targetKey) {
    if (sourceKey === targetKey) {
      AppState.lesson.dragMatched.push(targetKey);
      AppState.lesson.dragSelectedSource = null;
      SoundEngine.playSFX('correct');
      recordAttempt(true);
      if (AppState.lesson.dragMatched.length === AppState.lesson.dragSampleQ.options.length) {
        AppState.lesson.dragMsg = '🌟 Tuyệt vời! Bé đã xếp đúng tất cả rồi!';
        SoundEngine.speak('Tuyệt vời! Bé xếp đúng hết rồi!');
        renderApp();
        setTimeout(() => {
          AppState.stats.sessionsCompleted += 1;
          saveStats();
          AppState.screen = 'complete';
          SoundEngine.playSFX('complete');
          renderApp();
        }, 1200);
        return;
      } else {
        AppState.lesson.dragMsg = '🌟 Giỏi lắm! Bé tiếp tục xếp nhé!';
        SoundEngine.speak('Giỏi lắm!');
      }
    } else {
      AppState.lesson.dragMsg = '💛 Con thử lại nhé! Nhìn kỹ xem hai hình có giống nhau không nào!';
      SoundEngine.playSFX('retry');
      SoundEngine.speak('Con thử lại nhé!');
      recordAttempt(false);
    }
    renderApp();
  }

  function generateSmartTeacherContent() {
    const mode = AppState.teacherUI.aiMode;
    const ageLabel = AGE_META[AppState.teacherUI.aiAge]?.title || 'Nhà trẻ 2 tuổi';
    const topic = AppState.teacherUI.aiTopic || 'Nhận biết màu sắc, hình dạng';
    const dur = AppState.teacherUI.aiDuration || '15 phút';

    if (mode === 'plan') {
      AppState.teacherUI.aiOutput =
        `KẾ HOẠCH TỔ CHỨC HOẠT ĐỘNG HỌC TẬP TƯƠNG TÁC\n` +
        `1. Tên hoạt động: Phi hành gia nhí khám phá "${topic}"\n` +
        `2. Đối tượng: ${ageLabel} – Thời lượng: ${dur}\n` +
        `3. Đồ dùng chuẩn bị: Tivi thông minh mở ứng dụng "Bé Khám Phá Ngân Hà", rổ đồ chơi vật thật (bóng, khối gỗ, ngôi sao) tương ứng.\n` +
        `4. Gây hứng thú: Cô và trẻ cùng đóng vai phi hành gia chào đón bạn Bé Sao trên màn hình.\n` +
        `5. Các bước tổ chức:\n` +
        `   - Bước 1 (Khám phá): Trẻ quan sát và chạm nghe tên gọi từng đối tượng trên màn hình.\n` +
        `   - Bước 2 (Thực hành số): Trẻ luân phiên chạm/kéo đồ vật bỏ vào đúng chiếc giỏ hoặc ngôi nhà.\n` +
        `   - Bước 3 (Hành thật): Tắt màn hình, trẻ thao tác xếp đồ vật thật vào rổ màu tương ứng.\n` +
        `6. Gợi ý hỗ trợ trẻ dân tộc Khmer: Sử dụng khẩu lệnh ngắn gọn dưới 5 từ, kết hợp tín hiệu chỉ tay và chơi theo cặp đôi bạn cùng tiến.`;
    } else if (mode === 'questions') {
      AppState.teacherUI.aiOutput =
        `GỢI Ý CÂU HỎI TƯƠNG TÁC CHUẨN SƯ PHẠM (${ageLabel}):\n` +
        `- Câu 1: "Bé hãy chạm vào ngôi sao màu đỏ nhé!" (Mục tiêu: Nhận biết màu đỏ)\n` +
        `- Câu 2: "Bé hãy bỏ quả bóng màu vàng vào chiếc giỏ màu vàng!" (Mục tiêu: Phân loại màu)\n` +
        `- Câu 3: "Đâu là nhóm có một quả táo? Đâu là nhóm có nhiều quả táo?" (Mục tiêu: Số lượng một – nhiều)`;
    } else if (mode === 'personalize') {
      const s = AppState.stats;
      AppState.teacherUI.aiOutput =
        `GỢI Ý ĐIỀU CHỈNH HOẠT ĐỘNG TỪ DỮ LIỆU THỰC TẾ:\n` +
        `- Tổng lượt hoàn thành: ${s.sessionsCompleted} lượt | Tỷ lệ chính xác: ${s.totalAttempts > 0 ? Math.round((s.totalCorrect / s.totalAttempts) * 100) : 0}%.\n` +
        `- Khuyến nghị sư phạm: Duy trì thời lượng tương tác màn hình 5–7 phút/lượt, sau đó củng cố ngay bằng đồ vật thật để khắc sâu biểu tượng cho trẻ.`;
    } else {
      const s = AppState.stats;
      AppState.teacherUI.aiOutput =
        s.sessionsCompleted < 2
          ? 'Chưa đủ dữ liệu nhiều lượt chơi để tổng hợp nhận xét toàn diện. Cô hãy tổ chức thêm 2–3 lượt thực hành cho bé nhé!'
          : `Nhận xét thực hành: Bé tích cực tham gia ${s.sessionsCompleted} lượt khám phá ngân hà, đạt ${s.totalCorrect}/${s.totalAttempts} câu trả lời đúng. Phụ huynh có thể quét mã QR tại cửa lớp để cùng con ôn luyện thêm 10 phút mỗi tối.`;
    }
    renderApp();
  }

  function bindDynamicEvents() {
    // Form xác nhận người lớn
    const gateForm = document.getElementById('adultGateForm');
    if (gateForm) {
      gateForm.onsubmit = (e) => {
        e.preventDefault();
        const val = Number(document.getElementById('adultGateInput').value);
        if (val === AppState.gateNums[0] + AppState.gateNums[1]) {
          AppState.showAdultGate = false;
          AppState.screen = 'teacher';
          renderApp();
        } else {
          AppState.gateError = 'Kết quả chưa đúng, cô thử tính lại nhé!';
          renderApp();
        }
      };
    }

    // Kéo thả chuột HTML5 cho Game 2
    document.querySelectorAll('[data-drag-key]').forEach((el) => {
      el.ondragstart = (e) => {
        e.dataTransfer.setData('text/plain', el.getAttribute('data-drag-key'));
      };
    });
    document.querySelectorAll('[data-drop-key]').forEach((el) => {
      el.ondragover = (e) => e.preventDefault();
      el.ondrop = (e) => {
        e.preventDefault();
        const sourceKey = e.dataTransfer.getData('text/plain');
        const targetKey = el.getAttribute('data-drop-key');
        if (sourceKey && targetKey) handleDragMatch(sourceKey, targetKey);
      };
    });

    // Xoay khối 3D trực tiếp trên thẻ Khám phá (Mẫu giáo 5 tuổi)
    const solidBox = document.getElementById('solid3dTouchBox');
    if (solidBox) {
      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      solidBox.onpointerdown = (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      };
      solidBox.onpointermove = (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        AppState.lesson.solidRotY += dx * 0.9;
        AppState.lesson.solidRotX = Math.max(-45, Math.min(45, AppState.lesson.solidRotX - dy * 0.9));
        renderApp();
      };
      solidBox.onpointerup = () => { dragging = false; };
      solidBox.onpointerleave = () => { dragging = false; };
    }

    // Các input trong Góc giáo viên
    const cfgExt = document.getElementById('cfgExtended');
    if (cfgExt) cfgExt.onchange = (e) => { AppState.config.enableExtended = e.target.checked; saveConfig(); };

    const cfgSolids = document.getElementById('cfgSolidsAll');
    if (cfgSolids) cfgSolids.onchange = (e) => { AppState.config.enableSolidsForAll = e.target.checked; saveConfig(); };

    const cfgCount = document.getElementById('cfgSessionCount');
    if (cfgCount) cfgCount.oninput = (e) => { AppState.config.questionsPerSession = Number(e.target.value); saveConfig(); renderApp(); };

    const cfgSound = document.getElementById('cfgSound');
    if (cfgSound) cfgSound.onchange = (e) => { AppState.config.soundEnabled = e.target.checked; saveConfig(); };

    const cfgTts = document.getElementById('cfgTtsMode');
    if (cfgTts) cfgTts.onchange = (e) => { AppState.config.ttsMode = e.target.value; saveConfig(); };

    const cfgRate = document.getElementById('cfgRate');
    if (cfgRate) cfgRate.oninput = (e) => { AppState.config.speechRate = Number(e.target.value); saveConfig(); renderApp(); };

    const filterAge = document.getElementById('filterBankAge');
    if (filterAge) filterAge.onchange = (e) => { AppState.teacherUI.filterAge = e.target.value; renderApp(); };

    const filterPlanet = document.getElementById('filterBankPlanet');
    if (filterPlanet) filterPlanet.onchange = (e) => { AppState.teacherUI.filterPlanet = e.target.value; renderApp(); };

    const addForm = document.getElementById('addManualQForm');
    if (addForm) {
      addForm.onsubmit = (e) => {
        e.preventDefault();
        const ageGroup = document.getElementById('newQAge').value;
        const objType = document.getElementById('newQObj').value;
        const targetCol = document.getElementById('newQTarget').value;
        const distCol = document.getElementById('newQDistractor').value;
        const promptText = document.getElementById('newQPrompt').value.trim();

        if (!promptText || targetCol === distCol) {
          AppState.teacherUI.bankNotice = 'Vui lòng nhập lời câu hỏi và chọn hai màu khác nhau!';
          renderApp();
          return;
        }
        const objLabel = OBJECT_LABELS[objType] || 'Đồ vật';
        AppState.questionBank.unshift({
          id: `custom_${Date.now()}`,
          ageGroup,
          planet: 'colors',
          objectType: objType,
          containerType: 'basket',
          promptText,
          hintText: `Con tìm đúng ${objLabel.toLowerCase()} ${COLORS_DB[targetCol].shortName} nhé!`,
          targetKey: `col_${targetCol}`,
          isCustom: true,
          options: [
            { key: `col_${targetCol}`, label: `${objLabel} ${COLORS_DB[targetCol].shortName}`, kind: 'coloredObj', colorId: targetCol, objType, groupId: targetCol },
            { key: `col_${distCol}`, label: `${objLabel} ${COLORS_DB[distCol].shortName}`, kind: 'coloredObj', colorId: distCol, objType, groupId: distCol },
          ],
        });
        saveCustomQuestions();
        AppState.teacherUI.bankNotice = '✅ Đã lưu câu hỏi mới với hình ảnh đồ vật chính xác!';
        renderApp();
      };
    }

    const aiAge = document.getElementById('aiAgeSelect');
    if (aiAge) aiAge.onchange = (e) => { AppState.teacherUI.aiAge = e.target.value; };
    const aiTopic = document.getElementById('aiTopicInput');
    if (aiTopic) aiTopic.oninput = (e) => { AppState.teacherUI.aiTopic = e.target.value; };
    const aiDur = document.getElementById('aiDurationInput');
    if (aiDur) aiDur.oninput = (e) => { AppState.teacherUI.aiDuration = e.target.value; };
  }

  window.onload = function () {
    renderApp();
  };
  </script>
</body>
</html>
