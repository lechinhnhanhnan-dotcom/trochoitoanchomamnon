      const SOLIDS_DATA = {
        sphere:   { id: 'sphere',   name: 'Khối cầu',      desc: 'Khối cầu tròn đều mọi phía và lăn được về mọi hướng.', realName: 'Quả bóng tròn', realType: 'ball' },

        cube:     { id: 'cube',     name: 'Khối vuông',    desc: 'Khối vuông có sáu mặt đều là hình vuông bằng nhau.', realName: 'Khối Rubik vuông', realType: 'rubik' },
        cuboid:   { id: 'cuboid',   name: 'Khối chữ nhật', desc: 'Khối chữ nhật có sáu mặt hình chữ nhật, xếp chồng được.', realName: 'Hộp quà chữ nhật', realType: 'giftbox' }
      };

      const AGE_GROUPS = [
        { id: '2yo', title: 'Nhà trẻ 2 tuổi',  subtitle: '24 – 36 tháng tuổi', badge: '24 – 36 tháng', bg: '#E8F5E9', accent: '#2E7D32' },
        { id: '3yo', title: 'Mẫu giáo 3 tuổi', subtitle: '3 – 4 tuổi',         badge: '3 – 4 tuổi',    bg: '#E3F2FD', accent: '#1565C0' },
        { id: '4yo', title: 'Mẫu giáo 4 tuổi', subtitle: '4 – 5 tuổi',         badge: '4 – 5 tuổi',    bg: '#FFF8E1', accent: '#EF6C00' },
        { id: '5yo', title: 'Mẫu giáo 5 tuổi', subtitle: '5 – 6 tuổi',         badge: '5 – 6 tuổi',    bg: '#F3E5F5', accent: '#6A1B9A' }
      ];

      const PLANETS = [
        { id: 'colors',  title: 'Hành tinh Sắc Màu',  subtitle: 'Nhận biết và phân biệt màu sắc', color: '#E53935', ring: '#F8D375' },
        { id: 'shapes',  title: 'Hành tinh Hình Dạng', subtitle: 'Hình tròn, vuông, tam giác, chữ nhật', color: '#1976D2', ring: '#A8D6E8' },
        { id: 'numbers', title: 'Hành tinh Con Số',   subtitle: 'Số lượng, đếm sao và chữ số', color: '#F4C430', ring: '#F5C6D9' },
        { id: 'solids',  title: 'Hành tinh Khối Hình', subtitle: 'Khối cầu, khối trụ, khối vuông, khối chữ nhật', color: '#7B1FA2', ring: '#A8D6E8' }
      ];

      const GAMES_LIST = [
        { id: 'tap',        title: '1. Chạm đúng nào!' },
        { id: 'drag',       title: '2. Kéo thả thông minh' },
        { id: 'match',      title: '3. Tìm đôi bạn thân' },
        { id: 'countStars', title: '4. Đếm sao ngân hà' },
        { id: 'sort',       title: '5. Phân loại tài giỏi' },
        { id: 'challenge',  title: '6. Thử thách ngân hà' }
      ];

      const PRAISES = ['Giỏi lắm!', 'Bé làm tốt rồi!', 'Tuyệt vời!', 'Hoan hô phi hành gia nhí!'];
      const ENCOURAGES = ['Con thử lại nhé!', 'Mình cùng nhìn kỹ nào!', 'Bé hãy nghe lại câu hỏi nhé!'];

      function colorLabelForAge(colorId, age) {
        if (age === '2yo' && colorId === 'blue') return 'Màu xanh';
        return TARGET_COLORS[colorId].name;
      }

      // =========================================================================
      // 2. BỘ MÁY GIỌNG ĐỌC TIẾNG VIỆT MIỀN NAM ĐA TẦNG (CHỜ ĐỌC HẾT CÂU)
      // =========================================================================
      const VoiceEngine = {
        enabled: true,
        rate: 0.9,
        speaking: false,
        currentAudio: null,
        sessionId: 0,
        viVoice: null,

        init() {
          if ('speechSynthesis' in window) {
            const pickVoice = () => {
              const voices = window.speechSynthesis.getVoices();
              if (!voices.length) return;
              this.viVoice =
                voices.find(v => v.lang.toLowerCase().includes('vi') && /linh|hoaimy|southern|nam|female/i.test(v.name)) ||
                voices.find(v => v.lang.toLowerCase().includes('vi-vn')) ||
                voices.find(v => v.lang.toLowerCase().startsWith('vi')) ||
                null;
            };
            pickVoice();
            window.speechSynthesis.onvoiceschanged = pickVoice;
          }
          document.addEventListener('pointerdown', () => {
            if (window.audioCtx && window.audioCtx.state === 'suspended') {
              window.audioCtx.resume().catch(() => {});
            }
          }, { passive: true });
        },

        stop() {
          this.sessionId++;
          this.speaking = false;
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch (e) {}
          }
          if (this.currentAudio) {
            try {
              this.currentAudio.pause();
              this.currentAudio.src = '';
            } catch (e) {}
            this.currentAudio = null;
          }
          if (window.responsiveVoice && window.responsiveVoice.isPlaying()) {
            try { window.responsiveVoice.cancel(); } catch (e) {}
          }
        },

        // Đọc hết toàn bộ câu và gọi onComplete sau khi đọc xong hoàn chỉnh
        speak(text, onComplete) {
          this.stop();
          const done = () => {
            this.speaking = false;
            if (typeof onComplete === 'function') onComplete();
          };
          if (!this.enabled || !text) {
            if (typeof onComplete === 'function') setTimeout(done, 1100);
            return;
          }
          const sid = this.sessionId;
          this.speaking = true;

          // Ước lượng thời gian tối thiểu theo độ dài câu để không bao giờ bị cắt ngang
          const wordsCount = text.trim().split(/\s+/).length;
          const minDurationMs = Math.max(1500, wordsCount * 380);
          const startTime = Date.now();
          let finished = false;
          const finishOnce = () => {
            if (finished || sid !== this.sessionId) return;
            finished = true;
            const elapsed = Date.now() - startTime;
            const waitMore = Math.max(250, minDurationMs - elapsed);
            setTimeout(() => {
              if (sid === this.sessionId) done();
            }, waitMore);
          };

          // Tầng 1: Web Speech API tiếng Việt
          if ('speechSynthesis' in window && this.viVoice) {
            try {
              const utter = new SpeechSynthesisUtterance(text);
              utter.lang = 'vi-VN';
              utter.voice = this.viVoice;
              utter.rate = this.rate;
              utter.pitch = 1.08;
              let started = false;
              utter.onstart = () => { started = true; };
              utter.onend = () => finishOnce();
              utter.onerror = () => {
                if (sid === this.sessionId && !finished) this.playOnlineTTS(text, sid, finishOnce);
              };
              window.speechSynthesis.speak(utter);
              setTimeout(() => {
                if (sid === this.sessionId && !started && !finished) {
                  try { window.speechSynthesis.cancel(); } catch (e) {}
                  this.playOnlineTTS(text, sid, finishOnce);
                }
              }, 650);
              return;
            } catch (e) {}
          }

          // Tầng 2: Google TTS trực tuyến
          this.playOnlineTTS(text, sid, finishOnce);
        },

        playOnlineTTS(text, sid, onDone) {
          if (sid !== this.sessionId) return;
          const chunks = text.match(/[^.!?]+[.!?]*/g) || [text];
          let idx = 0;

          const playNextChunk = () => {
            if (sid !== this.sessionId) return;
            if (idx >= chunks.length) {
              if (onDone) onDone();
              return;
            }
            const part = chunks[idx].trim();
            idx++;
            if (!part) { playNextChunk(); return; }

            const encoded = encodeURIComponent(part);
            const url1 = `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${encoded}&tl=vi&client=gtx`;
            const url2 = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encoded}&tl=vi&client=tw-ob`;

            const audio = new Audio(url1);
            audio.playbackRate = Math.min(1.15, Math.max(0.8, this.rate + 0.05));
            this.currentAudio = audio;

            let triedMirror = false;
            audio.onended = () => playNextChunk();
            audio.onerror = () => {
              if (!triedMirror && sid === this.sessionId) {
                triedMirror = true;
                audio.src = url2;
                audio.play().catch(() => {
                  if (window.responsiveVoice) {
                    window.responsiveVoice.speak(part, 'Vietnamese Female', { rate: this.rate, onend: playNextChunk, onerror: playNextChunk });
                  } else {
                    playNextChunk();
                  }
                });
              } else {
                playNextChunk();
              }
            };

            audio.play().catch(() => {
              if (window.responsiveVoice) {
                window.responsiveVoice.speak(part, 'Vietnamese Female', { rate: this.rate, onend: playNextChunk, onerror: playNextChunk });
              } else {
                playNextChunk();
              }
            });
          };

          playNextChunk();
        }
      };

      // =========================================================================
      // 3. THƯ VIỆN ĐỒ HỌA SVG 3D CHÂN THẬT KHỚP 100% CÂU HỎI & VẬT CHỨA
      // =========================================================================
      function renderBeSao(mood = 'welcome', size = 104) {
        const arms = mood === 'happy'

             <path d="M98 96 Q118 74 112 62" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>`
          : `<path d="M42 98 Q26 108 30 116" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
             <path d="M98 96 Q118 86 122 78" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>`;
        const eyes = mood === 'happy'
          ? `<path d="M58 53 Q62 48 66 53" fill="none" stroke="#202E59" stroke-width="3" stroke-linecap="round"/>
             <path d="M74 53 Q78 48 82 53" fill="none" stroke="#202E59" stroke-width="3" stroke-linecap="round"/>`
          : `<circle cx="62" cy="53" r="3.5" fill="#202E59"/><circle cx="78" cy="53" r="3.5" fill="#202E59"/>
             <circle cx="63" cy="52" r="1.2" fill="#FFF"/><circle cx="79" cy="52" r="1.2" fill="#FFF"/>`;
        const mouth = mood === 'happy'
          ? `<path d="M63 62 Q70 71 77 62 Z" fill="#E53935"/>`

        return `

            <circle cx="70" cy="70" r="62" fill="#F8D375" fill-opacity="0.2"/>

            <polygon points="70,2 73,9 80,9 74,13 76,20 70,16 64,20 66,13 60,9 67,9" fill="#F8D375"/>
            <rect x="42" y="88" width="56" height="36" rx="18" fill="#FFFFFF" stroke="#6C6AA7" stroke-width="3"/>
            <rect x="56" y="96" width="28" height="14" rx="5" fill="#A8D6E8"/>
            <circle cx="63" cy="103" r="3" fill="#E53935"/><circle cx="77" cy="103" r="3" fill="#388E3C"/>
            ${arms}
            <circle cx="70" cy="56" r="36" fill="#FFFFFF" stroke="#6C6AA7" stroke-width="3.5"/>
            <rect x="42" y="34" width="56" height="42" rx="20" fill="#202E59"/>
            <circle cx="70" cy="56" r="22" fill="#FFE0B2"/>
            ${eyes}
            <ellipse cx="56" cy="60" rx="4" ry="2.5" fill="#F5C6D9"/><ellipse cx="84" cy="60" rx="4" ry="2.5" fill="#F5C6D9"/>
            ${mouth}
            <path d="M49 42 Q54 37 62 37" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
          </svg>`;
      }

      function renderObjectSVG(objectType, colorId = 'red', size = 104) {
        const col = TARGET_COLORS[colorId] || TARGET_COLORS.red;
        const fill = col.hex;
        const stroke = col.border || '#1E293B';
        const uid = `${objectType}_${colorId}_${Math.floor(Math.random() * 100000)}`;

        if (objectType === 'star') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 110 110">
              <defs>
                <radialGradient id="sg_${uid}" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
                  <stop offset="40%" stop-color="${fill}"/>
                  <stop offset="100%" stop-color="${fill}"/>
                </radialGradient>
              </defs>
              <ellipse cx="55" cy="98" rx="26" ry="5" fill="#000" opacity="0.12"/>
              <polygon points="55,10 68,38 98,42 76,63 82,93 55,78 28,93 34,63 12,42 42,38"
                fill="url(#sg_${uid})" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/>
              <circle cx="48" cy="52" r="2.5" fill="${colorId === 'black' ? '#FFF' : '#202E59'}"/>
              <circle cx="62" cy="52" r="2.5" fill="${colorId === 'black' ? '#FFF' : '#202E59'}"/>
              <path d="M50 60 Q55 65 60 60" fill="none" stroke="${colorId === 'black' ? '#FFF' : '#202E59'}" stroke-width="2.2" stroke-linecap="round"/>
            </svg>`;
        }

        if (objectType === 'ball') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 110 110">
              <defs>
                <radialGradient id="bg_${uid}" cx="32%" cy="28%" r="68%">
                  <stop offset="0%" stop-color="#FFFFFF" stop-opacity="${colorId === 'white' ? '0.9' : '0.55'}"/>
                  <stop offset="45%" stop-color="${fill}"/>
                  <stop offset="100%" stop-color="${fill}"/>
                </radialGradient>
              </defs>
              <ellipse cx="55" cy="99" rx="30" ry="6" fill="#000" opacity="0.14"/>
              <circle cx="55" cy="54" r="38" fill="url(#bg_${uid})" stroke="${stroke}" stroke-width="2.5"/>
              <path d="M24 38 Q55 58 86 38" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.65"/>
              <path d="M24 70 Q55 50 86 70" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.65"/>
              <ellipse cx="40" cy="34" rx="10" ry="5" transform="rotate(-25 40 34)" fill="#FFFFFF" opacity="0.6"/>
            </svg>`;
        }

        if (objectType === 'apple') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 110 110">
              <ellipse cx="55" cy="99" rx="28" ry="5.5" fill="#000" opacity="0.14"/>
              <path d="M55 26 Q57 12 66 10" fill="none" stroke="#5D4037" stroke-width="4.5" stroke-linecap="round"/>
              <ellipse cx="67" cy="18" rx="11" ry="5.5" transform="rotate(-22 67 18)" fill="#43A047" stroke="#1B5E20" stroke-width="1.5"/>
              <path d="M55 30 C35 20, 18 36, 22 62 C25 84, 42 94, 55 89 C68 94, 85 84, 88 62 C92 36, 75 20, 55 30 Z"
                fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
              <ellipse cx="38" cy="44" rx="7" ry="13" transform="rotate(-18 38 44)" fill="#FFFFFF" opacity="0.4"/>
            </svg>`;
        }

        if (objectType === 'flower') {
          const petals = [0, 60, 120, 180, 240, 300].map(deg =>
            `<circle cx="55" cy="27" r="15" fill="${fill}" stroke="${stroke}" stroke-width="2" transform="rotate(${deg} 55 52)"/>`
          ).join('');
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 110 110">
              <line x1="55" y1="68" x2="55" y2="102" stroke="#2E7D32" stroke-width="5" stroke-linecap="round"/>
              <ellipse cx="67" cy="86" rx="11" ry="5" transform="rotate(-20 67 86)" fill="#43A047"/>
              ${petals}
              <circle cx="55" cy="52" r="14" fill="#F4C430" stroke="#B45309" stroke-width="2"/>
            </svg>`;
        }

        if (objectType === 'car') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 110 110">
              <ellipse cx="55" cy="92" rx="42" ry="6" fill="#000" opacity="0.14"/>
              <path d="M26 54 L36 32 L74 32 L84 54 Z" fill="${fill}" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M38 36 L52 36 L52 52 L30 52 Z" fill="#E0F2FE" stroke="#1E293B" stroke-width="1.5"/>
              <path d="M56 36 L72 36 L80 52 L56 52 Z" fill="#E0F2FE" stroke="#1E293B" stroke-width="1.5"/>
              <rect x="14" y="52" width="82" height="24" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
              <circle cx="32" cy="78" r="11" fill="#1E293B"/><circle cx="32" cy="78" r="5" fill="#CBD5E1"/>
              <circle cx="78" cy="78" r="11" fill="#1E293B"/><circle cx="78" cy="78" r="5" fill="#CBD5E1"/>
            </svg>`;
        }

        if (objectType === 'leaf') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 110 110">
              <path d="M22 86 C22 44, 52 20, 88 20 C88 58, 64 88, 22 86 Z" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
              <path d="M18 92 Q48 62 84 24" fill="none" stroke="#1B5E20" stroke-width="3" stroke-linecap="round"/>
            </svg>`;
        }

        if (objectType === 'orange') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 110 110">
              <ellipse cx="55" cy="98" rx="28" ry="5.5" fill="#000" opacity="0.14"/>
              <circle cx="55" cy="56" r="35" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
              <ellipse cx="64" cy="20" rx="11" ry="5" transform="rotate(-18 64 20)" fill="#388E3C"/>
              <ellipse cx="41" cy="40" rx="8" ry="5" transform="rotate(-25 41 40)" fill="#FFFFFF" opacity="0.45"/>
            </svg>`;
        }

        if (objectType === 'grape') {
          const berries = [
            [42,38],[55,38],[68,38],
            [36,52],[49,52],[62,52],[74,52],
            [43,66],[56,66],[68,66],
            [49,80],[61,80],
            [55,92]
          ].map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="10" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`).join('');
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 110 110">
              <path d="M55 28 L55 14" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
              <ellipse cx="67" cy="20" rx="12" ry="6" fill="#43A047"/>
              ${berries}
            </svg>`;
        }

        if (objectType === 'cloud') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 110 110">
              <path d="M28 76 H82 A18 18 0 0 0 84 40 A24 24 0 0 0 38 34 A20 20 0 0 0 28 76 Z"
                fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"/>
            </svg>`;
        }

        // Các hình phẳng chuẩn hình học
        if (objectType === 'circle') {
          return `<svg width="${size}" height="${size}" viewBox="0 0 110 110"><circle cx="55" cy="55" r="38" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/><ellipse cx="41" cy="39" rx="9" ry="5" transform="rotate(-25 41 39)" fill="#FFF" opacity="0.4"/></svg>`;
        }
        if (objectType === 'square') {
          return `<svg width="${size}" height="${size}" viewBox="0 0 110 110"><rect x="19" y="19" width="72" height="72" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/></svg>`;
        }
        if (objectType === 'triangle') {
          return `<svg width="${size}" height="${size}" viewBox="0 0 110 110"><polygon points="55,15 95,88 15,88" fill="${fill}" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
        }
        if (objectType === 'rectangle') {
          return `<svg width="${size}" height="${size}" viewBox="0 0 110 110"><rect x="11" y="29" width="88" height="52" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/></svg>`;
        }

        return renderObjectSVG('star', colorId, size);
      }

      function renderSolid3DSVG(solidId, size = 110, rotX = 18, rotY = -24) {
        const skew = Math.sin((rotY * Math.PI) / 180) * 14;
        const tilt = Math.sin((rotX * Math.PI) / 180) * 10;

        if (solidId === 'sphere') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 120 120">
              <defs>
                <radialGradient id="sp3d" cx="35%" cy="30%" r="65%">
                  <stop offset="0%" stop-color="#FF8A80"/><stop offset="45%" stop-color="#E53935"/><stop offset="100%" stop-color="#8E0000"/>
                </radialGradient>
              </defs>
              <ellipse cx="60" cy="105" rx="34" ry="7" fill="#000" opacity="0.15"/>
              <circle cx="60" cy="58" r="42" fill="url(#sp3d)"/>
              <ellipse cx="60" cy="58" rx="${Math.max(8, Math.abs(Math.cos((rotY * Math.PI) / 180) * 38))}" ry="42" fill="none" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>
              <ellipse cx="45" cy="40" rx="11" ry="6" transform="rotate(-25 45 40)" fill="#FFF" opacity="0.55"/>
            </svg>`;
        }
        if (solidId === 'cylinder') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 120 120">
              <defs>
                <linearGradient id="cy3d" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#1565C0"/><stop offset="35%" stop-color="#42A5F5"/><stop offset="100%" stop-color="#0D47A1"/>
                </linearGradient>
              </defs>
              <ellipse cx="60" cy="106" rx="34" ry="7" fill="#000" opacity="0.15"/>
              <path d="M 30 32 L 30 90 A 30 ${11 + Math.abs(tilt) * 0.4} 0 0 0 90 90 L 90 32 Z" fill="url(#cy3d)"/>
              <ellipse cx="60" cy="90" rx="30" ry="${11 + Math.abs(tilt) * 0.4}" fill="none" stroke="#BBDEFB" stroke-width="1.5" stroke-dasharray="4 3"/>
              <ellipse cx="60" cy="32" rx="30" ry="${11 + Math.abs(tilt) * 0.4}" fill="#90CAF9" stroke="#0D47A1" stroke-width="2"/>
            </svg>`;
        }
        if (solidId === 'cube') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 120 120">
              <g transform="translate(${skew * 0.25}, 0)">
                <polygon points="32,104 76,104 94,94 50,94" fill="#000" opacity="0.14"/>
                <polygon points="30,38 52,20 96,20 74,38" fill="#FFF176" stroke="#F57F17" stroke-width="2" stroke-linejoin="round"/>
                <rect x="30" y="38" width="44" height="44" fill="#F4C430" stroke="#F57F17" stroke-width="2"/>
                <polygon points="74,38 96,20 96,64 74,82" fill="#FBC02D" stroke="#F57F17" stroke-width="2" stroke-linejoin="round"/>
              </g>
            </svg>`;
        }
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 120 120">
            <g transform="translate(${skew * 0.25}, 0)">
              <polygon points="20,104 82,104 102,92 40,92" fill="#000" opacity="0.14"/>
              <polygon points="20,46 42,30 102,30 80,46" fill="#A5D6A7" stroke="#1B5E20" stroke-width="2" stroke-linejoin="round"/>
              <rect x="20" y="46" width="60" height="38" fill="#43A047" stroke="#1B5E20" stroke-width="2"/>
              <polygon points="80,46 102,30 102,68 80,84" fill="#2E7D32" stroke="#1B5E20" stroke-width="2" stroke-linejoin="round"/>
            </g>
          </svg>`;
      }

      function renderRealObjectSVG(realType, size = 104) {
        if (realType === 'ball') return renderObjectSVG('ball', 'orange', size);
        if (realType === 'can') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 100 100">
              <rect x="30" y="22" width="40" height="58" rx="6" fill="#29B6F6" stroke="#01579B" stroke-width="2.5"/>
              <ellipse cx="50" cy="22" rx="20" ry="6" fill="#E1F5FE" stroke="#01579B" stroke-width="2"/>
              <rect x="30" y="42" width="40" height="16" fill="#F4C430"/>
            </svg>`;
        }
        if (realType === 'rubik') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 100 100">
              <rect x="22" y="22" width="56" height="56" rx="4" fill="#FFF" stroke="#212121" stroke-width="3"/>
              <rect x="25" y="25" width="24" height="24" fill="#E53935"/>
              <rect x="51" y="25" width="24" height="24" fill="#1976D2"/>
              <rect x="25" y="51" width="24" height="24" fill="#F4C430"/>
              <rect x="51" y="51" width="24" height="24" fill="#388E3C"/>
            </svg>`;
        }
        return `
          <svg width="${size}" height="${size}" viewBox="0 0 100 100">
            <rect x="14" y="34" width="72" height="44" rx="4" fill="#AB47BC" stroke="#4A148C" stroke-width="2.5"/>
            <rect x="10" y="26" width="80" height="12" rx="3" fill="#CE93D8" stroke="#4A148C" stroke-width="2"/>
            <rect x="44" y="26" width="12" height="52" fill="#F8D375"/>
          </svg>`;
      }

      function renderContainerSVG(containerType, opt, isDone, size = 128) {
        const col = TARGET_COLORS[opt.colorId || 'red'] || TARGET_COLORS.red;
        const fill = col.hex;
        const stroke = col.border || '#1E293B';

        if (containerType === 'basket') {
          return `
            <svg width="${size}" height="${size}" viewBox="0 0 130 120">
              <path d="M 35 46 Q 65 10 95 46" fill="none" stroke="${stroke}" stroke-width="6" stroke-linecap="round"/>
              <path d="M 22 48 L 108 48 L 96 104 C 95 108 91 110 86 110 L 44 110 C 39 110 35 108 34 104 Z"
                fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"/>
              <rect x="18" y="42" width="94" height="11" rx="5" fill="#F8D375" stroke="${stroke}" stroke-width="2.5"/>
              <line x1="42" y1="53" x2="46" y2="108" stroke="#FFF" stroke-width="2" opacity="0.45"/>
              <line x1="65" y1="53" x2="65" y2="108" stroke="#FFF" stroke-width="2" opacity="0.45"/>
              <line x1="88" y1="53" x2="84" y2="108" stroke="#FFF" stroke-width="2" opacity="0.45"/>
              ${isDone ? `<circle cx="102" cy="24" r="14" fill="#388E3C"/><path d="M96 24 L100 28 L109 19" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>` : ''}
            </svg>`;
        }
        // Ngôi nhà mái màu đồng bộ 100% với màu của đồ vật kéo vào, và khung cửa chứa đúng hình có màu tương ứng
        const doorShape = opt.objectType || opt.shapeId || 'circle';
        let windowShape = `<circle cx="65" cy="80" r="16" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`;
        if (doorShape === 'square' || opt.solidId === 'cube') {
          windowShape = `<rect x="49" y="64" width="32" height="32" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`;
        } else if (doorShape === 'triangle') {
          windowShape = `<polygon points="65,61 83,93 47,93" fill="${fill}" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round"/>`;
        } else if (doorShape === 'rectangle' || opt.solidId === 'cuboid') {
          windowShape = `<rect x="44" y="68" width="42" height="24" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`;
        }

        return `
          <svg width="${size}" height="${size}" viewBox="0 0 130 120">
            <rect x="28" y="52" width="74" height="58" rx="4" fill="#FFFDF9" stroke="${stroke}" stroke-width="3"/>
            <polygon points="16,55 65,14 114,55" fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"/>
            ${windowShape}
            ${isDone ? `<circle cx="104" cy="24" r="14" fill="#388E3C"/><path d="M98 24 L102 28 L111 19" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>` : ''}
          </svg>`;
      }

      function renderOptionVisual(opt, size = 100) {
        if (opt.kind === 'object') {
          return renderObjectSVG(opt.objectType || 'star', opt.colorId || 'red', size);
        }
        if (opt.kind === 'numberGroup') {
          const count = opt.count || 1;
          const cols = count <= 2 ? count : count <= 4 ? 2 : count <= 6 ? 3 : 5;
          const starSize = count > 5 ? 24 : 32;
          let starsHtml = '';
          for (let i = 0; i < count; i++) {
            starsHtml += renderObjectSVG(opt.objectType || 'star', opt.colorId || 'yellow', starSize);
          }
          return `<div class="grid gap-1.5 place-items-center p-2" style="grid-template-columns: repeat(${cols}, minmax(0, 1fr))">${starsHtml}</div>`;
        }
        if (opt.kind === 'digit') {
          return `<div class="w-20 h-20 rounded-2xl bg-[#202E59] text-[#F8D375] flex items-center justify-center text-5xl font-black shadow-inner">${opt.count}</div>`;
        }
        if (opt.kind === 'solid') {
          return renderSolid3DSVG(opt.solidId || 'sphere', size);
        }
        if (opt.kind === 'realObject') {
          return renderRealObjectSVG(opt.realType || 'ball', size);
        }
        return renderObjectSVG('star', 'yellow', size);
      }

      // =========================================================================
      // 4. NGÂN HÀNG HỌC LIỆU NỀN KHỚP TUYỆT ĐỐI CÂU HỎI – HÌNH ẢNH – NHÃN MÀU
      // =========================================================================
      function buildDefaultBank() {
        const bank = [];

        // --- NHÓM A: NHÀ TRẺ 2 TUỔI (24 - 36 THÁNG) ---
        // Nhãn dưới hình ảnh thống nhất chỉ ghi tên màu (VD: "Màu đỏ", "Màu vàng", "Màu xanh")
        const c2Pairs = [
          { ids: ['red', 'blue'], obj: 'star', objName: 'ngôi sao' },
          { ids: ['yellow', 'red'], obj: 'ball', objName: 'quả bóng' },
          { ids: ['blue', 'yellow'], obj: 'apple', objName: 'quả táo' },
          { ids: ['red', 'yellow'], obj: 'flower', objName: 'bông hoa' },
          { ids: ['yellow', 'blue'], obj: 'car', objName: 'chiếc ô tô' },
          { ids: ['blue', 'red'], obj: 'star', objName: 'ngôi sao' },
          { ids: ['red', 'yellow', 'blue'], obj: 'ball', objName: 'quả bóng' },
          { ids: ['yellow', 'red', 'blue'], obj: 'star', objName: 'ngôi sao' },
          { ids: ['blue', 'red', 'yellow'], obj: 'apple', objName: 'quả táo' },
          { ids: ['red', 'blue', 'yellow'], obj: 'flower', objName: 'bông hoa' }
        ];
        c2Pairs.forEach((item, idx) => {
          const targetId = item.ids[0];
          const cLabel = colorLabelForAge(targetId, '2yo').toLowerCase();
          bank.push({
            id: `2yo_c_${idx}`,
            age: '2yo',
            planet: 'colors',
            containerType: 'basket',
            promptText: `Bé hãy tìm ${item.objName} ${cLabel} nhé!`,
            hintText: `Con nhìn xem, đâu là ${item.objName} ${cLabel}?`,
            targetKey: `c_${targetId}`,
            options: item.ids.map(cid => ({
              key: `c_${cid}`,
              label: colorLabelForAge(cid, '2yo'),
              kind: 'object',
              objectType: item.obj,
              colorId: cid,
              groupId: cid
            }))
          });
        });

        // A2. Hình dạng (Hình tròn, Hình vuông)
        const s2Pairs = [
          ['circle', 'square'], ['square', 'circle'], ['circle', 'square'], ['square', 'circle'],
          ['circle', 'square'], ['square', 'circle'], ['circle', 'square'], ['square', 'circle']
        ];
        s2Pairs.forEach((pair, idx) => {
          const t = pair[0];
          const cols = ['red', 'yellow', 'blue'];
          bank.push({
            id: `2yo_s_${idx}`,
            age: '2yo',
            planet: 'shapes',
            containerType: 'house',
            promptText: `Bé tìm ${SHAPES_DATA[t].name.toLowerCase()} nào!`,
            hintText: SHAPES_DATA[t].desc,
            targetKey: `s_${t}`,
            options: [
              { key: `s_${pair[0]}`, label: SHAPES_DATA[pair[0]].name, kind: 'object', objectType: pair[0], colorId: cols[idx % 3], groupId: pair[0] },
              { key: `s_${pair[1]}`, label: SHAPES_DATA[pair[1]].name, kind: 'object', objectType: pair[1], colorId: cols[(idx + 1) % 3], groupId: pair[1] }
            ]
          });
        });

        // A3. Số lượng Một – Nhiều (khớp 100% đồ vật được gọi tên)
        const n2Items = [
          { target: 'one', obj: 'star', objName: 'ngôi sao', color: 'yellow', many: 4, prompt: 'Bé chỉ cho cô giỏ có một ngôi sao!' },
          { target: 'many', obj: 'star', objName: 'ngôi sao', color: 'yellow', many: 5, prompt: 'Đâu là giỏ có nhiều ngôi sao?' },
          { target: 'one', obj: 'apple', objName: 'quả táo', color: 'red', many: 5, prompt: 'Con chọn nhóm có một quả táo nhé!' },
          { target: 'many', obj: 'apple', objName: 'quả táo', color: 'red', many: 4, prompt: 'Bé tìm nhóm có nhiều quả táo nào!' },
          { target: 'one', obj: 'flower', objName: 'bông hoa', color: 'pink', many: 5, prompt: 'Bé tìm giúp Bé Sao một bông hoa!' },
          { target: 'many', obj: 'ball', objName: 'quả bóng', color: 'blue', many: 4, prompt: 'Nhóm nào có nhiều quả bóng vậy bé?' }
        ];
        n2Items.forEach((it, idx) => {
          bank.push({
            id: `2yo_n_${idx}`,
            age: '2yo',
            planet: 'numbers',
            containerType: 'basket',
            promptText: it.prompt,
            hintText: it.target === 'one' ? `Chỉ có đúng một ${it.objName} đứng một mình thôi con!` : `Nhóm nào có rất nhiều ${it.objName} cùng nhau nhỉ?`,
            targetKey: it.target === 'one' ? 'g_one' : 'g_many',
            options: [
              { key: 'g_one', label: 'Một', kind: 'numberGroup', count: 1, objectType: it.obj, colorId: it.color, groupId: 'one' },
              { key: 'g_many', label: 'Nhiều', kind: 'numberGroup', count: it.many, objectType: it.obj, colorId: it.color, groupId: 'many' }
            ]
          });
        });

        [2, 3, 4, 5].forEach((n, idx) => {
          const dist = n === 2 ? 4 : n - 1;
          bank.push({
            id: `2yo_next_${idx}`,
            age: '2yo',
            planet: 'numbers',
            containerType: 'basket',
            isExtended: true,
            promptText: `Bé tìm nhóm có ${n} ngôi sao nhé!`,
            hintText: `Mình cùng chỉ tay đếm từng ngôi sao đến ${n} nào!`,
            targetKey: `cnt_${n}`,
            options: [
              { key: `cnt_${n}`, label: `${n} ngôi sao`, kind: 'numberGroup', count: n, objectType: 'star', colorId: 'yellow' },
              { key: `cnt_${dist}`, label: `${dist} ngôi sao`, kind: 'numberGroup', count: dist, objectType: 'star', colorId: 'yellow' }
            ]
          });
        });

        // --- NHÓM B: MẪU GIÁO 3 TUỔI (NHÃN THỐNG NHẤT CHỈ GHI TÊN MÀU) ---
        const c3List = ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink', 'white', 'black', 'brown'];
        c3List.forEach((cid, idx) => {
          const others = c3List.filter(c => c !== cid);
          const d1 = others[idx % others.length];
          const d2 = others[(idx + 3) % others.length];
          const def = TARGET_COLORS[cid];
          bank.push({
            id: `3yo_c_${idx}`,
            age: '3yo',
            planet: 'colors',
            containerType: 'basket',
            isExtended: cid === 'brown',
            promptText: `Bé hãy chọn ${def.exampleObj.toLowerCase()} nhé!`,
            hintText: `Con nhìn xem đồ vật nào có ${def.name.toLowerCase()}?`,
            targetKey: `c_${cid}`,
            options: [
              { key: `c_${cid}`, label: TARGET_COLORS[cid].name, kind: 'object', objectType: TARGET_COLORS[cid].objectType, colorId: cid, groupId: cid },
              { key: `c_${d1}`, label: TARGET_COLORS[d1].name, kind: 'object', objectType: TARGET_COLORS[d1].objectType, colorId: d1, groupId: d1 },
              { key: `c_${d2}`, label: TARGET_COLORS[d2].name, kind: 'object', objectType: TARGET_COLORS[d2].objectType, colorId: d2, groupId: d2 }
            ]
          });
        });

        const s3Keys = ['circle', 'square', 'triangle', 'rectangle'];
        for (let i = 0; i < 8; i++) {
          const t = s3Keys[i % 4];
          const others = s3Keys.filter(s => s !== t);
          const cols = ['red', 'blue', 'green', 'orange'];
          bank.push({
            id: `3yo_s_${i}`,
            age: '3yo',
            planet: 'shapes',
            containerType: 'house',
            promptText: `Bé hãy tìm ${SHAPES_DATA[t].name.toLowerCase()}!`,
            hintText: SHAPES_DATA[t].desc,
            targetKey: `s_${t}`,
            options: [
              { key: `s_${t}`, label: SHAPES_DATA[t].name, kind: 'object', objectType: t, colorId: cols[i % 4], groupId: t },
              { key: `s_${others[0]}`, label: SHAPES_DATA[others[0]].name, kind: 'object', objectType: others[0], colorId: cols[(i + 1) % 4], groupId: others[0] },
              { key: `s_${others[1]}`, label: SHAPES_DATA[others[1]].name, kind: 'object', objectType: others[1], colorId: cols[(i + 2) % 4], groupId: others[1] }
            ]
          });
        }

        for (let i = 0; i < 10; i++) {
          const isExt = i >= 6;
          const cnt = isExt ? (i - 6) + 6 : (i % 5) + 1;
          const d1 = cnt === 1 ? 2 : cnt - 1;
          const d2 = cnt >= 9 ? 5 : cnt + 1;
          bank.push({
            id: `3yo_n_${i}`,
            age: '3yo',
            planet: 'numbers',
            containerType: 'basket',
            isExtended: isExt,
            promptText: `Nhóm nào có ${cnt} ngôi sao vậy bé?`,
            hintText: `Con hãy đếm từ 1 đến ${cnt} nhé!`,
            targetKey: `cnt_${cnt}`,
            options: [
              { key: `cnt_${cnt}`, label: `${cnt} ngôi sao`, kind: 'numberGroup', count: cnt, objectType: 'star', colorId: 'yellow' },
              { key: `cnt_${d1}`, label: `${d1} ngôi sao`, kind: 'numberGroup', count: d1, objectType: 'star', colorId: 'yellow' },
              { key: `cnt_${d2}`, label: `${d2} ngôi sao`, kind: 'numberGroup', count: d2, objectType: 'star', colorId: 'yellow' }
            ]
          });
        }

        // --- NHÓM C & D: MẪU GIÁO 4 & 5 TUỔI ---
        const combos = [
          { shape: 'circle', color: 'red' }, { shape: 'square', color: 'blue' },
          { shape: 'triangle', color: 'yellow' }, { shape: 'rectangle', color: 'green' },
          { shape: 'circle', color: 'orange' }, { shape: 'triangle', color: 'purple' },
          { shape: 'square', color: 'pink' }, { shape: 'rectangle', color: 'red' }
        ];
        ['4yo', '5yo'].forEach(ageId => {
          combos.forEach((cb, idx) => {
            const altC = cb.color === 'red' ? 'blue' : 'red';
            const altS = cb.shape === 'circle' ? 'square' : 'circle';
            const lbl = `${SHAPES_DATA[cb.shape].name} ${TARGET_COLORS[cb.color].name.toLowerCase()}`;
            bank.push({
              id: `${ageId}_c_${idx}`,
              age: ageId,
              planet: 'colors',
              containerType: 'house',
              promptText: `Bé tìm ${lbl.toLowerCase()} nhé!`,
              hintText: `Chú ý cả ${SHAPES_DATA[cb.shape].name.toLowerCase()} và ${TARGET_COLORS[cb.color].name.toLowerCase()} nhé!`,
              targetKey: `${cb.shape}_${cb.color}`,
              options: [
                { key: `${cb.shape}_${cb.color}`, label: lbl, kind: 'object', objectType: cb.shape, colorId: cb.color },
                { key: `${cb.shape}_${altC}`, label: `${SHAPES_DATA[cb.shape].name} ${TARGET_COLORS[altC].name.toLowerCase()}`, kind: 'object', objectType: cb.shape, colorId: altC },
                { key: `${altS}_${cb.color}`, label: `${SHAPES_DATA[altS].name} ${TARGET_COLORS[cb.color].name.toLowerCase()}`, kind: 'object', objectType: altS, colorId: cb.color }
              ]
            });
          });

          const sPrompts = [
            { target: 'triangle', prompt: 'Hình nào có 3 cạnh và 3 góc nhọn?' },
            { target: 'square', prompt: 'Hình nào có 4 cạnh dài bằng nhau?' },
            { target: 'rectangle', prompt: 'Hình nào có 2 cạnh dài và 2 cạnh ngắn?' },
            { target: 'circle', prompt: 'Hình nào có đường bao cong tròn và không có góc?' },
            { target: 'rectangle', prompt: 'Bé phân biệt hình chữ nhật với hình vuông nhé!' },
            { target: 'triangle', prompt: 'Bé chọn hình tam giác nào!' }
          ];
          sPrompts.forEach((sp, idx) => {
            const others = s3Keys.filter(s => s !== sp.target);
            bank.push({
              id: `${ageId}_s_${idx}`,
              age: ageId,
              planet: 'shapes',
              containerType: 'house',
              promptText: sp.prompt,
              hintText: SHAPES_DATA[sp.target].desc,
              targetKey: `s_${sp.target}`,
              options: [
                { key: `s_${sp.target}`, label: SHAPES_DATA[sp.target].name, kind: 'object', objectType: sp.target, colorId: 'blue' },
                { key: `s_${others[0]}`, label: SHAPES_DATA[others[0]].name, kind: 'object', objectType: others[0], colorId: 'orange' },
                { key: `s_${others[1]}`, label: SHAPES_DATA[others[1]].name, kind: 'object', objectType: others[1], colorId: 'green' },
                { key: `s_${others[2]}`, label: SHAPES_DATA[others[2]].name, kind: 'object', objectType: others[2], colorId: 'purple' }
              ]
            });
          });

          for (let n = 1; n <= 10; n++) {
            const d1 = n === 1 ? 3 : n - 1;
            const d2 = n === 10 ? 7 : n + 1;
            bank.push({
              id: `${ageId}_n_${n}`,
              age: ageId,
              planet: 'numbers',
              containerType: 'basket',
              promptText: `Bé tìm nhóm có ${n} ngôi sao tương ứng với số ${n}!`,
              hintText: `Con đếm kỹ từng ngôi sao để tìm đúng số lượng ${n} nhé!`,
              targetKey: `cnt_${n}`,
              options: [
                { key: `cnt_${n}`, label: `${n} ngôi sao`, kind: 'numberGroup', count: n, objectType: 'star', colorId: 'yellow' },
                { key: `cnt_${d1}`, label: `${d1} ngôi sao`, kind: 'numberGroup', count: d1, objectType: 'star', colorId: 'yellow' },
                { key: `cnt_${d2}`, label: `${d2} ngôi sao`, kind: 'numberGroup', count: d2, objectType: 'star', colorId: 'yellow' }
              ]
            });
          }
        });

        // D4. Khối hình 3D (Mẫu giáo 5 tuổi)
        const solidKeys = ['sphere', 'cylinder', 'cube', 'cuboid'];
        const solidQuestions = [
          { target: 'sphere', prompt: 'Bé hãy chọn Khối cầu nào!' },
          { target: 'cylinder', prompt: 'Đâu là Khối trụ có hai mặt đáy tròn?' },
          { target: 'cube', prompt: 'Bé tìm Khối vuông có sáu mặt vuông bằng nhau!' },
          { target: 'cuboid', prompt: 'Bé hãy chọn Khối chữ nhật nhé!' },
          { target: 'sphere', prompt: 'Đồ vật nào có dạng Khối cầu?', real: true },
          { target: 'cylinder', prompt: 'Đồ vật nào có dạng Khối trụ?', real: true },
          { target: 'cube', prompt: 'Đồ vật nào có dạng Khối vuông?', real: true },
          { target: 'cuboid', prompt: 'Đồ vật nào có dạng Khối chữ nhật?', real: true }
        ];
        solidQuestions.forEach((sq, idx) => {
          const others = solidKeys.filter(k => k !== sq.target);
          const mk = sid => sq.real
            ? { key: `sol_${sid}`, label: SOLIDS_DATA[sid].realName, kind: 'realObject', solidId: sid, realType: SOLIDS_DATA[sid].realType, colorId: 'orange' }
            : { key: `sol_${sid}`, label: SOLIDS_DATA[sid].name, kind: 'solid', solidId: sid, colorId: sid === 'sphere' ? 'red' : sid === 'cylinder' ? 'blue' : sid === 'cube' ? 'yellow' : 'green' };
          bank.push({
            id: `5yo_sol_${idx}`,
            age: '5yo',
            planet: 'solids',
            containerType: 'house',
            promptText: sq.prompt,
            hintText: SOLIDS_DATA[sq.target].desc,
            targetKey: `sol_${sq.target}`,
            options: [mk(sq.target), mk(others[0]), mk(others[1]), mk(others[2])]
          });
        });

        return bank;
      }

      // =========================================================================
      // 5. TRẠNG THÁI ỨNG DỤNG & LƯU TRỮ LOCALSTORAGE
      // =========================================================================
      const State = {
        screen: 'welcome',
        age: localStorage.getItem('bkpng_age') || '2yo',
        planet: 'colors',
        mode: 'explore',
        game: 'tap',
        enableExtended: localStorage.getItem('bkpng_ext') === 'true',
        enableSolidsForAll: localStorage.getItem('bkpng_solids_all') === 'true',
        questionsPerSession: Number(localStorage.getItem('bkpng_qcount') || 5),
        soundEnabled: localStorage.getItem('bkpng_sound') !== 'false',
        speechRate: Number(localStorage.getItem('bkpng_rate') || 0.9),
        stats: JSON.parse(localStorage.getItem('bkpng_stats') || '{"sessions":0,"correct":0,"attempts":0}'),
        bank: buildDefaultBank(),
        // Trạng thái phiên học hiện tại
        exploreIdx: 0,
        sessionQuestions: [],
        qIdx: 0,
        currentOptions: [],
        selectedKey: null,
        isSolved: false,
        feedback: '',
        showHintGlow: false,
        hintTimer: null,
        // Trạng thái các game
        dragMatched: [],
        dragSelected: null,
        matchPairs: [],
        matchRight: [],
        matchLeftSel: null,
        matchSolved: [],
        starTarget: 3,
        starCounted: [],
        starSolved: false,
        sortBaskets: [],
        sortItems: [],
        sortDone: [],
        sortActiveKey: null,
        teacherTab: 'curriculum',
        lastCompletedTitle: ''
      };

      VoiceEngine.enabled = State.soundEnabled;
      VoiceEngine.rate = State.speechRate;
      VoiceEngine.init();

      function savePrefs() {
        localStorage.setItem('bkpng_age', State.age);
        localStorage.setItem('bkpng_ext', String(State.enableExtended));
        localStorage.setItem('bkpng_solids_all', String(State.enableSolidsForAll));
        localStorage.setItem('bkpng_qcount', String(State.questionsPerSession));
        localStorage.setItem('bkpng_sound', String(State.soundEnabled));
        localStorage.setItem('bkpng_rate', String(State.speechRate));
        localStorage.setItem('bkpng_stats', JSON.stringify(State.stats));
      }

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function getFilteredQuestions() {
        return State.bank.filter(q =>
          q.age === State.age &&
          q.planet === State.planet &&
          (State.enableExtended || !q.isExtended)
        );
      }

      function clearHintTimer() {
        if (State.hintTimer) {
          clearTimeout(State.hintTimer);
          State.hintTimer = null;
        }
      }

      // Chuyển tiếp giữa 6 trò chơi trong "Bé vui chơi" trước khi hoàn thành
      function advanceAfterGameFinished(finishedGameId, finishedGameTitle) {
        if (State.mode === 'play') {
          const idx = GAMES_LIST.findIndex(g => g.id === finishedGameId);
          if (idx >= 0 && idx < GAMES_LIST.length - 1) {
            const nextGame = GAMES_LIST[idx + 1];
            startGame(nextGame.id);
            return;
          }
        }
        State.stats.sessions++;
        savePrefs();
        State.lastCompletedTitle = finishedGameTitle;
        State.screen = 'complete';
        render();
        VoiceEngine.speak('Tuyệt vời! Bé đã chinh phục trọn vẹn các trò chơi ngân hà rồi!');
      }

      // =========================================================================
      // 6. KHỞI TẠO CÁC CHẾ ĐỘ HỌC & 6 TRÒ CHƠI
      // =========================================================================
      function startPractice(limit) {
        clearHintTimer();
        const pool = shuffle(getFilteredQuestions());
        State.sessionQuestions = pool.slice(0, Math.min(limit || State.questionsPerSession, pool.length));
        State.qIdx = 0;
        prepareQuestion();
      }

      function prepareQuestion() {
        clearHintTimer();
        State.selectedKey = null;
        State.isSolved = false;
        State.feedback = '';
        State.showHintGlow = false;
        const q = State.sessionQuestions[State.qIdx];
        if (!q) return;
        State.currentOptions = shuffle(q.options);
        render();
        VoiceEngine.speak(q.promptText);
        State.hintTimer = setTimeout(() => {
          if (!State.isSolved && State.screen === 'lesson') {
            State.showHintGlow = true;
            render();
          }
        }, 8500);
      }

      function startGame(gameId) {
        clearHintTimer();
        State.game = gameId;
        const pool = getFilteredQuestions();

        if (gameId === 'tap') {
          startPractice(Math.min(4, State.questionsPerSession));
          return;
        }
        if (gameId === 'challenge') {
          startPractice(State.questionsPerSession);
          return;
        }
        if (gameId === 'drag') {
          const q = pool[Math.floor(Math.random() * pool.length)] || pool[0];
          let dragOpts = [...q.options];
          // Khi thả hình vào ngôi nhà, luôn đảm bảo đủ 3 ngôi nhà chứa đúng hình có màu tương ứng
          if (q.containerType === 'house' && dragOpts.length < 3) {
            const extraShapes = [
              { key: 's_triangle', label: SHAPES_DATA.triangle.name, kind: 'object', objectType: 'triangle', colorId: 'green', groupId: 'triangle' },
              { key: 's_rectangle', label: SHAPES_DATA.rectangle.name, kind: 'object', objectType: 'rectangle', colorId: 'orange', groupId: 'rectangle' }
            ];
            for (const ex of extraShapes) {
              if (dragOpts.length < 3 && !dragOpts.some(o => o.key === ex.key)) {
                dragOpts.push(ex);
              }
            }
          }
          const dragQ = { ...q, options: dragOpts };
          State.sessionQuestions = [dragQ];
          State.currentOptions = shuffle(dragOpts);
          State.dragMatched = [];
          State.dragSelected = null;
          State.feedback = dragQ.containerType === 'basket'
            ? 'Bé hãy kéo từng đồ vật thả vào đúng chiếc giỏ cùng màu nhé!'
            : 'Bé hãy kéo từng hình thả vào đúng ngôi nhà có hình và màu tương ứng nhé!';
          render();
          VoiceEngine.speak(State.feedback);
          return;
        }
        if (gameId === 'match') {
          const count = State.age === '2yo' ? 2 : 3;
          let pairs = [];
          if (State.planet === 'numbers') {
            const nums = State.age === '2yo' ? [1, 3] : [2, 4, 5];
            pairs = nums.slice(0, count).map(n => ({
              id: `p_${n}`,
              left: { key: `l_${n}`, label: `Số ${n}`, kind: 'digit', count: n },
              right: { key: `r_${n}`, label: `${n} ngôi sao`, kind: 'numberGroup', count: n, objectType: 'star', colorId: 'yellow' }
            }));
          } else if (State.planet === 'solids') {
            pairs = ['sphere', 'cylinder', 'cube'].slice(0, count).map(sk => ({
              id: `p_${sk}`,
              left: { key: `l_${sk}`, label: SOLIDS_DATA[sk].name, kind: 'solid', solidId: sk },
              right: { key: `r_${sk}`, label: SOLIDS_DATA[sk].realName, kind: 'realObject', realType: SOLIDS_DATA[sk].realType }
            }));
          } else if (State.planet === 'shapes') {
            const shs = (State.age === '2yo' ? ['circle', 'square'] : ['circle', 'square', 'triangle']).slice(0, count);
            const cols = ['red', 'blue', 'yellow'];
            pairs = shs.map((sh, i) => ({
              id: `p_${sh}`,
              left: { key: `l_${sh}`, label: SHAPES_DATA[sh].name, kind: 'object', objectType: sh, colorId: cols[i] },
              right: { key: `r_${sh}`, label: SHAPES_DATA[sh].name, kind: 'object', objectType: sh, colorId: cols[i] }
            }));
          } else {
            const cols = ['red', 'yellow', 'blue'].slice(0, count);
            const objs = ['apple', 'star', 'ball'];
            pairs = cols.map((ck, i) => {
              const cLbl = colorLabelForAge(ck, State.age);
              return {
                id: `p_${ck}`,
                left: { key: `l_${ck}`, label: cLbl, kind: 'object', objectType: objs[i], colorId: ck },
                right: { key: `r_${ck}`, label: cLbl, kind: 'object', objectType: objs[i], colorId: ck }
              };
            });
          }
          State.matchPairs = pairs;
          State.matchRight = shuffle(pairs.map(p => ({ id: p.id, opt: p.right })));
          State.matchLeftSel = null;
          State.matchSolved = [];
          render();
          VoiceEngine.speak('Bé hãy tìm hai thẻ giống nhau hoặc tương ứng với nhau nhé!');
          return;
        }
        if (gameId === 'countStars') {
          State.starTarget = State.age === '2yo' ? (Math.floor(Math.random() * 3) + 1) : State.age === '3yo' ? (Math.floor(Math.random() * 5) + 1) : (Math.floor(Math.random() * 6) + 3);
          State.starCounted = [];
          State.starSolved = false;
          render();
          VoiceEngine.speak('Bé hãy chạm vào từng ngôi sao để cùng đếm nhé!');
          return;
        }
        if (gameId === 'sort') {
          if (State.planet === 'shapes') {
            State.sortBaskets = [
              { id: 'circle', label: 'Ngôi nhà Hình Tròn', colorId: 'red', shapeId: 'circle', containerType: 'house' },
              { id: 'square', label: 'Ngôi nhà Hình Vuông', colorId: 'blue', shapeId: 'square', containerType: 'house' }
            ];
            State.sortItems = shuffle([
              { key: 's1', label: 'Hình tròn', kind: 'object', objectType: 'circle', colorId: 'red', groupId: 'circle' },
              { key: 's2', label: 'Hình vuông', kind: 'object', objectType: 'square', colorId: 'blue', groupId: 'square' },
              { key: 's3', label: 'Hình tròn', kind: 'object', objectType: 'circle', colorId: 'red', groupId: 'circle' },
              { key: 's4', label: 'Hình vuông', kind: 'object', objectType: 'square', colorId: 'blue', groupId: 'square' }
            ]);
          } else {
            const blueLbl = colorLabelForAge('blue', State.age);
            State.sortBaskets = State.age === '2yo'
              ? [
                  { id: 'red', label: 'Giỏ Màu đỏ', colorId: 'red', containerType: 'basket' },
                  { id: 'yellow', label: 'Giỏ Màu vàng', colorId: 'yellow', containerType: 'basket' }
                ]
              : [
                  { id: 'red', label: 'Giỏ Màu đỏ', colorId: 'red', containerType: 'basket' },
                  { id: 'yellow', label: 'Giỏ Màu vàng', colorId: 'yellow', containerType: 'basket' },
                  { id: 'blue', label: `Giỏ ${blueLbl}`, colorId: 'blue', containerType: 'basket' }
                ];
            const items = [
              { key: 'c1', label: 'Màu đỏ', kind: 'object', objectType: 'apple', colorId: 'red', groupId: 'red' },
              { key: 'c2', label: 'Màu vàng', kind: 'object', objectType: 'star', colorId: 'yellow', groupId: 'yellow' },
              { key: 'c3', label: 'Màu đỏ', kind: 'object', objectType: 'ball', colorId: 'red', groupId: 'red' },
              { key: 'c4', label: 'Màu vàng', kind: 'object', objectType: 'flower', colorId: 'yellow', groupId: 'yellow' }
            ];
            if (State.age !== '2yo') {
              items.push({ key: 'c5', label: blueLbl, kind: 'object', objectType: 'car', colorId: 'blue', groupId: 'blue' });
            }
            State.sortItems = shuffle(items);
          }
          State.sortDone = [];
          State.sortActiveKey = null;
          render();
          VoiceEngine.speak('Bé hãy phân loại các đồ vật vào đúng chiếc giỏ cùng màu nhé!');
        }
      }

      // =========================================================================
      // 7. CÁC MÀN HÌNH GIAO DIỆN (RENDER)
      // =========================================================================
      function getExploreCards() {
        if (State.planet === 'colors') {
          const keys = State.age === '2yo'
            ? ['red', 'yellow', 'blue']
            : State.age === '3yo'
              ? (State.enableExtended ? ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink', 'white', 'black', 'brown'] : ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink', 'white', 'black'])
              : ['red', 'yellow', 'blue', 'green', 'orange', 'purple', 'pink', 'white', 'black', 'brown'];
          return keys.map(k => {
            const c = TARGET_COLORS[k];
            const title = colorLabelForAge(k, State.age);
            const exText = (State.age === '2yo' && k === 'blue') ? 'Quả bóng màu xanh' : c.exampleObj;
            return {
              title: title,
              desc: exText,
              speech: `Đây là ${title.toLowerCase()}. ${exText}!`,
              visual: renderObjectSVG(c.objectType, k, 165)
            };
          });
        }
        if (State.planet === 'shapes') {
          const keys = State.age === '2yo' ? ['circle', 'square'] : ['circle', 'square', 'triangle', 'rectangle'];
          const cols = ['red', 'blue', 'yellow', 'green'];
          return keys.map((k, i) => {
            const s = SHAPES_DATA[k];
            const cLbl = colorLabelForAge(cols[i], State.age).toLowerCase();
            return {
              title: `${s.name} ${cLbl}`,
              desc: `${s.desc} (${s.exampleObj})`,
              speech: `Đây là ${s.name.toLowerCase()} ${cLbl}. ${s.desc}`,
              visual: renderObjectSVG(k, cols[i], 165)
            };
          });
        }
        if (State.planet === 'numbers') {
          if (State.age === '2yo' && !State.enableExtended) {
            return [
              {
                title: 'Một ngôi sao màu vàng',
                desc: 'Chỉ có 1 ngôi sao đứng một mình.',
                speech: 'Đây là một ngôi sao màu vàng. Chỉ có một ngôi sao thôi nhé!',
                visual: renderOptionVisual({ kind: 'numberGroup', count: 1, objectType: 'star', colorId: 'yellow' }, 155)
              },
              {
                title: 'Nhiều ngôi sao màu vàng',
                desc: 'Có rất nhiều ngôi sao ở cạnh nhau.',
                speech: 'Còn đây là nhiều ngôi sao màu vàng. Có rất nhiều ngôi sao cùng nhau!',
                visual: renderOptionVisual({ kind: 'numberGroup', count: 5, objectType: 'star', colorId: 'yellow' }, 155)
              }
            ];
          }
          const maxN = State.age === '2yo' ? 5 : (State.age === '3yo' && !State.enableExtended ? 5 : 10);
          return Array.from({ length: maxN }, (_, i) => {
            const n = i + 1;
            return {
              title: `Số ${n}`,
              desc: `Có tất cả ${n} ngôi sao màu vàng.`,
              speech: `Đây là số ${n}. Có ${n} ngôi sao màu vàng lấp lánh!`,
              visual: `<div class="flex flex-col sm:flex-row items-center gap-6">${renderOptionVisual({ kind: 'digit', count: n }, 110)}${renderOptionVisual({ kind: 'numberGroup', count: n, objectType: 'star', colorId: 'yellow' }, 150)}</div>`
            };
          });
        }
        const solidColorNames = { sphere: 'màu đỏ', cylinder: 'màu xanh dương', cube: 'màu vàng', cuboid: 'màu xanh lá cây' };
        return Object.values(SOLIDS_DATA).map(s => ({
          title: `${s.name} ${solidColorNames[s.id]}`,
          desc: `${s.desc} Ví dụ: ${s.realName}.`,
          speech: `Đây là ${s.name.toLowerCase()} ${solidColorNames[s.id]}. ${s.desc}`,
          visual: `<div class="flex flex-col sm:flex-row items-center gap-6">${renderSolid3DSVG(s.id, 160)}<div class="flex flex-col items-center bg-[#F8F4EC] p-4 rounded-2xl">${renderRealObjectSVG(s.realType, 105)}<span class="text-sm font-extrabold mt-1">${s.realName}</span></div></div>`
        }));
      }

      function render() {
        const root = document.getElementById('app');
        if (!root) return;

        // ---------------- 1. MÀN HÌNH CHÀO MỪNG ----------------
        if (State.screen === 'welcome') {
          root.innerHTML = `
            <div class="flex-1 bg-gradient-to-b from-[#202E59] via-[#313B72] to-[#6C6AA7] text-white flex flex-col justify-between p-4 sm:p-8 relative overflow-hidden">
              <header class="relative z-10 flex flex-wrap items-center justify-between gap-2 max-w-6xl w-full mx-auto">
                <button id="btnToggleSound" class="min-h-[64px] px-5 rounded-2xl bg-white/15 hover:bg-white/25 font-bold text-base flex items-center gap-2 active:scale-95">
                  <span>${State.soundEnabled ? '🔊 Âm thanh: Bật' : '🔇 Âm thanh: Tắt'}</span>
                </button>
                <button id="btnTeacher" class="min-h-[64px] px-5 rounded-2xl bg-white/15 hover:bg-white/25 border border-white/25 font-bold text-base flex items-center gap-2 active:scale-95">
                  <span>⚙️ Góc giáo viên</span>
                </button>
              </header>

              <main class="relative z-10 max-w-4xl w-full mx-auto flex flex-col items-center text-center my-auto py-6">
                <div class="animate-float mb-3">${renderBeSao('welcome', 148)}</div>
                <div class="px-4 py-1.5 rounded-full bg-white/15 text-[#F8D375] font-bold text-sm sm:text-base mb-3">
                  ✨ Chào mừng các phi hành gia nhí!
                </div>
                <h1 class="text-3xl sm:text-5xl md:text-6xl font-black tracking-tight text-white drop-shadow mb-3">
                  BÉ KHÁM PHÁ NGÂN HÀ
                </h1>
                <p class="text-lg sm:text-2xl font-bold text-[#A8D6E8] max-w-2xl mb-8">
                  Vũ trụ Sắc màu – Hình dạng – Con số – Hình khối
                </p>
                <button id="btnStart" class="min-h-[84px] px-10 sm:px-14 rounded-3xl bg-[#F8D375] hover:bg-[#ffe08a] text-[#202E59] font-black text-2xl sm:text-3xl shadow-xl flex items-center gap-4 transition transform hover:scale-105 active:scale-95">
                  <span>🚀 BÉ BẮT ĐẦU</span>
                </button>
              </main>

              <footer class="relative z-10 text-center text-xs sm:text-sm text-white/80 max-w-4xl mx-auto">
                Giáo viên thực hiện: <strong>Lê Chinh Nhân</strong> – Trường Mầm non Giang Thành, Xã Giang Thành, Tỉnh An Giang
              </footer>
            </div>`;
          document.getElementById('btnToggleSound').onclick = () => { State.soundEnabled = !State.soundEnabled; VoiceEngine.enabled = State.soundEnabled; savePrefs(); render(); };
          document.getElementById('btnTeacher').onclick = () => { VoiceEngine.stop(); State.screen = 'teacher'; render(); };
          document.getElementById('btnStart').onclick = () => {
            VoiceEngine.speak('Chào bé yêu! Mình cùng chọn độ tuổi để bắt đầu chuyến du hành nhé!');
            State.screen = 'ageSelect';
            render();
          };
          return;
        }

        // ---------------- 2. MÀN HÌNH CHỌN ĐỘ TUỔI ----------------
        if (State.screen === 'ageSelect') {
          const cards = AGE_GROUPS.map(a => `
            <button data-age="${a.id}" style="background-color:${a.bg}; border-color:${State.age === a.id ? a.accent : 'transparent'}"
              class="age-card min-h-[120px] p-6 rounded-3xl border-4 text-left shadow-md hover:shadow-xl transition transform hover:-translate-y-1 active:scale-95 flex items-center justify-between">
              <div>
                <span style="background-color:${a.accent}" class="inline-block px-3.5 py-1 rounded-full text-white text-sm font-extrabold mb-2">${a.badge}</span>
                <h3 class="text-2xl sm:text-3xl font-black text-[#202E59]">${a.title}</h3>
