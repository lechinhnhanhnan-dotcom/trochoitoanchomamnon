            b.onclick = () => {
              clearHintTimer();
              VoiceEngine.stop();
              State.mode = b.getAttribute('data-m');
              if (State.mode === 'explore') {
                State.exploreIdx = 0;
                const cards = getExploreCards();
                render();
                if (cards[0]) VoiceEngine.speak(cards[0].speech);
              } else if (State.mode === 'practice') {
                startPractice(State.questionsPerSession);
              } else {
                startGame('tap');
              }
            };
          });
          document.querySelectorAll('.game-tab').forEach(b => {
            b.onclick = () => {
              VoiceEngine.stop();
              startGame(b.getAttribute('data-gid'));
            };
          });

          // Sự kiện Khám phá
          if (State.mode === 'explore') {
            const cards = getExploreCards();
            document.getElementById('btnReplayExplore').onclick = () => VoiceEngine.speak(cards[State.exploreIdx].speech);
            document.getElementById('btnPrevCard').onclick = () => {
              State.exploreIdx = (State.exploreIdx - 1 + cards.length) % cards.length;
              render();
              VoiceEngine.speak(cards[State.exploreIdx].speech);
            };
            const btnNext = document.getElementById('btnNextCard');
            if (btnNext) btnNext.onclick = () => { State.exploreIdx++; render(); VoiceEngine.speak(cards[State.exploreIdx].speech); };
            const btnGoP = document.getElementById('btnGoPractice');
            if (btnGoP) btnGoP.onclick = () => { State.mode = 'practice'; startPractice(State.questionsPerSession); };
          }

          // Sự kiện Thực hành / Chạm đúng / Thử thách (Nói xong trọn vẹn câu khen mới qua câu tiếp theo)
          if (State.mode === 'practice' || (State.mode === 'play' && (State.game === 'tap' || State.game === 'challenge'))) {
            const q = State.sessionQuestions[State.qIdx];
            document.getElementById('btnReplayQ').onclick = () => VoiceEngine.speak(q.promptText);
            document.querySelectorAll('.opt-btn').forEach(btn => {
              btn.onclick = () => {
                if (State.isSolved) return;
                const key = btn.getAttribute('data-opt');
                const opt = State.currentOptions.find(o => o.key === key);
                State.selectedKey = key;
                State.stats.attempts++;
                if (key === q.targetKey) {
                  clearHintTimer();
                  State.isSolved = true;
                  State.showHintGlow = false;
                  State.stats.correct++;
                  savePrefs();
                  const praise = PRAISES[Math.floor(Math.random() * PRAISES.length)];
                  State.feedback = praise;
                  render();
                  // Đọc hoàn chỉnh toàn bộ câu khen rồi mới tự động chuyển sang câu tiếp theo hoặc game kế tiếp
                  VoiceEngine.speak(`${praise} Đúng là ${opt.label.toLowerCase()} rồi!`, () => {
                    if (!State.isSolved || State.screen !== 'lesson') return;
                    if (State.qIdx < State.sessionQuestions.length - 1) {
                      State.qIdx++;
                      prepareQuestion();
                    } else {
                      const title = State.mode === 'practice' ? `${pTitle} - Thực hành` : `${pTitle} - ${GAMES_LIST.find(g => g.id === State.game).title}`;
                      advanceAfterGameFinished(State.game, title);
                    }
                  });
                } else {
                  savePrefs();
                  const enc = ENCOURAGES[Math.floor(Math.random() * ENCOURAGES.length)];
                  State.feedback = enc;
                  render();
                  VoiceEngine.speak(`${enc} ${q.hintText}`);
                }
              };
            });
            const btnNextQ = document.getElementById('btnNextQ');
            if (btnNextQ) {
              btnNextQ.onclick = () => {
                VoiceEngine.stop();
                if (State.qIdx < State.sessionQuestions.length - 1) {
                  State.qIdx++;
                  prepareQuestion();
                } else {
                  const title = State.mode === 'practice' ? `${pTitle} - Thực hành` : `${pTitle} - ${GAMES_LIST.find(g => g.id === State.game).title}`;
                  advanceAfterGameFinished(State.game, title);
                }
              };
            }
          }

          // Sự kiện Game 2: Kéo thả di chuyển thực thụ bằng ngón tay/chuột (Khen hết câu mới sang game 3)
          if (State.mode === 'play' && State.game === 'drag') {
            const q = State.sessionQuestions[0];
            document.getElementById('btnReplayDrag').onclick = () => VoiceEngine.speak(State.feedback);

            const verifyDrop = (srcKey, targetKey) => {
              if (State.dragMatched.includes(targetKey)) return;
              if (srcKey === targetKey) {
                State.dragMatched.push(targetKey);
                State.stats.correct++;
                State.stats.attempts++;
                savePrefs();
                if (State.dragMatched.length === q.options.length) {
                  State.feedback = 'Tuyệt vời! Bé đã đưa tất cả đồ vật về đúng chỗ rồi!';
                  render();
                  VoiceEngine.speak('Tuyệt vời! Bé đã đưa tất cả đồ vật về đúng chỗ rồi!', () => {
                    advanceAfterGameFinished('drag', `${pTitle} - Kéo thả thông minh`);
                  });
                } else {
                  State.feedback = 'Giỏi lắm! Đúng chỗ rồi, tiếp tục nào bé ơi!';
                  render();
                  VoiceEngine.speak('Giỏi lắm! Đúng chỗ rồi!');
                }
              } else {
                State.stats.attempts++;
                savePrefs();
                State.feedback = 'Con thử lại nhé! Nhìn kỹ xem màu nào giống nhau nào!';
                render();
                VoiceEngine.speak('Con thử lại nhé!');
              }
            };

            document.querySelectorAll('.drag-source').forEach(el => {
              const srcKey = el.getAttribute('data-src');
              el.onpointerdown = (e) => {
                if (State.dragMatched.includes(srcKey)) return;
                e.preventDefault();
                el.setPointerCapture(e.pointerId);
                const startX = e.clientX;
                const startY = e.clientY;
                el.style.position = 'relative';
                el.style.zIndex = '50';
                el.style.transition = 'none';
                el.style.transform = 'scale(1.08)';
                const opt = q.options.find(o => o.key === srcKey);
                if (opt) VoiceEngine.speak(opt.label);

                const onMove = (ev) => {
                  const dx = ev.clientX - startX;
                  const dy = ev.clientY - startY;
                  el.style.transform = `translate(${dx}px, ${dy}px) scale(1.08)`;
                  document.querySelectorAll('.drag-target').forEach(tEl => {
                    const r = tEl.getBoundingClientRect();
                    const inside = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
                    tEl.classList.toggle('ring-4', inside);
                    tEl.classList.toggle('ring-[#1976D2]', inside);
                    tEl.classList.toggle('scale-105', inside);
                  });
                };

                const onUp = (ev) => {
                  el.removeEventListener('pointermove', onMove);
                  el.removeEventListener('pointerup', onUp);
                  el.removeEventListener('pointercancel', onUp);
                  let droppedTargetKey = null;
                  document.querySelectorAll('.drag-target').forEach(tEl => {
                    tEl.classList.remove('ring-4', 'ring-[#1976D2]', 'scale-105');
                    const r = tEl.getBoundingClientRect();
                    if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
                      droppedTargetKey = tEl.getAttribute('data-target');
                    }
                  });
                  el.style.transition = 'transform 0.25s ease';
                  el.style.transform = 'translate(0px, 0px) scale(1)';
                  el.style.zIndex = '';
                  if (droppedTargetKey) {
                    verifyDrop(srcKey, droppedTargetKey);
                  }
                };

                el.addEventListener('pointermove', onMove);
                el.addEventListener('pointerup', onUp);
                el.addEventListener('pointercancel', onUp);
              };
            });
          }

          // Sự kiện Game 3: Tìm đôi bạn thân (Khen hết câu mới sang game 4)
          if (State.mode === 'play' && State.game === 'match') {
            document.querySelectorAll('.m-left').forEach(b => {
              b.onclick = () => {
                State.matchLeftSel = b.getAttribute('data-mleft');
                const p = State.matchPairs.find(x => x.id === State.matchLeftSel);
                if (p) VoiceEngine.speak(p.left.label);
                render();
              };
            });
            document.querySelectorAll('.m-right').forEach(b => {
              b.onclick = () => {
                const rid = b.getAttribute('data-mright');
                if (!State.matchLeftSel || State.matchSolved.includes(rid)) return;
                if (State.matchLeftSel === rid) {
                  State.matchSolved.push(rid);
                  State.matchLeftSel = null;
                  render();
                  if (State.matchSolved.length === State.matchPairs.length) {
                    VoiceEngine.speak('Tuyệt vời! Bé đã tìm đúng tất cả các đôi bạn thân rồi!', () => {
                      advanceAfterGameFinished('match', `${pTitle} - Tìm đôi bạn thân`);
                    });
                  } else {
                    VoiceEngine.speak('Đúng rồi! Giỏi lắm!');
                  }
                } else {
                  VoiceEngine.speak('Con thử lại nhé! Hai thẻ này chưa giống nhau rồi!');
                }
              };
            });
          }

          // Sự kiện Game 4: Đếm sao ngân hà (Khen hết câu mới sang game 5)
          if (State.mode === 'play' && State.game === 'countStars') {
            document.getElementById('btnReplayStar').onclick = () => VoiceEngine.speak('Bé hãy chạm vào từng ngôi sao để cùng đếm nhé!');
            document.querySelectorAll('.star-tap').forEach(b => {
              b.onclick = () => {
                const idx = Number(b.getAttribute('data-sidx'));
                if (State.starCounted.includes(idx)) return;
                State.starCounted.push(idx);
                render();
                if (State.starCounted.length === State.starTarget) {
                  VoiceEngine.speak(`${State.starCounted.length}! Có tất cả ${State.starTarget} ngôi sao! Giờ bé chọn số ${State.starTarget} bên dưới nhé!`);
                } else {
                  VoiceEngine.speak(`${State.starCounted.length}`);
                }
              };
            });
            document.querySelectorAll('.star-num').forEach(b => {
              b.onclick = () => {
                if (State.starSolved) return;
                const num = Number(b.getAttribute('data-snum'));
                if (num === State.starTarget) {
                  State.starSolved = true;
                  render();
                  VoiceEngine.speak(`Giỏi lắm! Đúng là số ${State.starTarget} rồi!`, () => {
                    advanceAfterGameFinished('countStars', `${pTitle} - Đếm sao ngân hà`);
                  });
                } else {
                  VoiceEngine.speak('Con thử lại nhé! Mình cùng đếm lại số ngôi sao trên bầu trời nào!');
                }
              };
            });
          }

          // Sự kiện Game 5: Phân loại tài giỏi (Khen hết câu mới sang game 6)
          if (State.mode === 'play' && State.game === 'sort') {
            document.querySelectorAll('.sort-item').forEach(b => {
              b.onclick = () => {
                State.sortActiveKey = b.getAttribute('data-sitem');
                const it = State.sortItems.find(x => x.key === State.sortActiveKey);
                if (it) VoiceEngine.speak(it.label);
                render();
              };
            });
            document.querySelectorAll('.sort-basket').forEach(b => {
              b.onclick = () => {
                const bid = b.getAttribute('data-sbasket');
                const cur = State.sortItems.find(x => x.key === State.sortActiveKey);
                if (!cur) return;
                if (cur.groupId === bid) {
                  State.sortDone.push(cur.key);
                  State.sortActiveKey = null;
                  render();
                  if (State.sortDone.length === State.sortItems.length) {
                    VoiceEngine.speak('Tuyệt vời! Bé đã phân loại đúng tất cả đồ vật vào giỏ rồi!', () => {
                      advanceAfterGameFinished('sort', `${pTitle} - Phân loại tài giỏi`);
                    });
                  } else {
                    VoiceEngine.speak('Giỏi lắm! Đúng giỏ rồi!');
                  }
                } else {
                  VoiceEngine.speak('Con thử lại nhé! Nhìn kỹ xem đồ vật này cùng màu với giỏ nào!');
                }
              };
            });
          }
          return;
        }

        // ---------------- 5. MÀN HÌNH HOÀN THÀNH ----------------
        if (State.screen === 'complete') {
          root.innerHTML = `
            <div class="flex-1 bg-[#F8F4EC] flex flex-col items-center justify-center p-6 text-center">
              <div class="max-w-xl w-full bg-white rounded-3xl p-8 sm:p-10 shadow-xl border-4 border-[#F8D375]">
                <div class="flex justify-center mb-4 animate-float">${renderBeSao('happy', 136)}</div>
                <div class="text-5xl mb-3">⭐⭐⭐</div>
                <h2 class="text-3xl sm:text-4xl font-black text-[#202E59] mb-2">Hoan hô phi hành gia nhí!</h2>
                <p class="text-lg sm:text-xl font-bold text-slate-600 mb-8">Bé đã hoàn thành xuất sắc: <span class="text-[#6C6AA7]">${State.lastCompletedTitle}</span></p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <button id="btnPlayAgain" class="min-h-[72px] rounded-2xl bg-[#F8D375] text-[#202E59] font-black text-xl shadow active:scale-95">🔄 Chơi lại</button>
                  <button id="btnGoMap" class="min-h-[72px] rounded-2xl bg-[#202E59] text-white font-black text-xl shadow active:scale-95">🌌 Về Ngân hà</button>
                </div>
              </div>
            </div>`;
          document.getElementById('btnPlayAgain').onclick = () => {
            State.screen = 'lesson';
            if (State.mode === 'play') startGame('tap');
            else startPractice(State.questionsPerSession);
          };
          document.getElementById('btnGoMap').onclick = () => {
            VoiceEngine.speak('Mình cùng quay về bản đồ ngân hà chọn hành tinh khác nhé!');
            State.screen = 'map';
            render();
          };
          return;
        }

        // ---------------- 6. GÓC GIÁO VIÊN ----------------
        if (State.screen === 'teacher') {
          root.innerHTML = `
            <div class="flex-1 bg-slate-50 text-slate-800 flex flex-col">
              <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4">
                <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <span class="text-xs font-extrabold uppercase text-[#6C6AA7]">Không gian quản lý sư phạm</span>
                    <h1 class="text-xl sm:text-2xl font-black text-[#202E59]">GÓC GIÁO VIÊN – BÉ KHÁM PHÁ NGÂN HÀ</h1>
                  </div>
                  <button id="btnExitTeacher" class="min-h-[52px] px-5 rounded-xl bg-[#202E59] text-white font-bold">⬅ Quay lại Bé học</button>
                </div>
              </header>
              <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-8 space-y-6">
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                  <h2 class="text-lg font-black text-[#202E59]">1. Cấu hình Chương trình & Giọng đọc miền Nam</h2>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <label class="flex items-center justify-between p-4 rounded-xl bg-slate-50 border">
                      <span class="font-bold">Bật nội dung mở rộng theo khả năng</span>
                      <input id="chkExt" type="checkbox" ${State.enableExtended ? 'checked' : ''} class="w-6 h-6 accent-[#202E59]"/>
                    </label>
                    <label class="flex items-center justify-between p-4 rounded-xl bg-slate-50 border">
                      <span class="font-bold">Mở Hành tinh Khối 3D cho mọi độ tuổi</span>
                      <input id="chkSolids" type="checkbox" ${State.enableSolidsForAll ? 'checked' : ''} class="w-6 h-6 accent-[#202E59]"/>
                    </label>
                  </div>
                  <div class="flex flex-wrap items-center gap-4 pt-2">
                    <button id="btnTestVoice" class="px-5 py-3 rounded-xl bg-[#F8D375] text-[#202E59] font-extrabold">🔊 Nghe thử giọng đọc miền Nam</button>
                    <span class="text-sm font-bold text-slate-600">Số lượt hoàn thành: ${State.stats.sessions} | Tỷ lệ đúng: ${State.stats.attempts ? Math.round((State.stats.correct / State.stats.attempts) * 100) : 0}%</span>
                  </div>
                </div>

                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-2 text-sm">
                  <h2 class="text-lg font-black text-[#202E59]">2. Thông tin Tác giả & Đơn vị</h2>
                  <p><strong>Ứng dụng:</strong> BÉ KHÁM PHÁ NGÂN HÀ (Vũ trụ sắc màu – Hình dạng – Con số – Hình khối)</p>
                  <p><strong>Giáo viên thực hiện:</strong> Cô giáo Lê Chinh Nhân – Trường Mầm non Giang Thành, Xã Giang Thành, Tỉnh An Giang</p>
                  <p><strong>Email liên hệ:</strong> lechinhnhanhnan@gmail.com</p>
                </div>
              </main>
            </div>`;
          document.getElementById('btnExitTeacher').onclick = () => { State.screen = 'map'; render(); };
          document.getElementById('chkExt').onchange = (e) => { State.enableExtended = e.target.checked; savePrefs(); };
          document.getElementById('chkSolids').onchange = (e) => { State.enableSolidsForAll = e.target.checked; savePrefs(); };
          document.getElementById('btnTestVoice').onclick = () => VoiceEngine.speak('Xin chào cô giáo Lê Chinh Nhân và các bé trường Mầm non Giang Thành! Giọng đọc tiếng Việt miền Nam đang hoạt động rất rõ ràng ạ!');
        }
      }

      render();
    })();
  </script>
</body>
</html>
